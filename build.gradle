plugins {
    id "fabric-loom" version "1.13-SNAPSHOT"
    id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "sparkdlc" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

// Headless game tests (src/gametest): `./gradlew runGameTest` boots a real server with all modules and runs them.
// The source set has its own mod id and is never part of the SparkDLC jar.
// 无界面游戏测试（src/gametest）：`./gradlew runGameTest` 启动加载全部模块的真实服务器并运行测试。
// 该源码集有自己的 mod id，不会进入 SparkDLC 的 jar。
fabricApi {
    configureTests {
        createSourceSet = true
        modId = "sparkdlc_gametest"
        enableGameTests = true
        enableClientGameTests = false
        eula = false
    }
}

// The client half of the boot check lives in the same source set (SparkDlcClientAudit), so it also sees client classes.
// `./gradlew runClientAudit` opens a real client window for about half a minute and closes it by itself.
// 启动检查的客户端部分与服务端部分在同一源码集（SparkDlcClientAudit），因此也需要看到客户端类。
// `./gradlew runClientAudit` 会打开真实客户端窗口约半分钟，然后自行关闭。
sourceSets.gametest {
    compileClasspath += sourceSets.client.compileClasspath + sourceSets.client.output
    runtimeClasspath += sourceSets.client.runtimeClasspath + sourceSets.client.output
}

// `-PstartupOrderDump=<directory>` makes runGameTest / runClientAudit write what the start-up registered, in order
// (gametest StartupOrderDump); two builds are then compared with a plain diff. In a development run Fabric Loader
// shuffles the mods on purpose, which moves other mods' listeners around ours from run to run; the shuffle is
// switched off for a dump run so that two dumps differ only where the code does.
// `-PstartupOrderDump=<目录>` 让 runGameTest / runClientAudit 按顺序写出启动时注册的内容（gametest 的 StartupOrderDump），
// 两个构建的结果可直接 diff。开发环境下 Fabric Loader 会故意打乱模组顺序，使其他模组的监听器每次运行都出现在我们监听器的
// 不同位置；导出时关闭打乱，这样两份导出只在代码不同之处有差异。
def startupOrderDump = { run ->
    if (project.hasProperty("startupOrderDump")) {
        run.vmArg "-Dsparkdlc.startupOrderDump=${file(project.property("startupOrderDump")).absolutePath}"
        run.vmArg "-Dfabric.debug.disableModShuffle=true"
    }
}

loom {
    runs {
        // Same DEBUG_INJECTORS reason as clientAudit below. / 与下方 clientAudit 相同的 DEBUG_INJECTORS 原因。
        gameTest {
            vmArg "-Dmixin.debug=false"
            startupOrderDump(it)
        }
        clientAudit {
            client()
            configName = "Client Audit"
            source sourceSets.gametest
            vmArg "-Dsparkdlc.clientAudit=true"
            // Mixin's dev-only DEBUG_INJECTORS turns every `require = 0` miss into a crash; several injectors are
            // written to miss on one of the two NoellesRoles builds. Production never runs that check.
            // Mixin 仅开发环境启用的 DEBUG_INJECTORS 会把每个 `require = 0` 的未命中变成崩溃；有几个注入器本来就
            // 设计为在两个 NoellesRoles 构建之一上未命中。正式环境不会执行这项检查。
            vmArg "-Dmixin.debug=false"
            startupOrderDump(it)
            runDir "build/run/clientAudit"
        }
        // Dev-only screenshots of the top-left in-round HUD (gametest `hudsnapshot` package): `./gradlew
        // runHudSnapshot` boots a real 1280x720 client in its own run directory, creates a throwaway void world,
        // fakes a running murder round on the integrated server, saves one PNG (plus a 2x crop of the top-left
        // corner) per case to build/run/hudSnapshot/snapshots and closes the game; the exit code is non-zero when a
        // case was not saved. `-PhudSnapshotCases=a,b` runs a subset, `-PhudSnapshotBackdrop=mid|sky|dark` picks
        // what is behind the HUD (a mid-tone wall by default). Not a check: nothing here is named `verify*`.
        // 仅供开发使用的对局左上角 HUD 截图（gametest 的 `hudsnapshot` 包）：`./gradlew runHudSnapshot` 在独立运行目录中
        // 启动真实的 1280x720 客户端，创建一次性虚空世界，在内置服务器上伪造一局进行中的谋杀对局，为每个用例保存一张 PNG
        // （外加左上角的 2 倍裁剪图）到 build/run/hudSnapshot/snapshots，然后自行关闭；有用例未保存时退出码非零。
        // `-PhudSnapshotCases=a,b` 只运行部分用例，`-PhudSnapshotBackdrop=mid|sky|dark` 选择 HUD 背后的内容（默认是中间调
        // 的墙）。它不是校验：这里没有任何以 `verify` 命名的东西。
        hudSnapshot {
            client()
            configName = "HUD Snapshot"
            source sourceSets.gametest
            vmArg "-Dsparkdlc.hudSnapshot=true"
            if (project.hasProperty("hudSnapshotCases")) {
                vmArg "-Dsparkdlc.hudSnapshot.cases=${project.property("hudSnapshotCases")}"
            }
            if (project.hasProperty("hudSnapshotBackdrop")) {
                vmArg "-Dsparkdlc.hudSnapshot.backdrop=${project.property("hudSnapshotBackdrop")}"
            }
            // Same DEBUG_INJECTORS reason as clientAudit above. / 与上方 clientAudit 相同的 DEBUG_INJECTORS 原因。
            vmArg "-Dmixin.debug=false"
            programArgs "--width", "1280", "--height", "720"
            runDir "build/run/hudSnapshot"
        }
    }
}

// Tests may exercise client classes (shared info card, guidebook layout, HUD rules).
// 测试会用到客户端类（共享信息卡、指南布局、HUD 规则）。
sourceSets.test {
    compileClasspath += sourceSets.client.output
    runtimeClasspath += sourceSets.client.output
}

repositories {
    mavenCentral()
    maven {
        name = "Mojang Libraries"
        url = "https://libraries.minecraft.net/"
    }
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    maven {
        name = "Ladysnake Mods"
        url = "https://maven.ladysnake.org/releases"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "Xander Maven"
        url = "https://maven.isxander.dev/releases"
        content {
            includeGroup "dev.isxander"
            includeGroup "org.quiltmc.parsers"
        }
    }
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/releases/"
    }
    maven {
        name = "Max Henkel"
        url = "https://maven.maxhenkel.de/repository/public"
    }
    maven {
        name = "Datasync"
        url = "https://maven.uuid.gg/releases"
    }
    maven {
        name = "Lucko"
        url = "https://repo.lucko.me/"
    }
    maven {
        // LambDynamicLights API, compile-only (see dependencies). / LambDynamicLights API，仅编译期（见 dependencies）。
        name = "Gegy Releases"
        url = "https://maven.gegy.dev/releases"
        content {
            includeGroup "dev.lambdaurora.lambdynamiclights"
        }
    }
    maven {
        name = "Create Mod"
        url = "https://maven.createmod.net"
        content {
            includeGroup "net.createmod.ponder"
            includeGroup "dev.engine-room.flywheel"
        }
    }
    maven {
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
        content {
            includeGroup "fuzs.forgeconfigapiport"
        }
    }
}

dependencies {
    def watheJar = file("libs/wathe-${project.wathe_version}.jar")
    if (!watheJar.isFile()) {
        throw new GradleException("Missing Wathe dependency jar: ${watheJar}")
    }
    def noellesRolesJar = file("libs/noellesroles-${project.noellesroles_version}.jar")
    if (!noellesRolesJar.isFile()) {
        throw new GradleException("Missing NoellesRoles dependency jar: ${noellesRolesJar}")
    }

    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modImplementation files(watheJar)
    modImplementation files(noellesRolesJar)
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cca_version}"
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cca_version}"
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-world:${project.cca_version}"
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-scoreboard:${project.cca_version}"
    modImplementation("dev.doctor4t:ratatouille:${project.ratatouille_version}") {
        exclude group: "dev.upcraft.datasync"
    }
    modRuntimeOnly "dev.upcraft.datasync:datasync-minecraft-1.21.1-fabric:0.10.2"
    modImplementation "me.lucko:fabric-permissions-api:0.3.1"
    modImplementation "dev.isxander:yet-another-config-lib:${project.yacl_version}"

    // Wathe bundles MidnightLib, but its jar on the dev classpath does not carry it. The assist settings screen
    // writes Wathe's client config through it, so it is also needed at compile time.
    // Wathe 自带 MidnightLib，但开发类路径上的 Wathe jar 不带它。assist 的设置界面通过它写入 Wathe 的客户端配置，
    // 因此编译期也需要。
    modCompileOnly "maven.modrinth:midnightlib:${project.midnightlib_version}"
    modRuntimeOnly "maven.modrinth:midnightlib:${project.midnightlib_version}"

    // Simple Voice Chat is optional at runtime: only the "voicechat" entrypoints touch its API.
    // Simple Voice Chat 在运行时可选：只有 "voicechat" 入口会接触它的 API。
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"
    modLocalRuntime "maven.modrinth:simple-voice-chat:fabric-${project.voicechat_version}"

    // LambDynamicLights API: compile-only from Gegy's maven, never committed or bundled (the Lambda License forbids
    // redistributing its binaries). Optional at runtime: only the "lambdynlights:initializer" and legacy
    // "dynamiclights" entrypoints name client/role/civilian/savior/SaviorDynamicLightsInitializer, so nothing loads the API
    // without LambDynamicLights. Non-transitive: compiling the initializer needs only the API's own classes.
    // LambDynamicLights API：仅编译期，从 Gegy maven 获取，绝不提交到仓库或打包进 jar（Lambda License 禁止再分发其二进制）。
    // 运行时可选：只有 "lambdynlights:initializer" 与旧版 "dynamiclights" 入口指向
    // client/role/civilian/savior/SaviorDynamicLightsInitializer，未安装 LambDynamicLights 时不会加载该 API。
    // 不传递依赖：编译该入口类只需要 API 自身的类。
    modCompileOnly("dev.lambdaurora.lambdynamiclights:lambdynamiclights-api:${project.lambdynlights_version}") {
        transitive = false
    }

    // Ponder is optional: the pack ships it with Flywheel, and the assist module only loads its scenes when it is present.
    // Ponder 为可选依赖：整合包自带它和 Flywheel，assist 模块只在它存在时加载演示场景。
    modCompileOnly("net.createmod.ponder:ponder-fabric:${project.ponder_version}") { transitive = false }
    modCompileOnly("dev.engine-room.flywheel:flywheel-fabric-api-1.21.1:${project.flywheel_version}") { transitive = false }
    modLocalRuntime("net.createmod.ponder:ponder-fabric:${project.ponder_version}") { transitive = false }
    modLocalRuntime("dev.engine-room.flywheel:flywheel-fabric-1.21.1:${project.flywheel_version}") { transitive = false }
    // Bundled inside the released Ponder jar, but Loom does not unpack nested jars for the dev runtime.
    // 正式版 Ponder jar 内已打包，但 Loom 开发运行环境不会解开内嵌 jar。
    modLocalRuntime("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:21.1.3") { transitive = false }
    localRuntime "com.electronwill.night-config:core:3.8.0"
    localRuntime "com.electronwill.night-config:toml:3.8.0"

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.3"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
    def expansions = [
            "version"             : project.version,
            "minecraft_version"   : project.minecraft_version,
            "loader_version"      : project.loader_version,
            "wathe_version"       : project.wathe_version,
            "noellesroles_version": project.noellesroles_version,
            "cca_version"         : project.cca_version,
            "ratatouille_version" : project.ratatouille_version
    ]
    inputs.properties expansions

    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand expansions
    }

    // The legacy-name table is tooling output and a runtime resource at once: LegacyIds reads it from the jar.
    // 旧名称对照表既是工具产物也是运行时资源：LegacyIds 从 jar 中读取它。
    from("tools/unify/legacy-ids.tsv") {
        into "sparkdlc"
    }
}

def noticeFiles = {
    from("LICENSE") {
        into "META-INF"
        rename { "LICENSE_SPARKDLC" }
    }
    from("LICENSE-TEXTURES.md") {
        into "META-INF"
        rename { "LICENSE-TEXTURES_SPARKDLC.md" }
    }
    from("THIRD_PARTY_NOTICES.md") {
        into "META-INF"
    }
    from("licenses") {
        into "META-INF/licenses"
    }
}

tasks.named("jar", noticeFiles)

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(targetJavaVersion)
}

tasks.test {
    useJUnitPlatform()
}

// `build` runs neither tests nor verify tasks; name them explicitly (see README.md).
// `build` 不运行测试，也不运行校验任务；需要时显式指定（见 README.md）。
tasks.named("check") {
    setDependsOn([])
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

tasks.named("sourcesJar", noticeFiles)

tasks.withType(JavaExec).configureEach {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        javaLauncher.set(javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(targetJavaVersion)
        })
    }
}

// Verification tasks live in gradle/verify, one script per kind of check (what is checked, not which of the five former
// mods a check came from); support.gradle holds the closures they share and is applied first. `verifyAll` is THE entry
// point: it runs every task listed here, and the guard below fails the build when a `verify*` task exists that
// `verifyAll` does not reach (or a listed one is gone), so a new check cannot be registered and then forgotten.
// 校验任务位于 gradle/verify，每类校验一个脚本（按“校验什么”划分，而不是按校验来自五个旧 mod 中的哪一个）；support.gradle 存放
// 它们共用的闭包，最先应用。`verifyAll` 是唯一的入口：它运行这里列出的每个任务；一旦存在 `verifyAll` 到达不了的 `verify*` 任务
// （或列出的任务已不存在），下方的守卫会让构建失败，因此新的校验不可能注册之后被遗忘。
def verifyScripts = [
        "support"           : [],
        "jar"               : ["verifyModMetadata", "verifyJarContents", "verifyMixinConfigs", "verifyNotices"],
        "upstream"          : ["verifyUpstreamJars"],
        "upstream-selectors": ["verifyUpstreamMixinSelectors", "verifyNoellesRolesLambdaSelectors"],
        "layering"          : ["verifyLayering", "verifyNoLookupByName"],
        "contracts"         : ["verifyContractFiles", "verifySourceContracts"],
        "payload-policy"    : ["verifyPayloadPolicy"],
        "black-raven"       : ["verifyBlackRavenSeams"],
        "entity-render"     : ["verifyEntityRenderProtocol"],
        "assets"            : ["verifySoundAssets"]
]
verifyScripts.keySet().each { script ->
    apply from: file("gradle/verify/${script}.gradle")
}
def verifyTasks = verifyScripts.values().flatten()
tasks.register("verifyAll") {
    group = "verification"
    description = "Runs every verify task of gradle/verify."
    dependsOn verifyTasks
}
afterEvaluate {
    def registered = tasks.names.findAll { it.startsWith("verify") && it != "verifyAll" } as Set
    def unreached = (registered - verifyTasks).sort()
    def missing = (verifyTasks - registered).sort()
    if (!unreached.isEmpty() || !missing.isEmpty()) {
        throw new GradleException("verifyAll must run every verify task: not reached by verifyAll ${unreached}, " +
                "listed in build.gradle but not registered ${missing}")
    }
}
