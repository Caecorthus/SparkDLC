// Verification tasks of the assist module (formerly the SparkAssist build script), applied by the root build.gradle.
// Every task carries the `Assist` infix; `verifyAssist` at the bottom runs them all. The root build owns plugins,
// repositories, dependencies, resources, the jar and the sources jar (including the notice files copied into both);
// this script only verifies.
// assist 模块的校验任务（原 SparkAssist 构建脚本），由根 build.gradle 应用。所有任务名都带 `Assist` 中缀，文件末尾的
// `verifyAssist` 汇总运行全部任务。插件、仓库、依赖、资源、jar 与源码 jar（含复制进两者的声明文件）由根构建负责，
// 本脚本只做校验。

// A script applied with `apply from:` does not see the root build's plugin classpath, so the ASM classes the bytecode
// check in verifyAssistModJar uses are declared here.
// 通过 `apply from:` 应用的脚本看不到根构建的插件类路径，因此 verifyAssistModJar 的字节码校验用到的 ASM 类在此显式声明。
buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.ow2.asm:asm-tree:9.9"
    }
}

def remappedModJar = tasks.named("remapJar")
def sourceArchive = tasks.named("sourcesJar")

// Mods whose roles, traits and sounds the guidebook and the audio settings page catalog. Standalone SparkAssist listed
// all four under `suggests`. In the fused mod NoellesRoles is a hard dependency and the three Spark mods are modules
// of this same jar, yet the assist code still asks FabricLoader#isModLoaded(<id>) before it shows their rows
// (client/settings/SparkDlcSettingsPages), which the fused mod answers through `provides`.
// 指南与音频设置页所收录的职业、特质和音效的来源 mod。独立的 SparkAssist 把这四个都列在 `suggests` 下。融合后 NoellesRoles
// 是硬依赖，三个 Spark mod 是同一个 jar 中的模块，但 assist 代码在显示它们的条目前仍会询问
// FabricLoader#isModLoaded(<id>)（client/settings/SparkDlcSettingsPages），融合后的 mod 通过 `provides` 满足该判断。
def requiredGuideProvider = "noellesroles"
def fusedGuideProviders = ["sparkwitch", "sparktraits", "sparkstrength"]
def supportedWatheVersion = "1.5.6-spark-1.21.1"
def supportedWatheJar = file("libs/wathe-${supportedWatheVersion}.jar")
// The checksum pin lives in gradle.properties (`wathe_sha256`), shared by every module's verify script.
// 校验和固定在 gradle.properties（`wathe_sha256`）中，由所有模块的校验脚本共用。
def supportedWatheSha256 = project.findProperty("wathe_sha256")?.toString() ?: ""
def watheExtendedCommit = "cf3c5c51f3dbc173778597bfb628a7b8e09ccadc"
def requiredWatheNotice = "Selected Wathe visual assets are © 2024 doctor4t. Wathe source code is\nnot copied or modified."
def watheExtendedLicense = "src/main/resources/META-INF/licenses/WATHE_EXTENDED_GPL-3.0.txt"
// The jar and the sources jar carry one set of notices for the whole mod: SparkDLC's own licenses, the merged
// THIRD_PARTY_NOTICES.md (its SparkAssist sections are checked below) and the Wathe Extended license text.
// jar 与源码 jar 为整个 mod 携带同一套声明：SparkDLC 自身的许可证、合并后的 THIRD_PARTY_NOTICES.md（下方校验其中的
// SparkAssist 章节）以及 Wathe Extended 许可证文本。
def distributionNotices = [
        "META-INF/LICENSE_SPARKDLC",
        "META-INF/LICENSE-TEXTURES_SPARKDLC.md",
        "META-INF/THIRD_PARTY_NOTICES.md",
        "META-INF/licenses/WATHE_EXTENDED_GPL-3.0.txt"
]

// SparkAssist was a client-only mod: `"environment": "client"` and no `main` entrypoint. The fused mod loads on both
// sides, so the rule is now stated for the assist module alone: nothing of it is started on the common side. No
// entrypoint other than `client` names an assist class, no `sparkassist:` cardinal component is declared, and the only
// assist mixin config is the client one, listed for the client environment. Returns what breaks the rule in a
// fabric.mod.json (source or packaged).
// SparkAssist 原本是仅客户端 mod：`"environment": "client"` 且没有 `main` 入口。融合后的 mod 两端都会加载，因此这条规则
// 现在只针对 assist 模块：它没有任何内容在通用端启动。除 `client` 外没有入口指向 assist 的类，没有声明 `sparkassist:`
// 组件，且 assist 唯一的 mixin 配置是仅限客户端环境的客户端配置。返回 fabric.mod.json（源文件或打包后）中违反规则之处。
//
// Since the stage-1 package move the assist module has neither a package nor a mixin config of its own, so the rule is
// restated on what replaced them:
// - "an assist class" is a class tools/unify/file-moves.tsv lists under the assist module (`legacyModules`);
// - the assist mixins are entries of the merged client config sparkdlc.client.mixins.json, which must be listed once,
//   for the client environment, and no sparkassist.* config may come back;
// - every assist mixin must be a `client` entry of that config and none may be in the merged common config
//   sparkdlc.mixins.json, which is what "no common assist mixin config" means now (assistMixinPlacementViolations).
// 第一阶段包搬迁之后，assist 模块既没有自己的包，也没有自己的 mixin 配置，因此这条规则改为针对取代它们的东西：
// - “assist 的类”即 tools/unify/file-moves.tsv 归在 assist 模块下的类（`legacyModules`）；
// - assist 的 mixin 是合并后的客户端配置 sparkdlc.client.mixins.json 中的条目，该配置必须只列出一次且仅限客户端环境，
//   并且不得再出现任何 sparkassist.* 配置；
// - 每个 assist mixin 都必须是该配置的 `client` 条目，且不得出现在合并后的通用配置 sparkdlc.mixins.json 中——这就是
//   “不存在 assist 的通用 mixin 配置”现在的含义（assistMixinPlacementViolations）。
apply from: rootProject.file("gradle/verify/legacy-modules.gradle")
def clientPackage = "dev.caecorthus.sparkdlc.client."
def assistClientMixinConfig = "sparkdlc.client.mixins.json"
def commonMixinConfig = "sparkdlc.mixins.json"
def assistClientOnlyViolations = { metadata ->
    def violations = []
    (metadata.entrypoints ?: [:]).each { key, listed ->
        if (key == "client") {
            return
        }
        (listed ?: []).each { entrypoint ->
            def className = (entrypoint instanceof Map ? entrypoint.value : entrypoint)?.toString()
            if (className != null && legacyModules.moduleOfClass(className) == "assist") {
                violations.add("entrypoint '${key}' lists ${className}".toString())
            }
        }
    }
    (metadata.custom?.get("cardinal-components") ?: []).each { componentId ->
        if (componentId.toString().startsWith("sparkassist:")) {
            violations.add("cardinal component ${componentId} is declared".toString())
        }
    }
    def configName = { entry -> (entry instanceof Map ? entry.config : entry)?.toString() }
    def legacyAssistConfigs = (metadata.mixins ?: []).findAll { configName(it)?.startsWith("sparkassist.") }
    if (!legacyAssistConfigs.isEmpty()) {
        violations.add("mixins must not list a sparkassist.* config any more; found ${legacyAssistConfigs}".toString())
    }
    def assistMixinEntries = (metadata.mixins ?: []).findAll { configName(it) == assistClientMixinConfig }
    def listsOnlyClientConfig = assistMixinEntries.size() == 1 && assistMixinEntries[0] instanceof Map &&
            assistMixinEntries[0].environment == "client"
    if (!listsOnlyClientConfig) {
        violations.add(("mixins must list ${assistClientMixinConfig} once, for the client environment; " +
                "found ${assistMixinEntries}").toString())
    }
    violations
}
// Where the assist mixins sit in the two merged mixin configs (parsed JSON, source or packaged): all of them under
// `client` of the client config, none anywhere else. Fails when the manifest lists no assist mixin.
// assist 的 mixin 在两份合并 mixin 配置（已解析的 JSON，源文件或打包后）中的位置：全部位于客户端配置的 `client` 下，
// 其他位置一个都没有。清单中没有任何 assist mixin 时失败。
def assistMixinPlacementViolations = { commonConfig, clientConfig ->
    def assistMixins = legacyModules.classNames("assist", "mixins")
    def listedClasses = { config, String key ->
        (config?.get(key) ?: []).collect { "${config.package}.${it}".toString() } as Set
    }
    def violations = []
    def missing = assistMixins - listedClasses(clientConfig, "client")
    if (!missing.isEmpty()) {
        violations.add("${assistClientMixinConfig} does not list the assist client mixins ${missing.sort()}".toString())
    }
    [(commonMixinConfig): commonConfig, (assistClientMixinConfig): clientConfig].each { label, config ->
        ["mixins", "server"].each { key ->
            def misplaced = listedClasses(config, key).intersect(assistMixins)
            if (!misplaced.isEmpty()) {
                violations.add("${label} lists assist mixins under '${key}': ${misplaced.sort()}".toString())
            }
        }
    }
    def inCommonClient = listedClasses(commonConfig, "client").intersect(assistMixins)
    if (!inCommonClient.isEmpty()) {
        violations.add("${commonMixinConfig} lists assist mixins under 'client': ${inCommonClient.sort()}".toString())
    }
    violations
}
// The catalog providers in a fabric.mod.json (source or packaged): NoellesRoles as a hard dependency with the given
// predicate, the three Spark ids and SparkAssist's own legacy id under `provides`, none of them left as a suggestion.
// fabric.mod.json（源文件或打包后）中的收录来源：NoellesRoles 是带给定谓词的硬依赖，三个 Spark id 与 SparkAssist 自己的
// 旧 id 位于 `provides`，且都不再作为 suggests 保留。
def guideProviderViolations = { metadata, String noellesRolesPredicate ->
    def violations = []
    if (metadata.depends?.get(requiredGuideProvider)?.toString() != noellesRolesPredicate) {
        violations.add(("catalog provider ${requiredGuideProvider} must be a hard dependency on " +
                "${noellesRolesPredicate}; found ${metadata.depends?.get(requiredGuideProvider)}").toString())
    }
    def providedIds = (metadata.provides ?: []).collect { it.toString() }
    (["sparkassist"] + fusedGuideProviders).each { modId ->
        if (!providedIds.contains(modId)) {
            violations.add("legacy mod id ${modId} must be listed under provides".toString())
        }
    }
    ([requiredGuideProvider] + fusedGuideProviders).each { modId ->
        if (metadata.suggests?.containsKey(modId)) {
            violations.add("catalog provider ${modId} cannot also be declared as an optional suggestion".toString())
        }
    }
    violations
}
def readClassNode = { java.util.zip.ZipFile archive, String entryName ->
    def entry = archive.getEntry(entryName)
    if (entry == null) {
        throw new GradleException("Missing class ${entryName} in ${archive.name}")
    }
    def node = new org.objectweb.asm.tree.ClassNode()
    archive.getInputStream(entry).withCloseable { input ->
        new org.objectweb.asm.ClassReader(input).accept(
                node,
                org.objectweb.asm.ClassReader.SKIP_DEBUG | org.objectweb.asm.ClassReader.SKIP_FRAMES
        )
    }
    node
}

def verifyAssistWatheDependency = tasks.register("verifyAssistWatheDependency") {
    group = "verification"
    description = "Checks the pinned Wathe jar the assist module was audited against: name, sha256 and embedded metadata."
    inputs.file(supportedWatheJar)
    inputs.property("wathe_version", project.wathe_version)
    inputs.property("expected_sha256", supportedWatheSha256)

    doLast {
        if (project.wathe_version != supportedWatheVersion) {
            throw new GradleException("wathe_version must remain pinned to ${supportedWatheVersion}")
        }
        if (!supportedWatheJar.isFile()) {
            throw new GradleException("Missing authorized Wathe dependency: ${supportedWatheJar}")
        }
        if (!(supportedWatheSha256 ==~ /[0-9a-f]{64}/)) {
            throw new GradleException("Missing or malformed wathe_sha256 pin in gradle.properties: ${supportedWatheSha256}")
        }

        def digest = java.security.MessageDigest.getInstance("SHA-256")
        supportedWatheJar.withInputStream { input ->
            byte[] buffer = new byte[8192]
            int bytesRead
            while ((bytesRead = input.read(buffer)) != -1) {
                digest.update(buffer, 0, bytesRead)
            }
        }
        def actualSha256 = digest.digest().encodeHex().toString()
        if (actualSha256 != supportedWatheSha256) {
            throw new GradleException("Unexpected Wathe jar checksum for ${supportedWatheJar.name}: ${actualSha256}")
        }

        def zipFile = new java.util.zip.ZipFile(supportedWatheJar)
        try {
            def metadataEntry = zipFile.getEntry("fabric.mod.json")
            if (metadataEntry == null) {
                throw new GradleException("Missing fabric.mod.json in ${supportedWatheJar.name}")
            }
            def metadata = new groovy.json.JsonSlurper().parse(zipFile.getInputStream(metadataEntry))
            if (metadata.id != "wathe"
                    || metadata.version != supportedWatheVersion
                    || metadata.environment != "*"
                    || metadata.depends?.minecraft != "~${project.minecraft_version}") {
                throw new GradleException("Unexpected embedded Wathe metadata in ${supportedWatheJar.name}")
            }
        } finally {
            zipFile.close()
        }
    }
}

// ADAPT: SparkAssist is no longer its own jar. Besides the jar/metadata version, the fused jar is checked for what
// replaced the standalone `client` entrypoint and `"environment": "client"`: the fused client entrypoint starts
// SparkAssistClient, the fused common entrypoint touches nothing of the assist module, and the assist mixin config
// holds client mixins only.
// 调整：SparkAssist 不再是独立 jar。除 jar 与元数据版本外，这里还校验融合 jar 中取代独立 `client` 入口和
// `"environment": "client"` 的内容：融合后的客户端入口会启动 SparkAssistClient，融合后的通用入口不接触 assist 模块的
// 任何内容，且 assist 的 mixin 配置只包含客户端 mixin。
def verifyAssistModJar = tasks.register("verifyAssistModJar") {
    group = "verification"
    description = "Checks the jar version and the assist module's client-only wiring in the remapped SparkDLC jar."
    dependsOn remappedModJar
    inputs.file(remappedModJar.flatMap { it.archiveFile })

    doLast {
        def jarFile = remappedModJar.get().archiveFile.get().asFile
        def archiveName = remappedModJar.get().archiveBaseName.get()
        def suffix = ".jar"
        if (!jarFile.name.startsWith("${archiveName}-") || !jarFile.name.endsWith(suffix)) {
            throw new GradleException("Cannot read version from jar filename: ${jarFile.name}")
        }

        // Keep the loader-visible mod version tied to the shipped jar filename.
        // 将加载器可见版本绑定到发布 jar 文件名，避免软件里显示旧版本。
        def jarVersion = jarFile.name.substring(archiveName.length() + 1, jarFile.name.length() - suffix.length())
        def zipFile = new java.util.zip.ZipFile(jarFile)
        try {
            def entry = zipFile.getEntry("fabric.mod.json")
            if (entry == null) {
                throw new GradleException("Missing fabric.mod.json in ${jarFile.name}")
            }

            def metadata = new groovy.json.JsonSlurper().parse(zipFile.getInputStream(entry))
            def metadataVersion = metadata.version?.toString()
            if (metadataVersion != jarVersion) {
                throw new GradleException("Jar version mismatch: ${jarFile.name} says ${jarVersion}, but fabric.mod.json says ${metadataVersion}")
            }

            if (metadata.id?.toString() != "sparkdlc") {
                throw new GradleException("Mod id drift in ${jarFile.name}: expected sparkdlc, found ${metadata.id}")
            }

            // The fused client entrypoint replaces the listed SparkAssistClient and must still start it. Since
            // stage 3 ("one entry") SparkAssistClient is no initializer any more; the client start-up is
            // SparkDLCClient itself, split into private steps, so "starts it" reads: some method of the entrypoint
            // class still loads the settings file, the first thing the assist client did.
            // 融合后的客户端入口取代了原先列出的 SparkAssistClient，且必须仍然启动它。第三阶段（“单一入口”）之后
            // SparkAssistClient 不再是初始化器；客户端启动流程就是拆成若干私有步骤的 SparkDLCClient 本身，
            // 因此“启动它”即：入口类的某个方法仍然加载设置文件，这是 assist 客户端原先做的第一件事。
            def fusedClientEntrypoint = "dev.caecorthus.sparkdlc.client.SparkDLCClient"
            def assistClientInitializer = "dev/caecorthus/sparkdlc/client/config/SparkAssistConfigManager"
            if (!(metadata.entrypoints?.client ?: []).contains(fusedClientEntrypoint)) {
                throw new GradleException("Missing client entrypoint ${fusedClientEntrypoint} in ${jarFile.name}")
            }
            def clientNode = readClassNode(zipFile, fusedClientEntrypoint.replace('.', '/') + ".class")
            def startsAssist = clientNode.methods.any { method ->
                method.instructions.toArray().any {
                    it instanceof org.objectweb.asm.tree.MethodInsnNode && it.owner == assistClientInitializer &&
                            it.name == "load"
                }
            }
            if (!startsAssist) {
                throw new GradleException(
                        "${fusedClientEntrypoint} no longer calls ${assistClientInitializer}#load in ${jarFile.name}"
                )
            }

            // Initializers are now called instead of listed, so "no main entrypoint" reads: the fused common
            // entrypoint (which also runs on a dedicated server) names no class of the assist module. Every class a
            // class file calls, instantiates, reads a field of or loads as a constant has a CONSTANT_Class entry
            // (tag 7) in its constant pool, so those entries are what is scanned.
            // 初始化器现在是被调用而不是被列出，因此“没有 main 入口”即：融合后的通用入口（专用服务器上也会运行）
            // 不引用 assist 模块的任何类。类文件调用、实例化、读取字段或作为常量加载的每个类，都会在常量池中留下
            // CONSTANT_Class 条目（tag 7），因此这里扫描的就是这些条目。
            // An assist class is one the move manifest lists under the assist module; a CONSTANT_Class entry holds an
            // internal name or, for an array type, a descriptor, so the SparkDLC class names are cut out of it.
            // assist 的类即搬迁清单归在 assist 模块下的类；CONSTANT_Class 条目保存内部名，数组类型则保存描述符，因此从中
            // 截取 SparkDLC 的类名。
            def fusedMainEntrypoint = "dev.caecorthus.sparkdlc.SparkDLC"
            def sparkDlcClassName = java.util.regex.Pattern.compile("dev/caecorthus/sparkdlc/[A-Za-z0-9_/\$]+")
            def scannedClassNames = new TreeSet<String>()
            def mainEntry = zipFile.getEntry(fusedMainEntrypoint.replace('.', '/') + ".class")
            if (mainEntry == null) {
                throw new GradleException("Missing main entrypoint class ${fusedMainEntrypoint} in ${jarFile.name}")
            }
            def mainReader = new org.objectweb.asm.ClassReader(zipFile.getInputStream(mainEntry).bytes)
            def assistReferences = new TreeSet<String>()
            char[] nameBuffer = new char[mainReader.maxStringLength]
            for (int index = 1; index < mainReader.itemCount; index++) {
                int offset = mainReader.getItem(index)
                if (offset > 0 && mainReader.readByte(offset - 1) == 7) {
                    def className = mainReader.readUTF8(offset, nameBuffer)
                    def named = sparkDlcClassName.matcher(className)
                    while (named.find()) {
                        scannedClassNames.add(named.group())
                        if (legacyModules.moduleOfClass(named.group()) == "assist") {
                            assistReferences.add(className)
                        }
                    }
                }
            }
            // The entrypoint is the whole common start-up and names every registry and service it starts, so a scan
            // that sees no SparkDLC class is broken, not clean.
            // 该入口就是完整的通用端启动流程，会引用它启动的每个注册表与服务，因此扫描不到任何 SparkDLC 类意味着扫描失效，
            // 而不是结果干净。
            if ((scannedClassNames - [fusedMainEntrypoint.replace('.', '/')]).isEmpty()) {
                throw new GradleException("The constant pool scan of ${fusedMainEntrypoint} found no SparkDLC class in ${jarFile.name}")
            }
            if (!assistReferences.isEmpty()) {
                throw new GradleException(
                        "SparkAssist must remain client-only, but ${fusedMainEntrypoint} references it in ${jarFile.name}: ${assistReferences}"
                )
            }

            // The config that carries the assist mixins ships with client mixins only, all in a client package, and
            // no common assist mixin config exists: the legacy file is gone and no assist mixin is in the merged
            // common config.
            // 承载 assist mixin 的配置只携带客户端 mixin，且全部位于客户端包内；不存在 assist 的通用 mixin 配置：旧文件已不
            // 存在，合并后的通用配置中也没有任何 assist mixin。
            if (zipFile.getEntry("sparkassist.mixins.json") != null) {
                throw new GradleException("SparkAssist must remain client-only: sparkassist.mixins.json is packaged in ${jarFile.name}")
            }
            def mixinConfigEntry = zipFile.getEntry(assistClientMixinConfig)
            if (mixinConfigEntry == null) {
                throw new GradleException("Missing ${assistClientMixinConfig} in ${jarFile.name}")
            }
            def mixinConfig = new groovy.json.JsonSlurper().parse(zipFile.getInputStream(mixinConfigEntry))
            def mixinPackage = mixinConfig.package?.toString()
            if (!mixinPackage?.startsWith(clientPackage)) {
                throw new GradleException("${assistClientMixinConfig} must keep its mixins in a client package; found ${mixinPackage}")
            }
            if (mixinConfig.mixins || mixinConfig.server || !mixinConfig.client) {
                throw new GradleException("${assistClientMixinConfig} must declare client mixins only in ${jarFile.name}")
            }
            mixinConfig.client.each { mixinName ->
                def mixinClass = "${mixinPackage}.${mixinName}".replace('.', '/') + ".class"
                if (zipFile.getEntry(mixinClass) == null) {
                    throw new GradleException("Missing client mixin class ${mixinClass} in ${jarFile.name}")
                }
            }
            def commonConfigEntry = zipFile.getEntry(commonMixinConfig)
            if (commonConfigEntry == null) {
                throw new GradleException("Missing ${commonMixinConfig} in ${jarFile.name}")
            }
            def placementViolations = assistMixinPlacementViolations(
                    new groovy.json.JsonSlurper().parse(zipFile.getInputStream(commonConfigEntry)), mixinConfig)
            if (!placementViolations.isEmpty()) {
                throw new GradleException("SparkAssist must remain client-only in ${jarFile.name}: ${placementViolations.join('; ')}")
            }
            logger.lifecycle("verifyAssistModJar: ${fusedMainEntrypoint} names ${scannedClassNames.size()} SparkDLC classes, none of the " +
                    "${legacyModules.classNames('assist').size()} assist classes; ${legacyModules.classNames('assist', 'mixins').size()} " +
                    "assist mixins are client entries of ${assistClientMixinConfig}")
        } finally {
            zipFile.close()
        }
    }
}

def verifyAssistArchitecture = tasks.register("verifyAssistArchitecture") {
    group = "verification"
    description = "Checks the assist module's contract files, client-only metadata, dependency declarations and third-party notices."
    // docs/local/ and src/test/ are gitignored and local-only (the two tracked Ponder tests aside), so the contract
    // files under them are required only in a checkout that has them; a fresh clone (CI) skips them. The local ADR is
    // required once the module's local docs tree docs/local/assist/ exists. src/test/ itself exists on a fresh clone
    // because of the tracked Ponder tests, so the contract tests are required once the assist test package holds any
    // test besides those two; tracking another assist test means adding it to trackedAssistTests.
    // docs/local/ 与 src/test/ 已被 gitignore 且仅存于本地（两个已入库的 Ponder 测试除外），因此只在拥有这些文件的检出中
    // 要求其下的契约文件；全新克隆（CI）会跳过。本地 ADR 在模块的本地文档树 docs/local/assist/ 存在时才要求。由于已入库的
    // Ponder 测试，全新克隆也存在 src/test/，因此契约测试在 assist 测试包中出现这两个以外的测试时才要求；若再入库其他
    // assist 测试，需把它加入 trackedAssistTests。
    // Since the stage-1 package move there is no assist test package: "an assist test besides those two" is a file the
    // local test manifest lists under the assist module (legacyModules.localTestsPresent), and the paths below are
    // relative to the shared test package root.
    // 第一阶段包搬迁之后不再有 assist 测试包：“这两个以外的 assist 测试”即本地测试清单归在 assist 模块下的文件
    // （legacyModules.localTestsPresent），下方路径相对于共用的测试包根目录。
    def localDocsTree = file("docs/local/assist")
    def assistTestPackage = "src/test/java/dev/caecorthus/sparkdlc"
    def trackedAssistTests = [
            "ponder/ActorMovementTest.java",
            "ponder/PonderCaptionBoundsTest.java"
    ]
    def trackedContractFiles = [
            "docs/assist/CONTEXT.md",
            "THIRD_PARTY_NOTICES.md",
            watheExtendedLicense
    ]
    def localContractDocs = [
            "docs/local/assist/adr/0001-risk-based-tests.md"
    ]
    def localContractTests = [
            "${assistTestPackage}/config/SparkAssistConfigTest.java",
            "${assistTestPackage}/guidebook/GuidebookCatalogTest.java",
            "${assistTestPackage}/guidebook/GuidebookObservationRulesTest.java",
            "${assistTestPackage}/guidebook/GuidebookSearchTest.java",
            "${assistTestPackage}/guidebook/GuidebookSessionStateTest.java",
            "${assistTestPackage}/input/InstinctKeyRulesTest.java",
            "${assistTestPackage}/input/InstinctToggleStateTest.java",
            "${assistTestPackage}/sound/EventSoundCatalogTest.java",
            "${assistTestPackage}/sound/EventSoundRefreshCategoriesTest.java",
            "${assistTestPackage}/sound/EventSoundVolumeRulesTest.java"
    ].collect { it.toString() }
    inputs.files(trackedContractFiles)
    inputs.files(localContractDocs)
    inputs.files(localContractTests)
    inputs.file("src/main/resources/fabric.mod.json")
    inputs.files("tools/unify/file-moves.tsv", "src/main/resources/${commonMixinConfig}",
            "src/client/resources/${assistClientMixinConfig}")
    inputs.property("wathe_version", project.wathe_version)

    doLast {
        def requiredFiles = [] + trackedContractFiles
        if (localDocsTree.isDirectory()) {
            requiredFiles += localContractDocs
        } else {
            logger.lifecycle("No local docs/local/assist tree: skipped "
                    + "${localContractDocs.size()} local-only architecture contract docs.")
        }
        def hasLocalTests = legacyModules.localTestsPresent(
                "assist", trackedAssistTests.collect { "${assistTestPackage}/${it}".toString() })
        if (hasLocalTests) {
            requiredFiles += localContractTests
        } else {
            logger.lifecycle("No local assist tests under ${assistTestPackage}: skipped "
                    + "${localContractTests.size()} local-only architecture contract tests.")
        }
        requiredFiles.each { requiredPath ->
            if (!file(requiredPath).isFile()) {
                throw new GradleException("Missing architecture contract file: ${requiredPath}")
            }
        }

        def metadata = new groovy.json.JsonSlurper().parse(file("src/main/resources/fabric.mod.json"))
        def clientOnlyViolations = assistClientOnlyViolations(metadata)
        if (file("src/main/resources/sparkassist.mixins.json").exists()) {
            clientOnlyViolations.add("a common mixin config src/main/resources/sparkassist.mixins.json exists")
        }
        if (!file("src/client/resources/${assistClientMixinConfig}").isFile()) {
            clientOnlyViolations.add("src/client/resources/${assistClientMixinConfig} is missing".toString())
        } else if (!file("src/main/resources/${commonMixinConfig}").isFile()) {
            clientOnlyViolations.add("src/main/resources/${commonMixinConfig} is missing".toString())
        } else {
            clientOnlyViolations.addAll(assistMixinPlacementViolations(
                    new groovy.json.JsonSlurper().parse(file("src/main/resources/${commonMixinConfig}")),
                    new groovy.json.JsonSlurper().parse(file("src/client/resources/${assistClientMixinConfig}"))))
        }
        if (!clientOnlyViolations.isEmpty()) {
            throw new GradleException("SparkAssist must remain client-only: ${clientOnlyViolations.join('; ')}")
        }
        if (project.wathe_version != supportedWatheVersion) {
            throw new GradleException("wathe_version must remain aligned with the Spark fork")
        }
        if (metadata.depends?.wathe != '${wathe_version}') {
            throw new GradleException("Wathe must be a hard dependency pinned through wathe_version")
        }
        if (metadata.suggests?.containsKey("wathe")) {
            throw new GradleException("Wathe cannot also be declared as an optional suggestion")
        }
        def providerViolations = guideProviderViolations(metadata, '${noellesroles_version}')
        if (!providerViolations.isEmpty()) {
            throw new GradleException("Catalog provider declarations drifted in fabric.mod.json: ${providerViolations.join('; ')}")
        }
        if (metadata.depends?.containsKey("ponder") || metadata.suggests?.get("ponder") != "*") {
            throw new GradleException("Ponder must stay an optional suggestion, never a hard dependency")
        }

        def notices = file("THIRD_PARTY_NOTICES.md").getText("UTF-8")
        if (!notices.replace("\r\n", "\n").contains(requiredWatheNotice)) {
            throw new GradleException("THIRD_PARTY_NOTICES.md is missing the required Wathe asset notice")
        }
        if (!notices.contains(watheExtendedCommit)
                || !notices.contains("clean reimplementation")
                || !notices.contains("No upstream source code was copied.")) {
            throw new GradleException("THIRD_PARTY_NOTICES.md is missing the Guidebook reimplementation provenance")
        }

        def upstreamLicense = file(watheExtendedLicense).getText("UTF-8")
        if (!upstreamLicense.contains("GNU GENERAL PUBLIC LICENSE")
                || !upstreamLicense.contains("Version 3, 29 June 2007")) {
            throw new GradleException("Vendored Wathe Extended license must contain the verbatim GPLv3 text")
        }
    }
}

def verifyAssistDistributionMetadata = tasks.register("verifyAssistDistributionMetadata") {
    group = "verification"
    description = "Checks the license and notice entries, packaged metadata and upstream isolation of the SparkDLC jar and sources jar."
    dependsOn remappedModJar
    inputs.file(remappedModJar.flatMap { it.archiveFile })
    dependsOn sourceArchive
    inputs.file(sourceArchive.flatMap { it.archiveFile })

    doLast {
        def jarFile = remappedModJar.get().archiveFile.get().asFile
        def zipFile = new java.util.zip.ZipFile(jarFile)
        try {
            distributionNotices.each { requiredEntry ->
                if (zipFile.getEntry(requiredEntry) == null) {
                    throw new GradleException("Missing distribution notice ${requiredEntry} in ${jarFile.name}")
                }
            }

            def packagedNotices = zipFile.getInputStream(zipFile.getEntry("META-INF/THIRD_PARTY_NOTICES.md")).getText("UTF-8")
            if (!packagedNotices.replace("\r\n", "\n").contains(requiredWatheNotice)
                    || !packagedNotices.contains(watheExtendedCommit)
                    || !packagedNotices.contains("No upstream source code was copied.")) {
                throw new GradleException("Packaged third-party notice is incomplete in ${jarFile.name}")
            }

            def packagedUpstreamLicense = zipFile.getInputStream(zipFile.getEntry("META-INF/licenses/WATHE_EXTENDED_GPL-3.0.txt")).getText("UTF-8")
            if (!packagedUpstreamLicense.contains("GNU GENERAL PUBLIC LICENSE")
                    || !packagedUpstreamLicense.contains("Version 3, 29 June 2007")) {
                throw new GradleException("Packaged Wathe Extended license is not GPLv3")
            }

            def metadataEntry = zipFile.getEntry("fabric.mod.json")
            if (metadataEntry == null) {
                throw new GradleException("Missing fabric.mod.json in ${jarFile.name}")
            }
            def metadata = new groovy.json.JsonSlurper().parse(zipFile.getInputStream(metadataEntry))
            def clientOnlyViolations = assistClientOnlyViolations(metadata)
            if (!clientOnlyViolations.isEmpty()) {
                throw new GradleException("Packaged SparkAssist metadata must remain client-only: ${clientOnlyViolations.join('; ')}")
            }
            if (metadata.license != ["AGPL-3.0-only", "LicenseRef-Textures-ARR"]) {
                throw new GradleException("Packaged SparkDLC metadata must declare AGPL-3.0-only code and ARR textures")
            }
            if (metadata.depends?.wathe != project.wathe_version.toString()) {
                throw new GradleException("Packaged Wathe dependency must match wathe_version")
            }
            if (metadata.suggests?.containsKey("wathe")) {
                throw new GradleException("Packaged metadata cannot suggest the required Wathe dependency")
            }
            def providerViolations = guideProviderViolations(metadata, project.noellesroles_version.toString())
            if (!providerViolations.isEmpty()) {
                throw new GradleException("Packaged catalog provider declarations drifted in ${jarFile.name}: ${providerViolations.join('; ')}")
            }

            def copiedUpstreamClass = zipFile.entries().find { entry ->
                entry.name.startsWith("cat/rezelyn/") || entry.name.startsWith("dev/doctor4t/")
                        || entry.name.startsWith("net/createmod/") || entry.name.startsWith("dev/engine_room/")
                        || entry.name.startsWith("META-INF/jars/")
            }
            if (copiedUpstreamClass != null) {
                throw new GradleException("Upstream class unexpectedly bundled in ${jarFile.name}: ${copiedUpstreamClass.name}")
            }
        } finally {
            zipFile.close()
        }
    }

    doLast {
        def sourcesFile = sourceArchive.get().archiveFile.get().asFile
        def sourcesZip = new java.util.zip.ZipFile(sourcesFile)
        try {
            distributionNotices.each { requiredEntry ->
                if (sourcesZip.getEntry(requiredEntry) == null) {
                    throw new GradleException("Missing source-distribution notice ${requiredEntry} in ${sourcesFile.name}")
                }
            }
            def sourceNotices = sourcesZip.getInputStream(
                    sourcesZip.getEntry("META-INF/THIRD_PARTY_NOTICES.md")
            ).getText("UTF-8")
            if (!sourceNotices.replace("\r\n", "\n").contains(requiredWatheNotice)
                    || !sourceNotices.contains(watheExtendedCommit)
                    || !sourceNotices.contains("No upstream source code was copied.")) {
                throw new GradleException("Source-distribution third-party notice is incomplete in ${sourcesFile.name}")
            }
        } finally {
            sourcesZip.close()
        }
    }
}

// Aggregate for the assist module; the root build's verifyAll depends on it.
// assist 模块的汇总任务；根构建的 verifyAll 依赖它。
tasks.register("verifyAssist") {
    group = "verification"
    description = "Runs every assist-module verify task."
    dependsOn verifyAssistWatheDependency
    dependsOn verifyAssistModJar
    dependsOn verifyAssistArchitecture
    dependsOn verifyAssistDistributionMetadata
}
