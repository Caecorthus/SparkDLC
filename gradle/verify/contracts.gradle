tasks.register("verifyContractFiles") {
    group = "verification"
    description = "Checks that the contract documents, public API sources and (in a checkout with the local trees) contract tests exist."
    inputs.files(trackedContractFiles)
    inputs.files(localContractDocs)
    inputs.files(localContractTests)

    doLast {
        def requiredFiles = [] + trackedContractFiles
        localContractDocs.groupBy { it.split("/")[0..2].join("/") }.each { localTree, documents ->
            if (file(localTree).isDirectory()) {
                requiredFiles += documents
            } else {
                logger.lifecycle("No local ${localTree} tree: skipped ${documents.size()} local-only contract documents.")
            }
        }
        if (verifySupport.localTestsPresent()) {
            requiredFiles += localContractTests
        } else {
            logger.lifecycle("No local tests under src/test: skipped ${localContractTests.size()} local-only contract tests.")
        }
        def missing = requiredFiles.findAll { !file(it).isFile() }
        if (!missing.isEmpty()) {
            throw new GradleException("Missing contract files: ${missing.join(', ')}")
        }
    }
}

tasks.register("verifySourceContracts") {
    group = "verification"
    description = "Checks ids and calls pinned by name: the Engineer capture device and power restoration ids, the capture device replay events, and the Vulture's direct call into the trait contract."
    dependsOn remappedModJar
    inputs.file(remappedModJar.flatMap { it.archiveFile })
    inputs.files(
            "src/main/java/dev/caecorthus/sparkdlc/role/neutral/vulture/VultureSuperCurseService.java",
            "src/main/java/dev/caecorthus/sparkdlc/SparkDlcItems.java",
            "src/main/java/dev/caecorthus/sparkdlc/SparkDlcEntities.java",
            "src/main/java/dev/caecorthus/sparkdlc/replay/role/CaptureDeviceReplayEvents.java"
    )

    doLast {
        def requireFile = { String path ->
            if (!file(path).isFile()) {
                throw new GradleException("Missing required verification file: ${path}")
            }
        }
        def requireText = { String path, String snippet ->
            requireFile(path)
            if (!file(path).getText("UTF-8").contains(snippet)) {
                throw new GradleException("Missing required contract '${snippet}' in ${path}")
            }
        }

        // A role reaches the trait feature through its contract SparkTraitsApi only, as a direct call: no bridge
        // class in between and no lookup by name. The general rule is verifyLayering ("trait-api"); this pins one
        // caller, the Vulture's helium curse, which asks hasActiveTrait itself.
        // 职业只经词条功能的契约 SparkTraitsApi 访问它，且为直接调用：中间不再有桥接类，也不按名称查找。通用规则见
        // verifyLayering（"trait-api"）；此处钉在一个调用方上：秃鹫的氦气诅咒自行调用 hasActiveTrait。
        requireText(
                "src/main/java/dev/caecorthus/sparkdlc/role/neutral/vulture/VultureSuperCurseService.java",
                "import dev.caecorthus.sparkdlc.trait.api.SparkTraitsApi;"
        )
        requireText(
                "src/main/java/dev/caecorthus/sparkdlc/role/neutral/vulture/VultureSuperCurseService.java",
                "SparkTraitsApi.hasActiveTrait(player, VultureSuperCurseRules.CHILDISH_TRAIT_ID)"
        )

        // Registry and replay ids that worlds, maps and saved replays hold by name.
        // 世界、地图与已保存回放按名称持有的注册 id 与回放 id。
        requireText("src/main/java/dev/caecorthus/sparkdlc/SparkDlcItems.java", "SparkDLC.id(\"capture_device\")")
        requireText("src/main/java/dev/caecorthus/sparkdlc/SparkDlcItems.java", "SparkDLC.id(\"power_restoration\")")
        requireText("src/main/java/dev/caecorthus/sparkdlc/SparkDlcEntities.java", "SparkDLC.id(\"capture_device\")")
        [
                "capture_device_placed",
                "capture_device_triggered",
                "capture_device_released",
                "capture_device_expired"
        ].each { replayId ->
            requireText(
                    "src/main/java/dev/caecorthus/sparkdlc/replay/role/CaptureDeviceReplayEvents.java",
                    "SparkDLC.id(\"${replayId}\")"
            )
        }

        // The contract call the source pin above names, in the remapped jar: VultureSuperCurseService reaches public
        // static boolean SparkTraitsApi.hasActiveTrait(PlayerEntity, Identifier) as a compiled invokestatic. The jar
        // is remapped, so the parameter types carry their intermediary names (class_1657 = PlayerEntity, class_2960 =
        // Identifier). The compiler already guarantees the method exists with this descriptor.
        // 上方源码钉值所指的契约调用在重映射 jar 中的形态：VultureSuperCurseService 以编译期 invokestatic 访问 public static
        // boolean SparkTraitsApi.hasActiveTrait(PlayerEntity, Identifier)。jar 已重映射，参数类型使用 intermediary 名称
        // （class_1657 = PlayerEntity，class_2960 = Identifier）。该方法及其描述符的存在已由编译器保证。
        def jarFile = remappedModJar.get().archiveFile.get().asFile
        def zipFile = new java.util.zip.ZipFile(jarFile)
        try {
            def vulture = readClassNode(zipFile, "dev/caecorthus/sparkdlc/role/neutral/vulture/VultureSuperCurseService.class")
            def callsFacade = vulture.methods.any { method ->
                method.instructions.toArray().any { instruction ->
                    instruction instanceof org.objectweb.asm.tree.MethodInsnNode &&
                            instruction.getOpcode() == org.objectweb.asm.Opcodes.INVOKESTATIC &&
                            instruction.owner == "dev/caecorthus/sparkdlc/trait/api/SparkTraitsApi" &&
                            instruction.name == "hasActiveTrait" &&
                            instruction.desc == "(Lnet/minecraft/class_1657;Lnet/minecraft/class_2960;)Z"
                }
            }
            if (!callsFacade) {
                throw new GradleException(
                        "VultureSuperCurseService must call SparkTraitsApi.hasActiveTrait(PlayerEntity, Identifier) directly in ${jarFile.name}"
                )
            }
        } finally {
            zipFile.close()
        }
    }
}
