// Verification tasks of the factionapi module (formerly the SparkFactionAPI build script), applied by the root
// build.gradle. Every task carries the `FactionApi` infix; `verifyFactionApi` at the bottom runs them all. The root
// build owns plugins, repositories, dependencies, resources and the jar; this script only verifies.
// factionapi 模块的校验任务（原 SparkFactionAPI 构建脚本），由根 build.gradle 应用。所有任务名都带 `FactionApi` 中缀，
// 文件末尾的 `verifyFactionApi` 汇总运行全部任务。插件、仓库、依赖、资源与 jar 由根构建负责，本脚本只做校验。

// A script applied with `apply from:` does not see the root build's plugin classpath, so the ASM classes the fused
// entrypoint check uses are declared here.
// 通过 `apply from:` 应用的脚本看不到根构建的插件类路径，因此融合入口校验用到的 ASM 类在此显式声明。
buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.ow2.asm:asm-tree:9.9"
        classpath "org.ow2.asm:asm-analysis:9.9"
    }
}

// `legacyModules.localTestsPresent`: whether this checkout has the factionapi module's local-only tests, read from the
// local test manifest (src/test/.unify-file-moves.tsv) now that the stage-1 package move left no test package of the
// module.
// `legacyModules.localTestsPresent`：当前检出是否带有 factionapi 模块仅存于本地的测试；第一阶段包搬迁之后该模块不再有
// 自己的测试包，因此读取本地测试清单（src/test/.unify-file-moves.tsv）。
apply from: rootProject.file("gradle/verify/legacy-modules.gradle")
def factionApiLocalDocs = "docs/local/factionapi"

def remappedModJar = tasks.named("remapJar")
// Legacy mod ids the factionapi module relies on at runtime; the fused mod answers them through `provides`.
// `sparkfactionapi` was this module's own mod id: CaecorthusTeamSync reads its mod container (the version handshake
// reads `sparkdlc` since the three handshakes became one). `sparkassist` owned the GuidebookDecorApi the info card
// used to reach by name; that is a compiled call now (GuidebookCardDecor), with no isModLoaded("sparkassist") gate
// and no lookup, but the id must stay provided and must never come back as a dependency on this mod itself, so the
// check below still covers it.
// factionapi 模块运行时依赖的旧 mod id；融合后的 mod 通过 `provides` 满足这些查找。`sparkfactionapi` 原是本模块自己的
// mod id：CaecorthusTeamSync 读取它的 mod 容器（三个握手合并为一个之后，版本握手读取的是 `sparkdlc`）。
// `sparkassist` 原先拥有信息卡按名称访问的 GuidebookDecorApi；如今是编译期调用（GuidebookCardDecor），既不以
// isModLoaded("sparkassist") 为前提也不再查找，但这个 id 仍须由
// `provides` 提供，且不得再作为针对本 mod 自身的依赖出现，因此下方的检查继续覆盖它。
def factionApiProvidedModIds = ["sparkfactionapi", "sparkassist"]

def readClassNode = { java.util.zip.ZipFile archive, String entryName ->
    def entry = archive.getEntry(entryName)
    if (entry == null) {
        throw new GradleException("Missing class ${entryName} in ${archive.name}")
    }
    def node = new org.objectweb.asm.tree.ClassNode()
    archive.getInputStream(entry).withCloseable { input ->
        new org.objectweb.asm.ClassReader(input).accept(
                node,
                org.objectweb.asm.ClassReader.SKIP_DEBUG | org.objectweb.asm.ClassReader.SKIP_FRAMES
        )
    }
    node
}

// ADAPT: SparkFactionAPI is no longer its own jar. The fused jar is checked for what the factionapi module still needs
// from it: the jar/metadata version, the fused entrypoints running the module's start-up calls, the
// provided legacy mod ids, the two merged mixin configs (which carry the factionapi mixins since the stage-1 package
// move) with the module's required mixins and its client plugin behind the composite one, and the required / retired
// runtime classes.
// 调整：SparkFactionAPI 不再是独立 jar。此处校验融合 jar 中 factionapi 模块仍然依赖的内容：jar 与元数据版本、融合后的入口
// 仍然发出本模块的启动调用、由 provides 提供的旧 mod id、两份合并后的 mixin 配置（第一阶段包搬迁
// 之后由它们承载 factionapi 的 mixin）及本模块必需的 mixin、位于组合插件之后的客户端插件，以及必需 / 已退役的运行时类。
def verifyFactionApiModJar = tasks.register("verifyFactionApiModJar") {
    group = "verification"
    description = "Checks the factionapi module's entrypoints, mixin configs, provided ids and required classes in the remapped SparkDLC jar."
    dependsOn remappedModJar
    inputs.file(remappedModJar.flatMap { it.archiveFile })

    doLast {
        def jarFile = remappedModJar.get().archiveFile.get().asFile
        def archiveName = remappedModJar.get().archiveBaseName.get()
        def suffix = ".jar"
        if (!jarFile.name.startsWith("${archiveName}-") || !jarFile.name.endsWith(suffix)) {
            throw new GradleException("Cannot read version from jar filename: ${jarFile.name}")
        }

        // Keep the loader-visible mod version tied to the shipped jar filename.
        // 将加载器可见版本绑定到发布 jar 文件名，避免软件里显示旧版本。
        def jarVersion = jarFile.name.substring(archiveName.length() + 1, jarFile.name.length() - suffix.length())
        def zipFile = new java.util.zip.ZipFile(jarFile)
        try {
            def entry = zipFile.getEntry("fabric.mod.json")
            if (entry == null) {
                throw new GradleException("Missing fabric.mod.json in ${jarFile.name}")
            }

            def metadata = new groovy.json.JsonSlurper().parse(zipFile.getInputStream(entry))
            def metadataVersion = metadata.version?.toString()
            if (metadataVersion != jarVersion) {
                throw new GradleException("Jar version mismatch: ${jarFile.name} says ${jarVersion}, but fabric.mod.json says ${metadataVersion}")
            }

            if (metadata.id?.toString() != "sparkdlc") {
                throw new GradleException("Mod id drift in ${jarFile.name}: expected sparkdlc, found ${metadata.id}")
            }

            // SparkFactionApiMod / SparkFactionApiClient used to be listed as the main / client entrypoints. The fused
            // entrypoints replace them in fabric.mod.json and must still start them.
            // SparkFactionApiMod / SparkFactionApiClient 原先直接列为 main / client 入口。融合后的入口在
            // fabric.mod.json 中取代了它们，且必须仍然启动它们。
            // Stage 3 ("one entry"): the per-module initializer classes are gone; SparkDLC / SparkDLCClient are the
            // whole start-up, split into private steps. "The fused entrypoint still starts this module" therefore
            // reads: some method of the entrypoint class still makes the module's characteristic start-up call.
            // 第三阶段（“单一入口”）：各模块的初始化类已不存在；SparkDLC / SparkDLCClient 就是完整的启动流程，拆成若干私有步骤。
            // 因此“融合后的入口仍然启动本模块”即：入口类的某个方法仍然发出本模块特有的启动调用。
            [
                    [key: "main", entrypoint: "dev.caecorthus.sparkdlc.SparkDLC",
                     startOwner: "dev/caecorthus/sparkdlc/faction/api/SparkFactionApi", startCall: "bootstrap"],
                    [key: "client", entrypoint: "dev.caecorthus.sparkdlc.client.SparkDLCClient",
                     startOwner: "dev/caecorthus/sparkdlc/client/replay/ReplayClient", startCall: "register"]
            ].each { fused ->
                if (!(metadata.entrypoints?.get(fused.key) ?: []).contains(fused.entrypoint)) {
                    throw new GradleException("Missing ${fused.key} entrypoint ${fused.entrypoint} in ${jarFile.name}")
                }
                def entrypointNode = readClassNode(zipFile, fused.entrypoint.replace('.', '/') + ".class")
                def startsModule = entrypointNode.methods.any { method ->
                    method.instructions.toArray().any {
                        it instanceof org.objectweb.asm.tree.MethodInsnNode && it.owner == fused.startOwner
                                && it.name == fused.startCall
                    }
                }
                if (!startsModule) {
                    throw new GradleException(
                            "${fused.entrypoint} no longer calls ${fused.startOwner}#${fused.startCall} in ${jarFile.name}"
                    )
                }
            }

            // The legacy ids must be provided by the fused mod and must not come back as dependency predicates on
            // this mod itself (see factionApiProvidedModIds above).
            // 这些旧 id 必须由融合后的 mod 通过 provides 提供，且不得再作为针对本 mod 自身的依赖谓词出现
            // （见上方 factionApiProvidedModIds）。
            def provides = metadata.provides ?: []
            factionApiProvidedModIds.each { modId ->
                if (!provides.contains(modId)) {
                    throw new GradleException("Missing provided mod id ${modId} in ${jarFile.name}")
                }
                ["depends", "recommends", "suggests", "conflicts", "breaks"].each { relation ->
                    if (metadata.get(relation)?.containsKey(modId)) {
                        throw new GradleException(
                                "Stale ${relation} entry for the fused module id ${modId} in ${jarFile.name}"
                        )
                    }
                }
            }

            // The two merged mixin configs, which now hold the factionapi mixins, must stay listed, the client one
            // for the client environment only.
            // 现在承载 factionapi mixin 的两份合并配置都必须保持列出，其中客户端配置仅限客户端环境。
            def listedMixins = metadata.mixins ?: []
            def registeredMixins = listedMixins.collect { mixin ->
                mixin instanceof Map ? mixin.config?.toString() : mixin?.toString()
            }
            if (!registeredMixins.contains("sparkdlc.mixins.json")) {
                throw new GradleException("Missing common mixin registration in ${jarFile.name}")
            }
            if (!listedMixins.any {
                it instanceof Map && it.config == "sparkdlc.client.mixins.json" && it.environment == "client"
            }) {
                throw new GradleException(
                        "sparkdlc.client.mixins.json is not listed for the client environment in fabric.mod.json of ${jarFile.name}"
                )
            }

            [
                    "dev/caecorthus/sparkdlc/client/SparkDLCClient.class",
                    "dev/caecorthus/sparkdlc/client/net/version/SparkDlcClientVersionHandshake.class",
                    "dev/caecorthus/sparkdlc/net/version/SparkDlcVersionHandshake.class",
