                    "faction.GameRoundEndComponentMixin",
                    "faction.GameWorldComponentReplayMixin",
                    "faction.ReplayGeneratorMixin",
                    "record.GameFunctionsKillSnapshotMixin",
                    "record.GameRecordManagerDeathMixin",
                    "record.GameRecordManagerIncomeMixin",
                    "record.ItemStackConsumeMixin",
                    "record.PlayerShopComponentIncomeMixin",
                    "record.PoisonUtilsConsumeMixin",
                    "round.mapreset.AutoStartComponentMapResetMixin",
                    "round.mapreset.CommandManagerMapResetMixin",
                    "round.mapreset.GameFunctionsMapResetMixin",
                    "round.mapreset.MapVotingComponentMapResetMixin",
                    "inventory.PlayerInventoryRowOrderMixin",
                    "inventory.ScreenHandlerPsychoSecondRowMixin",
                    "inventory.ShopEntrySecondRowMixin",
                    "faction.AntiFastRoundPayloadGuardMixin",
                    "team.GameFunctionsLetterNameMixin",
                    "team.PlayerEntityTeamTagMixin",
                    "faction.thirdfaction.GameSettingsCommandThirdFactionMixin"
            ],
                    "sparkdlc.client.mixins.json": [
                            "faction.RoundTextRendererMixin",
                            "compat.noellesroles.NoellesScavengerBodyHideNeutralPerkMixin",
                            "compat.noellesroles.NoellesScavengerBodyTargetNeutralPerkMixin",
                            "inventory.LimitedHandledScreenSecondRowMixin",
                            "inventory.LimitedInventoryScreenSecondRowMixin",
                            "team.NoellesPuppetNameTeamTagMixin",
                            "team.PlayerListHudTeamTagMixin",
                            "team.RoleNameRendererTeamTagMixin"
                    ]
            ].each { mixinConfigEntry, requiredMixins ->
                def mixinEntry = zipFile.getEntry(mixinConfigEntry)
                if (mixinEntry == null) {
                    throw new GradleException("Missing mixin config ${mixinConfigEntry} in ${jarFile.name}")
                }
                def mixinConfig = new groovy.json.JsonSlurper().parse(zipFile.getInputStream(mixinEntry))
                def configuredMixins = (mixinConfig.mixins ?: []) + (mixinConfig.client ?: []) + (mixinConfig.server ?: [])
                requiredMixins.each { requiredMixin ->
                    if (!configuredMixins.contains(requiredMixin)) {
                        throw new GradleException("Missing mixin ${requiredMixin} in ${mixinConfigEntry} inside ${jarFile.name}")
                    }
                }
                // The client plugin rewrites NoellesRoles' merged Scavenger handler; without it D3 silently breaks.
                // 客户端插件改写 NoellesRoles 合并的清道夫处理器；缺少它 D3 会静默失效。
                // Stage 3 ("one entry") folded the three legacy plugins into the one plugin of the merged client
                // config. The requirement is therefore: the merged config names that plugin, and its postApply still
                // runs the Scavenger rewrite (bytecode; the plugin is among the required runtime classes above).
                // 第三阶段（“单一入口”）把三个旧插件并入合并后客户端配置唯一的插件。于是要求变为：合并配置指定该插件，
                // 且它的 postApply 仍然执行清道夫改写（字节码校验；该插件已列在上方必需的运行时类中）。
                def requiredPlugin = [
                        "sparkdlc.client.mixins.json": "dev.caecorthus.sparkdlc.client.SparkDlcClientMixinPlugin"
                ][mixinConfigEntry]
                if (requiredPlugin != null && mixinConfig.plugin?.toString() != requiredPlugin) {
                    throw new GradleException("Missing mixin plugin ${requiredPlugin} in ${mixinConfigEntry} inside ${jarFile.name}")
                }
                if (requiredPlugin != null) {
                    def scavengerRewrite = "dev/caecorthus/sparkdlc/compat/noellesroles/NoellesScavengerBodyHideRewrite"
                    def pluginNode = readClassNode(zipFile, requiredPlugin.replace('.', '/') + ".class")
                    def runsScavengerRewrite = pluginNode.methods.any { method ->
                        method.name == "postApply" && method.instructions.toArray().any {
                            it instanceof org.objectweb.asm.tree.MethodInsnNode && it.owner == scavengerRewrite
                                    && it.name == "rewrite"
                        }
                    }
                    if (!runsScavengerRewrite) {
                        throw new GradleException(
                                "${requiredPlugin}#postApply no longer runs ${scavengerRewrite} in ${jarFile.name}"
                        )
                    }
                }
            }
        } finally {
            zipFile.close()
        }
    }
}

