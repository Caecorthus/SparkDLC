// docs/local/ and src/test/ are gitignored and local-only, so the contract files under them are required only in a
// checkout that has the matching local tree; a fresh clone (CI) skips them. In SparkDLC src/test/ itself exists on a
// fresh clone (a few assist tests are tracked) and docs/ holds the tracked module docs, so each condition is the
// factionapi module's own local tree: its test package for src/test/ files, docs/local/factionapi for docs/local/
// files. The two trees are imported separately, so one may be present without the other.
// docs/local/ 与 src/test/ 已被 gitignore 且仅存于本地，因此只在拥有对应本地目录的检出中要求其下的契约文件；全新克隆（CI）会跳过。
// 在 SparkDLC 中，全新克隆也存在 src/test/（assist 有少量已跟踪的测试），docs/ 下则是已跟踪的模块文档，因此条件改为
// factionapi 模块自己的本地目录：src/test/ 下的文件看它的测试包，docs/local/ 下的文件看 docs/local/factionapi。
// 这两个目录是分别导入的，可能只存在其中一个。
def localOnlyContractTrees = [
        "docs/local/": file(factionApiLocalDocs),
        "src/test/"  : file(factionApiLocalTests)
]
def localOnlyContractTree = { String path -> localOnlyContractTrees.find { prefix, tree -> path.startsWith(prefix) } }

def verifyFactionApiArchitecture = tasks.register("verifyFactionApiArchitecture") {
    group = "verification"
    description = "Verifies the factionapi module's public compatibility and representative contract tests."
    def allContractFiles = contractFiles + architectureContractFiles
    def skippedContractFiles = allContractFiles.findAll { path ->
        def localTree = localOnlyContractTree(path)
        localTree != null && !localTree.value.isDirectory()
    }
    def requiredContractFiles = allContractFiles - skippedContractFiles
    inputs.files(requiredContractFiles.collect { file(it) })

    doLast {
        skippedContractFiles.groupBy { localOnlyContractTree(it).value }.each { localTree, skipped ->
            logger.lifecycle("No local ${project.relativePath(localTree)} tree: skipped "
                    + "${skipped.size()} local-only architecture contract files.")
        }
        requiredContractFiles.each { requiredPath ->
            if (!file(requiredPath).isFile()) {
                throw new GradleException("Missing architecture contract file: ${requiredPath}")
            }
        }
    }
}

// Aggregate for the factionapi module; the root build's verifyAll depends on it.
// factionapi 模块的汇总任务；根构建的 verifyAll 依赖它。
// The locked-player payload policy: every C2S payload any module registers has a row in
// config/payload-policy/actions.tsv, owned by the registering module, and each GeneratedPayloadPolicy.java is
// byte-identical to what the table generates. One run covers all modules now that they share the tree.
// 锁定玩家数据包策略：任何模块注册的每个 C2S 数据包在 config/payload-policy/actions.tsv 中都有一行、归属于注册它的
// 模块，且每个 GeneratedPayloadPolicy.java 与规范表生成结果逐字节一致。模块共用一棵源码树后，一次运行即可覆盖全部模块。
def verifyFactionApiPayloadPolicy = tasks.register("verifyFactionApiPayloadPolicy", Exec) {
    group = "verification"
    description = "Checks every module against the canonical payload policy table."
    inputs.file("tools/payload_policy.py")
    inputs.dir("config/payload-policy")
    inputs.files(fileTree("src/main/java") { include "**/*.java" }, fileTree("src/client/java") { include "**/*.java" })
    outputs.upToDateWhen { true }
    workingDir = rootDir
    commandLine "python3", "tools/payload_policy.py", "check-all", "--repo", "."
}

tasks.register("verifyFactionApi") {
    group = "verification"
    description = "Runs every factionapi-module verify task."
    dependsOn verifyFactionApiModJar
    dependsOn verifyFactionApiArchitecture
    dependsOn verifyFactionApiPayloadPolicy
}
