                    "dev/caecorthus/sparkdlc/faction/api/EntityCollisionExemption.class",
                    "dev/caecorthus/sparkdlc/faction/collision/EntityCollisionExemptions.class",
                    "dev/caecorthus/sparkdlc/faction/gun/FactionGunPunishmentAdapter.class",
                    "dev/caecorthus/sparkdlc/faction/economy/FactionPassiveMoneyAdapter.class",
                    "dev/caecorthus/sparkdlc/faction/target/PlayerAffectRules.class",
