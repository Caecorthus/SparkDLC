// The built jar and its metadata: fabric.mod.json at its three stages (the source template, the processed resource,
// the entry packaged in the remapped jar), the classes that must or must not be in the jar, the two mixin configs and
// where every mixin sits, and the licence notices of the jar and the sources jar. The root build owns plugins,
// repositories, dependencies, resources and the jar; this script only verifies.
//
// The five former mods each checked "their" share of this one jar; a fact that several of them asserted (the provided
// legacy ids, the pinned dependency versions, the listed mixin configs, the entrypoints) is asserted once here, in its
// strictest form.
//
// 构建出的 jar 及其元数据：三个阶段的 fabric.mod.json（源模板、处理后的资源、重映射 jar 中打包的条目）、jar 中必须存在或不得
// 存在的类、两份 mixin 配置及每个 mixin 的位置，以及 jar 与源码 jar 的许可声明。插件、仓库、依赖、资源与 jar 由根构建负责，
// 本脚本只做校验。
// 五个旧 mod 原先各自校验这同一个 jar 中“自己的”部分；其中多个脚本都断言过的事实（提供的旧 id、固定的依赖版本、列出的 mixin
// 配置、入口）在这里只断言一次，取最严格的形式。

// See gradle/verify/support.gradle: this block must stay identical to the one there.
// 见 gradle/verify/support.gradle：这一段必须与那里的保持完全一致。
buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.ow2.asm:asm-tree:9.9"
        classpath "org.ow2.asm:asm-analysis:9.9"
    }
}
verifySupport.requireSharedAsm(org.objectweb.asm.tree.ClassNode)

def remappedModJar = verifySupport.remappedModJar
def sourceArchive = verifySupport.sourcesJar
def readClassNode = verifySupport.readClassNode
def jsonEntry = verifySupport.jsonEntry
def rootPackage = verifySupport.rootPackage

// The ids of the five former mods. The one mod answers them through `provides`: CaecorthusTeamSync reads the
// `sparkfactionapi` mod container, external mods and packs ask FabricLoader#isModLoaded for any of them, and old
// namespaces resolve through the legacy layer. Inside the mod nothing gates on them any more (verifyNoLookupByName),
// and none may come back as a dependency predicate of the mod on itself.
// 五个旧 mod 的 id。合一后的模组通过 `provides` 应答它们：CaecorthusTeamSync 读取 `sparkfactionapi` 的 mod 容器，外部模组与
// 整合包会以 FabricLoader#isModLoaded 查询其中任意一个，旧命名空间则经由 legacy 层解析。模组内部已不再以它们为门控
// （verifyNoLookupByName），它们也不得再作为本模组针对自身的依赖谓词出现。
def providedLegacyIds = ["sparkfactionapi", "sparkstrength", "sparktraits", "sparkwitch", "sparkassist"]
def commonMixinConfig = "sparkdlc.mixins.json"
def clientMixinConfig = "sparkdlc.client.mixins.json"
def commonMixinPackage = "${rootPackage}.mixin".toString()
def clientMixinPackage = "${rootPackage}.client.mixin".toString()

// Entrypoint classes fabric.mod.json must list, by key. The voice chat plugin and the component initializer are the one
// plugin and the one component entrypoint of the whole mod; the dynamic-lights initializer is listed under the
// LambDynamicLights key and the legacy `dynamiclights` key.
// fabric.mod.json 必须按键列出的入口类。语音插件与组件初始化器是全模组唯一的语音插件与唯一的组件入口；动态光源初始化器同时列在
// LambDynamicLights 的键与旧的 `dynamiclights` 键下。
def requiredEntrypoints = [
        "main"                     : "dev.caecorthus.sparkdlc.SparkDLC",
        "client"                   : "dev.caecorthus.sparkdlc.client.SparkDLCClient",
        "cardinal-components"      : "dev.caecorthus.sparkdlc.SparkDlcComponents",
        "voicechat"                : "dev.caecorthus.sparkdlc.voice.SparkDlcVoiceChatPlugin",
        "lambdynlights:initializer": "dev.caecorthus.sparkdlc.client.role.civilian.savior.SaviorDynamicLightsInitializer",
        "dynamiclights"            : "dev.caecorthus.sparkdlc.client.role.civilian.savior.SaviorDynamicLightsInitializer"
]
// Entrypoint keys that only a client ever loads; every other key also loads on a dedicated server.
// 只有客户端才会加载的入口键；其余的键在专用服务器上也会加载。
def clientOnlyEntrypointKeys = ["client", "sparkdlc_client_voice", "lambdynlights:initializer", "dynamiclights"]
// The common-side packages of the client helpers (guidebook, achievements, settings, Ponder, their sounds and input
// rules): pure logic kept in the common source set, used by client code only. gradle/verify/layering.gradle holds the
// rule ("client-helpers"); the entrypoint half of it is checked here, on the metadata.
// 客户端辅助功能（指南、成就、设置、Ponder 及其音效与输入规则）位于公共端的包：放在公共源码集的纯逻辑，只被客户端代码使用。
// 规则本身在 gradle/verify/layering.gradle（"client-helpers"）；其中关于入口的一半在这里针对元数据校验。
def clientHelperPackages = ["achievement", "guidebook", "config", "input", "ponder", "sound"]

// What is wrong with one fabric.mod.json, given the version and dependency predicates expected at its stage (the
// `${...}` placeholders in the source template, the resolved values after processResources and in the jar).
// 一份 fabric.mod.json 的问题清单；传入该阶段应有的版本与依赖谓词（源模板中是 `${...}` 占位符，processResources 之后以及 jar
// 中是解析后的值）。
def modMetadataProblems = { metadata, String expectedVersion, Map<String, String> expectedDepends ->
    def problems = []
    if (metadata.id?.toString() != "sparkdlc" || metadata.name?.toString() != "SparkDLC") {
        problems.add("must identify sparkdlc (SparkDLC); found ${metadata.id} (${metadata.name})".toString())
    }
    if (metadata.version?.toString() != expectedVersion) {
        problems.add("version must be ${expectedVersion}; found ${metadata.version}".toString())
    }
    if (metadata.license != ["AGPL-3.0-only", "LicenseRef-Textures-ARR"]) {
        problems.add("must declare AGPL-3.0-only code and ARR textures; found license ${metadata.license}".toString())
    }

    // Wathe, NoellesRoles and Ratatouille are hard dependencies pinned through gradle.properties; a hard dependency is
    // never also an optional suggestion.
    // Wathe、NoellesRoles 与 Ratatouille 是通过 gradle.properties 固定的硬依赖；硬依赖不得同时声明为可选的 suggests。
    expectedDepends.each { modId, predicate ->
        if (metadata.depends?.get(modId)?.toString() != predicate) {
            problems.add("dependency ${modId} must be ${predicate}; found ${metadata.depends?.get(modId)}".toString())
        }
        if (metadata.suggests?.containsKey(modId)) {
            problems.add("${modId} is a hard dependency and cannot also be an optional suggestion".toString())
        }
    }
    // Ponder is optional: the pack ships it, and its scenes load only when it is present.
    // Ponder 为可选：整合包自带它，演示场景只在它存在时加载。
    if (metadata.depends?.containsKey("ponder") || metadata.suggests?.get("ponder") != "*") {
        problems.add("Ponder must stay an optional suggestion, never a hard dependency")
    }

    def provides = (metadata.provides ?: []).collect { it.toString() }
    providedLegacyIds.each { modId ->
        if (!provides.contains(modId)) {
            problems.add("legacy mod id ${modId} must be listed under provides; found ${provides}".toString())
        }
        ["depends", "recommends", "suggests", "conflicts", "breaks"].each { relation ->
            if (metadata.get(relation)?.containsKey(modId)) {
                problems.add("stale ${relation} entry for ${modId}, an id this mod provides itself".toString())
            }
        }
    }

    def listedEntrypoints = { String key ->
        (metadata.entrypoints?.get(key) ?: []).collect { (it instanceof Map ? it.value : it)?.toString() }
    }
    requiredEntrypoints.each { key, className ->
        if (!listedEntrypoints(key).contains(className)) {
            problems.add("entrypoint ${key} must list ${className}; found ${listedEntrypoints(key)}".toString())
        }
    }
    // An entrypoint that also loads on a dedicated server names no client class and nothing of the client helpers:
    // the helpers are started by the client entrypoint alone. (The former SparkAssist was a client-only mod; this is
    // what `"environment": "client"` and "no main entrypoint" mean inside one mod that loads on both sides.)
    // 在专用服务器上也会加载的入口不得指向客户端类，也不得指向客户端辅助功能的任何内容：这些辅助功能只由客户端入口启动。
    // （原 SparkAssist 是仅客户端 mod；在两端都会加载的同一个模组里，这就是 `"environment": "client"` 与“没有 main 入口”的含义。）
    (metadata.entrypoints ?: [:]).keySet().findAll { !clientOnlyEntrypointKeys.contains(it) }.each { key ->
        listedEntrypoints(key).findAll { it != null }.each { className ->
            def clientSide = className.startsWith("${rootPackage}.client.") ||
                    clientHelperPackages.any { className.startsWith("${rootPackage}.${it}.") }
            if (clientSide) {
                problems.add(("entrypoint '${key}' also loads on a dedicated server and must not list the client-side " +
                        "class ${className}").toString())
            }
        }
    }

    // One namespace: every Cardinal Components key the mod declares is `sparkdlc:<path>`; a key in one of the five
    // retired namespaces (`sparkassist:` was the one a former check named) must not come back.
    // 唯一的命名空间：本模组声明的每个 Cardinal Components 键都是 `sparkdlc:<path>`；五个已退役命名空间中的键
    // （原校验点名的是 `sparkassist:`）不得回归。
    def components = (metadata.custom?.get("cardinal-components") ?: []).collect { it.toString() }
    def foreignComponents = components.findAll { !it.startsWith("sparkdlc:") }
    if (!foreignComponents.isEmpty()) {
        problems.add("cardinal components outside the sparkdlc namespace are declared: ${foreignComponents}".toString())
    }
    // The Engineer's stun is saved data: its component key must stay declared.
    // 工程师的眩晕属于存档数据：其组件键必须保持声明。
    if (!components.contains("sparkdlc:engineer_stunned")) {
        problems.add("must declare the component sparkdlc:engineer_stunned")
    }

    // Exactly the two merged mixin configs: the common one for both sides, the client one for the client environment
    // only. No third config (none of the nine former ones) may come back.
    // 恰好是合并后的两份 mixin 配置：公共配置两端都加载，客户端配置仅限客户端环境。不得再出现第三份配置（九份旧配置之一）。
    def listedMixins = (metadata.mixins ?: []).collect { entry ->
        entry instanceof Map ? [entry.config?.toString(), entry.environment?.toString()] : [entry?.toString(), null]
    }
    if (listedMixins.size() != 2 || (listedMixins as Set) != ([[commonMixinConfig, null], [clientMixinConfig, "client"]] as Set)) {
        problems.add(("mixins must list exactly ${commonMixinConfig} (both sides) and ${clientMixinConfig} " +
                "(environment client); found ${metadata.mixins}").toString())
    }
    problems
}

tasks.register("verifyModMetadata") {
    group = "verification"
    description = "Checks fabric.mod.json as source template, as processed resource and as packaged in the remapped jar: identity, version, provided legacy ids, dependency pins, entrypoints, components and mixin configs."
    dependsOn tasks.named("processResources")
    dependsOn remappedModJar
    inputs.file("src/main/resources/fabric.mod.json")
    inputs.files(tasks.named("processResources").map { it.destinationDir })
    inputs.file(remappedModJar.flatMap { it.archiveFile })
    ["mod_version", "wathe_version", "noellesroles_version", "ratatouille_version"].each {
        inputs.property(it, project.property(it))
    }

    doLast {
        def slurper = new groovy.json.JsonSlurper()
        def pinnedDepends = [
                wathe       : project.wathe_version.toString(),
                noellesroles: project.noellesroles_version.toString(),
                ratatouille : project.ratatouille_version.toString()
        ]
        def fail = { String label, List problems ->
            if (!problems.isEmpty()) {
                throw new GradleException("${label}: ${problems.join('; ')}")
            }
        }

        // The source template keeps every version a placeholder, so a release cannot ship a stale literal.
        // 源模板中的每个版本都保持为占位符，发布时不可能带出过期的字面量。
        fail("src/main/resources/fabric.mod.json", modMetadataProblems(
                slurper.parse(file("src/main/resources/fabric.mod.json")), '${version}',
                [wathe: '${wathe_version}', noellesroles: '${noellesroles_version}', ratatouille: '${ratatouille_version}']))

        def processedFile = new File(tasks.named("processResources").get().destinationDir, "fabric.mod.json")
        if (!processedFile.isFile()) {
            throw new GradleException("Missing processed fabric.mod.json: ${processedFile}")
        }
        fail("processed fabric.mod.json", modMetadataProblems(
                slurper.parse(processedFile), project.mod_version.toString(), pinnedDepends))

        // Keep the loader-visible mod version tied to the shipped jar filename.
        // 将加载器可见版本绑定到发布 jar 文件名，避免软件里显示旧版本。
        def jarFile = remappedModJar.get().archiveFile.get().asFile
        def archiveName = remappedModJar.get().archiveBaseName.get()
        def suffix = ".jar"
        if (!jarFile.name.startsWith("${archiveName}-") || !jarFile.name.endsWith(suffix)) {
            throw new GradleException("Cannot read version from jar filename: ${jarFile.name}")
        }
        def expectedJarName = "${project.archives_base_name}-${project.mod_version}.jar"
        if (jarFile.name != expectedJarName) {
            throw new GradleException("Remapped jar must be named ${expectedJarName}; found ${jarFile.name}")
        }
        def jarVersion = jarFile.name.substring(archiveName.length() + 1, jarFile.name.length() - suffix.length())
        def zipFile = new java.util.zip.ZipFile(jarFile)
        try {
            def metadata = jsonEntry(zipFile, "fabric.mod.json")
            if (metadata.version?.toString() != jarVersion) {
                throw new GradleException("Jar version mismatch: ${jarFile.name} says ${jarVersion}, but fabric.mod.json says ${metadata.version}")
            }
            fail("fabric.mod.json of ${jarFile.name}", modMetadataProblems(metadata, project.mod_version.toString(), pinnedDepends))
        } finally {
            zipFile.close()
        }
    }
}

