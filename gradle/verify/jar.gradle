tasks.register("verifyJarContents") {
    group = "verification"
    description = "Checks the remapped jar's classes: entrypoint classes and the start-up calls they make, required runtime classes, retired classes, and that no upstream binary is bundled."
    dependsOn remappedModJar
    inputs.file(remappedModJar.flatMap { it.archiveFile })

    doLast {
        def jarFile = remappedModJar.get().archiveFile.get().asFile
        def zipFile = new java.util.zip.ZipFile(jarFile)
        try {
            requiredEntrypoints.each { key, className ->
                if (zipFile.getEntry(className.replace('.', '/') + ".class") == null) {
                    throw new GradleException("Entrypoint class ${className} (${key}) is missing from ${jarFile.name}")
                }
            }
            requiredStartupCalls.each { String entrypointClass, String startOwner, String startCall ->
                def entrypointNode = readClassNode(zipFile, entrypointClass.replace('.', '/') + ".class")
                def makesCall = entrypointNode.methods.any { method ->
                    method.instructions.toArray().any {
                        it instanceof org.objectweb.asm.tree.MethodInsnNode && it.owner == startOwner
                                && it.name == startCall
                    }
                }
                if (!makesCall) {
                    throw new GradleException(
                            "${entrypointClass} no longer calls ${startOwner}#${startCall} in ${jarFile.name}"
                    )
                }
            }

            requiredRuntimeClasses.each { requiredEntry ->
                if (zipFile.getEntry(requiredEntry) == null) {
                    throw new GradleException("Missing required runtime class ${requiredEntry} in ${jarFile.name}")
                }
            }
            retiredClasses.each { forbiddenEntry ->
                if (zipFile.getEntry(forbiddenEntry) != null) {
                    throw new GradleException("Forbidden retired class ${forbiddenEntry} is still packaged in ${jarFile.name}")
                }
            }

            // Wathe, NoellesRoles, Ponder, Flywheel and the upstream mod the guidebook was reimplemented from are
            // dependencies or references, never contents: no class of theirs and no nested jar ships in ours.
            // Wathe、NoellesRoles、Ponder、Flywheel 以及指南所参照重写的上游模组只是依赖或参照，绝不是本 jar 的内容：
            // 它们的类与任何内嵌 jar 都不得随本 jar 发布。
            def bundledUpstream = zipFile.entries().find { entry ->
                def entryName = entry.name.toLowerCase(Locale.ROOT)
                (entryName.endsWith(".jar") && (entryName.contains("wathe") || entryName.contains("noellesroles"))) ||
                        entry.name.startsWith("cat/rezelyn/") || entry.name.startsWith("dev/doctor4t/") ||
                        entry.name.startsWith("org/agmas/noellesroles/") ||
                        entry.name.startsWith("net/createmod/") || entry.name.startsWith("dev/engine_room/") ||
                        entry.name.startsWith("META-INF/jars/")
            }
            if (bundledUpstream != null) {
                throw new GradleException("Upstream binary unexpectedly bundled in ${jarFile.name}: ${bundledUpstream.name}")
            }
        } finally {
            zipFile.close()
        }
    }
}

