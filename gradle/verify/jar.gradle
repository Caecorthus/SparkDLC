tasks.register("verifyMixinConfigs") {
    group = "verification"
    description = "Checks the two mixin configs in the remapped jar: identical to their sources, required, one list each, and exactly the mixin classes of their source set (common mixins in the common config, client mixins in the client config)."
    dependsOn remappedModJar
    inputs.file(remappedModJar.flatMap { it.archiveFile })
    inputs.files("src/main/resources/${commonMixinConfig}", "src/client/resources/${clientMixinConfig}")
    inputs.files(fileTree("src/main/resources") { include "*.mixins.json" },
            fileTree("src/client/resources") { include "*.mixins.json" })

    doLast {
        // No mixin config besides the two, in the resource roots or in the jar: the nine configs of the former mods
        // were merged, and none (a former check named sparkassist.mixins.json, a common config for client helpers)
        // may come back.
        // 除这两份之外，资源根目录与 jar 中都不得有其他 mixin 配置：旧 mod 的九份配置已经合并，其中任何一份（原校验点名的是
        // sparkassist.mixins.json，即客户端辅助功能的公共配置）都不得回归。
        def sourceConfigs = (fileTree("src/main/resources") { include "*.mixins.json" }.files.collect { "src/main/resources/${it.name}".toString() } +
                fileTree("src/client/resources") { include "*.mixins.json" }.files.collect { "src/client/resources/${it.name}".toString() }).sort()
        def expectedSourceConfigs = ["src/client/resources/${clientMixinConfig}".toString(), "src/main/resources/${commonMixinConfig}".toString()]
        if (sourceConfigs != expectedSourceConfigs) {
            throw new GradleException("The mixin configs must be exactly ${expectedSourceConfigs}; found ${sourceConfigs}")
        }

        def jarFile = remappedModJar.get().archiveFile.get().asFile
        def zipFile = new java.util.zip.ZipFile(jarFile)
        try {
            def packagedConfigs = zipFile.entries().collect { it.name }.findAll { !it.contains("/") && it.endsWith(".mixins.json") }.sort()
            if (packagedConfigs != [clientMixinConfig, commonMixinConfig]) {
                throw new GradleException("${jarFile.name} must ship exactly ${commonMixinConfig} and ${clientMixinConfig}; found ${packagedConfigs}")
            }

            [
                    [name: commonMixinConfig, source: "src/main/resources/${commonMixinConfig}", mixinPackage: commonMixinPackage, list: "mixins"],
                    [name: clientMixinConfig, source: "src/client/resources/${clientMixinConfig}", mixinPackage: clientMixinPackage, list: "client"]
            ].each { expected ->
                def packagedBytes = zipFile.getInputStream(zipFile.getEntry(expected.name)).bytes
                if (!java.util.Arrays.equals(packagedBytes, file(expected.source).bytes)) {
                    throw new GradleException("Packaged ${expected.name} differs from ${expected.source}")
                }
                def config = new groovy.json.JsonSlurper().parseText(new String(packagedBytes, "UTF-8"))
                // A missed injection must fail the start instead of silently dropping a rule.
                // 注入未命中时必须让启动失败，而不是悄悄丢掉一条规则。
                if (config.required != true) {
                    throw new GradleException("${expected.name} must remain required in ${jarFile.name}")
                }
                if (config.injectors?.defaultRequire?.toString() != "1") {
                    throw new GradleException("${expected.name} defaultRequire drift: expected 1, found ${config.injectors?.defaultRequire}")
                }
                if (config.package?.toString() != expected.mixinPackage) {
                    throw new GradleException("${expected.name} must keep its mixins in ${expected.mixinPackage}; found ${config.package}")
                }
                // One list per config: common mixins under `mixins` of the common config, client mixins under `client`
                // of the client config, which is loaded for the client environment only (verifyModMetadata). A client
                // mixin anywhere else would be applied on a dedicated server.
                // 每份配置只有一个列表：公共 mixin 在公共配置的 `mixins` 下，客户端 mixin 在客户端配置的 `client` 下，而客户端
                // 配置只在客户端环境加载（见 verifyModMetadata）。出现在其他位置的客户端 mixin 会在专用服务器上被应用。
                def otherLists = ["mixins", "client", "server"].findAll { it != expected.list && config.get(it) }
                if (!otherLists.isEmpty() || !config.get(expected.list)) {
                    throw new GradleException("${expected.name} must declare its mixins under '${expected.list}' only; found ${otherLists} as well, or no '${expected.list}' entry")
                }
                def listed = config.get(expected.list).collect { it.toString() }
                if (listed.size() != (listed as Set).size()) {
                    throw new GradleException("${expected.name} lists a mixin twice: ${listed.findAll { name -> listed.count(name) > 1 }.unique()}")
                }

                // The config and the mixin package are the same set, in both directions: every listed mixin is a
                // class of the jar that carries @Mixin (a mixin that was dissolved must leave the config), and every
                // class in the mixin package is listed (a mixin added tomorrow cannot be forgotten, and a mixin of the
                // client source set cannot end up in the common config, whose package it is not in).
                // 配置与 mixin 包是同一个集合，双向成立：列出的每个 mixin 都是 jar 中带有 @Mixin 的类（已拆除的 mixin 必须从配置
                // 中移除），mixin 包中的每个类也都被列出（以后新增的 mixin 不会被遗漏，客户端源码集的 mixin 也不可能进入公共配置，
                // 因为它不在公共配置的包里）。
                def packagePath = expected.mixinPackage.replace('.', '/') + "/"
                listed.each { mixinName ->
                    def entryName = packagePath + mixinName.replace('.', '/') + ".class"
                    def node = readClassNode(zipFile, entryName)
                    if (!verifySupport.annotationsOf(node).any { it.desc == "Lorg/spongepowered/asm/mixin/Mixin;" }) {
                        throw new GradleException("${expected.name} lists ${mixinName}, which is not a @Mixin class")
                    }
                }
                def classesInPackage = zipFile.entries().collect { it.name }.findAll {
                    it.startsWith(packagePath) && it.endsWith(".class") && !it.contains("\$")
                }.collect { it.substring(packagePath.length(), it.length() - ".class".length()).replace('/', '.') } as Set
                if (classesInPackage.isEmpty()) {
                    throw new GradleException("No class below ${packagePath} in ${jarFile.name}; the check would look at nothing")
                }
                def unlisted = (classesInPackage - listed).sort()
                if (!unlisted.isEmpty()) {
                    throw new GradleException("${expected.name} does not list ${unlisted.size()} classes of ${expected.mixinPackage}: ${unlisted}")
                }

                requiredMixins[expected.name].each { requiredMixin ->
                    if (!listed.contains(requiredMixin)) {
                        throw new GradleException("Missing mixin ${requiredMixin} in ${expected.name} inside ${jarFile.name}")
                    }
                }

                def requiredPlugin = expected.name == clientMixinConfig ? clientMixinPlugin : null
                if (config.plugin?.toString() != requiredPlugin) {
                    throw new GradleException("${expected.name} must name the mixin plugin ${requiredPlugin}; found ${config.plugin}")
                }
                if (requiredPlugin != null) {
                    def pluginNode = readClassNode(zipFile, requiredPlugin.replace('.', '/') + ".class")
                    def runsScavengerRewrite = pluginNode.methods.any { method ->
                        method.name == "postApply" && method.instructions.toArray().any {
                            it instanceof org.objectweb.asm.tree.MethodInsnNode && it.owner == scavengerRewrite
                                    && it.name == "rewrite"
                        }
                    }
                    if (!runsScavengerRewrite) {
                        throw new GradleException(
                                "${requiredPlugin}#postApply no longer runs ${scavengerRewrite} in ${jarFile.name}"
                        )
                    }
                }
            }
        } finally {
            zipFile.close()
        }
    }
}

// The jar and the sources jar carry one set of notices for the whole mod: SparkDLC's own licenses, the merged
// THIRD_PARTY_NOTICES.md and the Wathe Extended license text (the guidebook is a clean reimplementation of that mod's
// feature; the notice records the upstream commit it was written against).
// jar 与源码 jar 为整个 mod 携带同一套声明：SparkDLC 自身的许可证、合并后的 THIRD_PARTY_NOTICES.md 以及 Wathe Extended
// 许可证文本（指南是对该模组功能的全新重写；声明中记录了所参照的上游提交）。
def watheExtendedCommit = "cf3c5c51f3dbc173778597bfb628a7b8e09ccadc"
def requiredWatheNotice = "Selected Wathe visual assets are © 2024 doctor4t. Wathe source code is\nnot copied or modified."
def watheExtendedLicense = "src/main/resources/META-INF/licenses/WATHE_EXTENDED_GPL-3.0.txt"
def distributionNotices = [
        "META-INF/LICENSE_SPARKDLC",
        "META-INF/LICENSE-TEXTURES_SPARKDLC.md",
        "META-INF/THIRD_PARTY_NOTICES.md",
        "META-INF/licenses/WATHE_EXTENDED_GPL-3.0.txt"
]

tasks.register("verifyNotices") {
    group = "verification"
    description = "Checks the third-party notice and the vendored license text, and that the jar and the sources jar ship the licence and notice entries."
    dependsOn remappedModJar
    inputs.file(remappedModJar.flatMap { it.archiveFile })
    dependsOn sourceArchive
    inputs.file(sourceArchive.flatMap { it.archiveFile })
    inputs.files("THIRD_PARTY_NOTICES.md", watheExtendedLicense)

    doLast {
        ["THIRD_PARTY_NOTICES.md", watheExtendedLicense].each { requiredPath ->
            if (!file(requiredPath).isFile()) {
                throw new GradleException("Missing notice file: ${requiredPath}")
            }
        }
        def notices = file("THIRD_PARTY_NOTICES.md").getText("UTF-8")
        if (!notices.replace("\r\n", "\n").contains(requiredWatheNotice)) {
            throw new GradleException("THIRD_PARTY_NOTICES.md is missing the required Wathe asset notice")
        }
        if (!notices.contains(watheExtendedCommit)
                || !notices.contains("clean reimplementation")
                || !notices.contains("No upstream source code was copied.")) {
            throw new GradleException("THIRD_PARTY_NOTICES.md is missing the Guidebook reimplementation provenance")
        }

        def upstreamLicense = file(watheExtendedLicense).getText("UTF-8")
        if (!upstreamLicense.contains("GNU GENERAL PUBLIC LICENSE")
                || !upstreamLicense.contains("Version 3, 29 June 2007")) {
            throw new GradleException("Vendored Wathe Extended license must contain the verbatim GPLv3 text")
        }

        def jarFile = remappedModJar.get().archiveFile.get().asFile
        def zipFile = new java.util.zip.ZipFile(jarFile)
        try {
            distributionNotices.each { requiredEntry ->
                if (zipFile.getEntry(requiredEntry) == null) {
                    throw new GradleException("Missing distribution notice ${requiredEntry} in ${jarFile.name}")
                }
            }

            def packagedNotices = zipFile.getInputStream(zipFile.getEntry("META-INF/THIRD_PARTY_NOTICES.md")).getText("UTF-8")
            if (!packagedNotices.replace("\r\n", "\n").contains(requiredWatheNotice)
                    || !packagedNotices.contains(watheExtendedCommit)
                    || !packagedNotices.contains("No upstream source code was copied.")) {
                throw new GradleException("Packaged third-party notice is incomplete in ${jarFile.name}")
            }

            def packagedUpstreamLicense = zipFile.getInputStream(zipFile.getEntry("META-INF/licenses/WATHE_EXTENDED_GPL-3.0.txt")).getText("UTF-8")
            if (!packagedUpstreamLicense.contains("GNU GENERAL PUBLIC LICENSE")
                    || !packagedUpstreamLicense.contains("Version 3, 29 June 2007")) {
                throw new GradleException("Packaged Wathe Extended license is not GPLv3")
            }
        } finally {
            zipFile.close()
        }

        def sourcesFile = sourceArchive.get().archiveFile.get().asFile
        def sourcesZip = new java.util.zip.ZipFile(sourcesFile)
        try {
            distributionNotices.each { requiredEntry ->
                if (sourcesZip.getEntry(requiredEntry) == null) {
                    throw new GradleException("Missing source-distribution notice ${requiredEntry} in ${sourcesFile.name}")
                }
            }
            def sourceNotices = sourcesZip.getInputStream(
                    sourcesZip.getEntry("META-INF/THIRD_PARTY_NOTICES.md")
            ).getText("UTF-8")
            if (!sourceNotices.replace("\r\n", "\n").contains(requiredWatheNotice)
                    || !sourceNotices.contains(watheExtendedCommit)
                    || !sourceNotices.contains("No upstream source code was copied.")) {
                throw new GradleException("Source-distribution third-party notice is incomplete in ${sourcesFile.name}")
            }
        } finally {
            sourcesZip.close()
        }
    }
}
