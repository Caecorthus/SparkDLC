// Shared helper of the five verify scripts: which legacy module a file or class belonged to. Each verify script
// applies this file; the first application defines `legacyModules`, the later ones find it and do nothing.
//
// Stage 1 of the package move (tools/unify) took every class out of dev.caecorthus.sparkdlc.{factionapi,strength,
// traits,witch,assist}, so "the sources / classes of module X" can no longer be read from a directory or a jar-entry
// prefix. The move manifest tools/unify/file-moves.tsv still records it: one row per production file, and `old_fqcn`
// (relative to dev.caecorthus.sparkdlc) starts with the legacy module. The checks that used to scan a module root now
// take their file or class set from here, so each still evaluates the same rule over the same set. The manifest is a
// snapshot of the move: a file added later belongs to no legacy module and is outside these sets, which is why the
// module-boundary rules built on it are due to be restated for the new layout or retired in a later stage.
// Every lookup fails loudly when the manifest is missing or malformed, or when it yields an empty set: a check must
// never pass because it looked at nothing.
//
// 五个校验脚本共用的辅助：某个文件或类原先属于哪个旧模块。每个校验脚本都会应用本文件；第一次应用时定义
// `legacyModules`，之后的应用发现它已存在便不再做任何事。
// 第一阶段包搬迁（tools/unify）把所有类移出了 dev.caecorthus.sparkdlc.{factionapi,strength,traits,witch,assist}，因此
// “模块 X 的源码 / 类”无法再从目录或 jar 条目前缀读出。搬迁清单 tools/unify/file-moves.tsv 仍然记录着这一信息：每个生产
// 文件一行，`old_fqcn`（相对于 dev.caecorthus.sparkdlc）以旧模块名开头。原先扫描模块根目录的校验现在从这里取得文件或类的
// 集合，因此仍是对同一集合执行同一规则。清单是搬迁时的快照：之后新增的文件不属于任何旧模块，也不在这些集合内，所以建立在
// 它之上的模块边界规则需要在后续阶段按新布局重新表述或退役。
// 清单缺失、格式不符或得到空集合时，所有查询都会明确失败：校验绝不能因为什么都没看而通过。
if (!project.ext.has("legacyModules")) {
    def rootPackage = "dev.caecorthus.sparkdlc"
    def knownModules = ["factionapi", "strength", "traits", "witch", "assist"]
    def manifestHeader = ["old_path", "new_path", "old_fqcn", "new_fqcn", "source_root", "phase"]
    def productionManifest = "tools/unify/file-moves.tsv"
    // The local-only tests were moved the same way; their manifest lives in the local-only tree it describes.
    // 仅存于本地的测试以同样方式搬迁；其清单位于它所描述的本地目录内。
    def localTestManifest = "src/test/.unify-file-moves.tsv"
    // The only tests tracked by git (two Ponder tests of the assist module), at their path before and after the move:
    // a fresh clone has these and nothing else under src/test.
    // git 跟踪的仅有的测试（assist 模块的两个 Ponder 测试），搬迁前后的路径都列出：全新克隆的 src/test 下只有它们。
    def trackedTests = ["ActorMovementTest.java", "PonderCaptionBoundsTest.java"].collectMany { name ->
        ["src/test/java/dev/caecorthus/sparkdlc/assist/ponder/${name}".toString(),
         "src/test/java/dev/caecorthus/sparkdlc/ponder/${name}".toString()]
    }

    def parsedManifests = [:]
    def manifestRows = { String manifestPath ->
        if (!parsedManifests.containsKey(manifestPath)) {
            def manifest = file(manifestPath)
            if (!manifest.isFile()) {
                throw new GradleException("Missing move manifest ${manifestPath}: the legacy module of a file cannot be determined without it")
            }
            def lines = manifest.getText("UTF-8").split("\n").collect { it.replace("\r", "") }.findAll { !it.isEmpty() }
            if (lines.isEmpty() || lines[0].split("\t", -1).toList() != manifestHeader) {
                throw new GradleException("${manifestPath} must start with the header ${manifestHeader.join(' ')}")
            }
            parsedManifests[manifestPath] = lines.drop(1).collect { line ->
                def cells = line.split("\t", -1).toList()
                if (cells.size() != manifestHeader.size()) {
                    throw new GradleException("Malformed row in ${manifestPath}: ${line}")
                }
                def row = [manifestHeader, cells].transpose().collectEntries { key, value -> [(key): value] }
                row.module = row.old_fqcn.tokenize('.')[0]
                if (!knownModules.contains(row.module)) {
                    throw new GradleException("${manifestPath}: ${row.old_fqcn} is in no legacy module")
                }
                row
            }
        }
        parsedManifests[manifestPath]
    }
    def moduleRows = { String manifestPath, String module ->
        if (!knownModules.contains(module)) {
            throw new GradleException("Unknown legacy module ${module}")
        }
        def rows = manifestRows(manifestPath).findAll { it.module == module }
        if (rows.isEmpty()) {
            throw new GradleException("${manifestPath} lists no file of the legacy ${module} module")
        }
        rows
    }
    def moduleByClass = null
    def packageOf = { String className -> className.contains(".") ? className.substring(0, className.lastIndexOf(".")) : "" }
    def qualified = { String relativeName -> "${rootPackage}.${relativeName}".toString() }

    project.ext.legacyModules = [
            // Production sources (src/main/java and src/client/java) that were below the module's directories.
            // 原先位于该模块目录下的生产源码（src/main/java 与 src/client/java）。
            sources: { String module ->
                def listed = moduleRows(productionManifest, module)
                def present = listed.collect { file(it.new_path) }.findAll { it.isFile() }
                if (present.isEmpty()) {
                    throw new GradleException("None of the ${listed.size()} sources ${productionManifest} lists for the legacy ${module} module exists any more")
                }
                present
            },
            // Fully-qualified names of the module's top-level classes, optionally of one manifest phase only. The
            // "mixins" phase is everything that was below a module's mixin packages: the mixin classes and, for the
            // modules that had one, the legacy client mixin plugin.
            // 该模块顶层类的全限定名，可只取清单中的某个阶段。"mixins" 阶段是原先位于模块 mixin 包下的全部内容：mixin 类，
            // 以及（对曾有插件的模块）旧的客户端 mixin 插件。
            classNames: { String module, String phase = null ->
                def names = moduleRows(productionManifest, module).findAll { phase == null || it.phase == phase }
                        .collect { qualified(it.new_fqcn) } as Set
                if (names.isEmpty()) {
                    throw new GradleException("${productionManifest} lists no ${phase} class of the legacy ${module} module")
                }
                names
            },
            // Today's names of the classes whose name before the move started with one of the given dotted prefixes
            // (the form the pre-move rules were written in, e.g. "dev.caecorthus.sparkdlc.traits.impl.").
            // 搬迁前的类名以给定点分前缀之一开头的那些类现在的名字（前缀即搬迁前规则的写法）。
            classesFormerlyUnder: { Collection<String> legacyPrefixes ->
                def names = manifestRows(productionManifest).findAll { row ->
                    legacyPrefixes.any { qualified(row.old_fqcn).startsWith(it) }
                }.collect { qualified(it.new_fqcn) } as Set
                if (names.isEmpty()) {
                    throw new GradleException("${productionManifest} lists no class formerly under ${legacyPrefixes}")
                }
                names
            },
            // The legacy module of a class, given as a dotted or slashed name or a jar entry (a nested class belongs
            // to its top-level class); null for a class the manifest does not list (the fused entrypoints, the
            // composite mixin plugin, anything added after the move).
            // 某个类所属的旧模块；可传入点分名、斜杠名或 jar 条目（嵌套类归属其顶层类）。清单未列出的类（融合入口、组合
            // mixin 插件、搬迁后新增的类）返回 null。
            moduleOfClass: { String name ->
                def className = name.replace('/', '.')
                if (className.endsWith(".class")) {
                    className = className.substring(0, className.length() - ".class".length())
                }
                if (className.contains("\$")) {
                    className = className.substring(0, className.indexOf("\$"))
                }
                if (!className.startsWith(rootPackage + ".")) {
                    return null
                }
                if (moduleByClass == null) {
                    moduleByClass = manifestRows(productionManifest).collectEntries { [(it.new_fqcn): it.module] }
                }
                moduleByClass[className.substring(rootPackage.length() + 1)]
            },
            // Where the given sources name one of the given classes. This is the pre-move "module X never names
            // package P" text scan, restated for a layout in which a package can hold classes of several modules:
            // - the fully-qualified name of a forbidden class, anywhere in the text (imports, strings, comments);
            // - the prefix of a package that holds forbidden classes only, in it and below it (wildcard imports and
            //   names built from a package prefix);
            // - the simple name of a forbidden class in code of a file of the same package, which needs no import
            //   now that the modules share packages (comments and string literals are not code).
            // 给定源码中引用给定类之处。这是搬迁前“模块 X 不得引用包 P”的文本扫描，按“一个包可以容纳多个模块的类”的布局
            // 重新表述：
            // - 被禁类的全限定名，出现在文本任何位置（import、字符串、注释）；
            // - 自身及其子包只含被禁类的包的前缀（通配 import 以及由包前缀拼出的名字）；
            // - 同包文件的代码中出现被禁类的简单名：模块共用包之后这不再需要 import（注释与字符串字面量不算代码）。
            forbiddenReferences: { Collection<File> sources, Set<String> forbiddenClasses ->
                def allClasses = manifestRows(productionManifest).collect { qualified(it.new_fqcn) }
                def forbiddenPackages = forbiddenClasses.collect { packageOf(it) }.toSet().findAll { candidate ->
                    candidate != rootPackage && allClasses.findAll {
                        it.startsWith(candidate + ".")
                    }.every { forbiddenClasses.contains(it) }
                }
                def namedOneByOne = forbiddenClasses.findAll { !forbiddenPackages.contains(packageOf(it)) }
                def nameEnd = "(?![A-Za-z0-9_\$])"
                def qualifiedName = java.util.regex.Pattern.compile((
                        forbiddenPackages.collect { java.util.regex.Pattern.quote(it + ".") } +
                                namedOneByOne.collect { java.util.regex.Pattern.quote(it) + nameEnd }
                ).join("|"))
                def simpleNamesByPackage = forbiddenClasses.groupBy { packageOf(it) }.collectEntries { packageName, names ->
                    [(packageName): java.util.regex.Pattern.compile("(?<![A-Za-z0-9_\$.])(?:" +
                            names.collect { java.util.regex.Pattern.quote(it.substring(packageName.length() + 1)) }
                                    .join("|") + ")" + nameEnd)]
                }
                def found = []
                sources.each { sourceFile ->
                    def sourceText = sourceFile.getText("UTF-8")
                    def label = project.relativePath(sourceFile).replace(File.separatorChar, '/' as char)
                    def named = qualifiedName.matcher(sourceText)
                    if (named.find()) {
                        found.add("${label} names ${named.group()}".toString())
                        return
                    }
                    def declaredPackage = (sourceText =~ /(?m)^\s*package\s+([\w.]+)\s*;/)
                    def samePackageNames = declaredPackage.find() ? simpleNamesByPackage[declaredPackage.group(1)] : null
                    if (samePackageNames != null && !forbiddenClasses.contains(
                            "${declaredPackage.group(1)}.${sourceFile.name - '.java'}".toString())) {
                        def code = sourceText.replaceAll(/(?s)\/\*.*?\*\//, " ").replaceAll(/(?m)\/\/.*$/, " ")
                                .replaceAll(/"(?:\\.|[^"\\\n])*"/, '""')
                        def used = samePackageNames.matcher(code)
                        if (used.find()) {
                            found.add("${label} uses ${declaredPackage.group(1)}.${used.group()} of its own package".toString())
                        }
                    }
                }
                found
            },
            // Whether this checkout has the module's local-only tests (src/test is gitignored; a fresh clone has only
            // the tracked tests). `excluded` are paths that do not count. This replaces "the module's test directory
            // exists": the tests left their module directories with the same move. Without the local test manifest the
            // answer is "no" only when src/test holds nothing but the tracked tests; local tests without their
            // manifest fail loudly instead of being skipped.
            // 当前检出是否带有该模块仅存于本地的测试（src/test 已被 gitignore，全新克隆只有已跟踪的测试）。`excluded` 是不计入
            // 的路径。它取代“模块的测试目录是否存在”：测试随同一次搬迁离开了各自的模块目录。没有本地测试清单时，只有当
            // src/test 下除已跟踪的测试外别无他物才回答“否”；存在本地测试却没有清单时明确失败，而不是跳过。
            localTestsPresent: { String module, Collection<String> excluded = [] ->
                if (!file(localTestManifest).isFile()) {
                    def unlisted = fileTree("src/test") { include "**/*.java" }.files.collect {
                        project.relativePath(it).replace(File.separatorChar, '/' as char)
                    }.findAll { !trackedTests.contains(it) }
                    if (!unlisted.isEmpty()) {
                        throw new GradleException("src/test holds ${unlisted.size()} local-only test sources but ${localTestManifest} is missing: cannot tell which legacy module they belong to")
                    }
                    return false
                }
                moduleRows(localTestManifest, module).any { !excluded.contains(it.new_path) && file(it.new_path).isFile() }
            }
    ]
}
