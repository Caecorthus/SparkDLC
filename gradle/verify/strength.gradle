// SparkStrength verification tasks, ported from the standalone SparkStrength build script and applied by the root
// build.gradle. Everything the root build already owns (plugins, loom, repositories, dependencies, processResources,
// jar, java) was removed; only the checks remain. Run them with `./gradlew verifyStrength`.
// SparkStrength 的校验任务，由独立的 SparkStrength 构建脚本迁移而来，由根 build.gradle 引入。根构建已负责的部分
// （插件、loom、仓库、依赖、processResources、jar、java）已删除，这里只保留校验。用 `./gradlew verifyStrength` 运行。

// The standalone script pinned mod_version, wathe_version and noellesroles_version to literals in a
// compatibilityBaseline table. The fused build keeps every pin in gradle.properties, shared by the five modules, so
// that file is now the baseline: the build must use exactly its values (no -P or ~/.gradle override).
// 独立脚本用 compatibilityBaseline 表把 mod_version、wathe_version、noellesroles_version 钉为字面量。融合后的构建把所有
// 钉值放在五个模块共用的 gradle.properties 中，因此该文件就是基线：构建必须原样使用其中的值（不得用 -P 或
// ~/.gradle 覆盖）。

// The jar checks read class files with ASM. In the standalone build.gradle it came with the Loom plugin's classpath;
// a script applied with `apply from` does not see that classpath, so it declares ASM for itself.
// jar 校验用 ASM 读取 class 文件。独立的 build.gradle 中它随 Loom 插件的类路径而来；通过 `apply from` 引入的脚本看不到
// 该类路径，因此在这里自行声明 ASM。
buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.ow2.asm:asm-tree:9.8"
    }
}

def pinnedProperties = [
        "mod_version",
        "wathe_version",
        "wathe_sha256",
        "noellesroles_version",
        "noellesroles_sha256"
]
def providerBaselines = [
        // The runtime Wathe build that the released 1.5.6 pack ships; every SparkDLC module builds against this one
        // jar. The historical Windows build of the same commit (sha256 95d7c06…) numbers javac lambdas differently.
        // 正式版 1.5.6 整合包所带的运行时 Wathe 构建，SparkDLC 的所有模块都基于这一个 jar 构建；同一提交的旧 Windows 构建
        // （sha256 95d7c06…）的 javac lambda 编号不同。
        wathe: [
                fileName : "wathe-${project.wathe_version}.jar".toString(),
                version  : project.wathe_version.toString(),
                sha256   : project.wathe_sha256.toString()
        ],
        // The runtime baseline build (sha1 b2302b9…). Its AbilityC2SPacket handler is $5; the historical
        // Windows build of the same sources numbers it $36. 运行时基线构建；同一源码的旧 Windows 构建编号为 $36。
        // The lambda numbers below belong to the jar pinned by noellesroles_sha256: moving that pin means reading
        // them again from the new jar. 下面的 lambda 编号属于 noellesroles_sha256 所钉的 jar：改动该钉值时必须从新 jar
        // 重新确认这些编号。
        noellesroles: [
                fileName       : "noellesroles-${project.noellesroles_version}.jar".toString(),
                version        : project.noellesroles_version.toString(),
                sha256         : project.noellesroles_sha256.toString(),
                abilityHandler : "lambda\$registerPackets\$5",
                // The Assassin guess and Swapper swap handlers, where the stage-2 Undercover's immunities cancel them.
                // 刺客猜测与交换者交换的处理函数，二阶段卧底的免疫在此取消它们。
                assassinHandler: "lambda\$registerPackets\$6",
                swapperHandler : "lambda\$registerPackets\$4"
        ]
]
def supersededProviderJars = [
        "wathe-1.5.7-spark-1.21.1.jar",
        "noellesroles-1.7.7-h1.5.7-spark.jar"
]
// The other modules are no longer provider jars: they are packages of the same source tree and the same jar, so there
// is nothing to pin for them. What remains checkable is that the classes SparkStrength reaches by name exist in the
// fused jar (verifyStrengthSiblingSeams).
// 其他模块不再是提供方 jar：它们是同一源码树、同一个 jar 中的包，因此无需为它们钉任何值。仍可校验的是 SparkStrength
// 按名称访问的类确实存在于融合后的 jar 中（verifyStrengthSiblingSeams）。
def siblingModules = ["factionapi", "traits", "witch", "assist"]
def sha256 = { File target ->
    def digest = java.security.MessageDigest.getInstance("SHA-256")
    target.withInputStream { input ->
        byte[] buffer = new byte[8192]
        for (int count = input.read(buffer); count != -1; count = input.read(buffer)) {
            digest.update(buffer, 0, count)
        }
    }
    digest.digest().collect { String.format("%02x", it & 0xff) }.join()
}
def readJarMetadata = { File jarFile ->
    def zipFile = new java.util.zip.ZipFile(jarFile)
    try {
        def metadataEntry = zipFile.getEntry("fabric.mod.json")
        if (metadataEntry == null) {
            throw new GradleException("Missing fabric.mod.json in ${jarFile.name}")
        }
        new groovy.json.JsonSlurper().parse(zipFile.getInputStream(metadataEntry))
    } finally {
        zipFile.close()
    }
}

tasks.register("verifyStrengthArchitecture") {
    group = "verification"
    description = "Checks SparkStrength architecture contracts and the pinned Wathe/NoellesRoles provider jars."
    dependsOn tasks.named("processResources")

    inputs.files(
            "docs/strength/CONTEXT.md",
            "gradle.properties",
            "src/main/resources/fabric.mod.json",
            "src/main/java/dev/caecorthus/sparkdlc/strength/compat/SparkTraitsCompat.java",
            "src/main/java/dev/caecorthus/sparkdlc/strength/SparkStrengthItems.java",
            "src/main/java/dev/caecorthus/sparkdlc/strength/SparkStrengthEntities.java",
            "src/main/java/dev/caecorthus/sparkdlc/strength/replay/CaptureDeviceReplayEvents.java"
    )
    inputs.files(fileTree("libs") { include "*.jar" })
    inputs.files(tasks.named("processResources").map { it.destinationDir })
    pinnedProperties.each { propertyName ->
        inputs.property(propertyName, project.property(propertyName))
    }

    doLast {
        def requireFile = { String path ->
            if (!file(path).isFile()) {
                throw new GradleException("Missing required verification file: ${path}")
            }
        }
        def requireText = { String path, String snippet ->
            requireFile(path)
            if (!file(path).getText("UTF-8").contains(snippet)) {
                throw new GradleException("Missing required contract '${snippet}' in ${path}")
            }
        }

        requireText(
                "src/main/java/dev/caecorthus/sparkdlc/strength/compat/SparkTraitsCompat.java",
                "dev.caecorthus.sparkdlc.traits.api.SparkTraitsApi"
        )
        requireText(
                "src/main/java/dev/caecorthus/sparkdlc/strength/compat/SparkTraitsCompat.java",
                "getMethod(\"hasActiveTrait\", PlayerEntity.class, Identifier.class)"
        )

        def forbiddenSparkTraitsPackages = [
                "dev.caecorthus.sparkdlc.traits.SparkTraits",
                "dev.caecorthus.sparkdlc.traits.client.",
                "dev.caecorthus.sparkdlc.traits.command.",
                "dev.caecorthus.sparkdlc.traits.component.",
                "dev.caecorthus.sparkdlc.traits.impl.",
                "dev.caecorthus.sparkdlc.traits.mixin.",
                "dev.caecorthus.sparkdlc.traits.net.",
                "dev.caecorthus.sparkdlc.traits.voice."
        ]
        // `src` now holds all five modules, and the traits module names its own packages, so the scan covers only
        // the strength packages of every source set (main, client and the local-only test tree when present).
        // `src` 现在包含全部五个模块，而 traits 模块自然会引用自己的包，因此只扫描各源码集（main、client，以及存在时的
        // 本地 test）中的 strength 包。
        def strengthSources = fileTree("src") {
            include "*/java/dev/caecorthus/sparkdlc/strength/**/*.java"
        }.files
        if (strengthSources.isEmpty()) {
            throw new GradleException("No SparkStrength sources found under src/*/java/dev/caecorthus/sparkdlc/strength")
        }
        def internalTraitReferences = strengthSources.findAll { sourceFile ->
            def sourceText = sourceFile.getText("UTF-8")
            forbiddenSparkTraitsPackages.any { sourceText.contains(it) }
        }
        if (!internalTraitReferences.isEmpty()) {
            throw new GradleException("Internal SparkTraits references are forbidden: ${internalTraitReferences}")
        }

        requireText("src/main/resources/fabric.mod.json", "sparkstrength:engineer_stunned")
        requireText("src/main/java/dev/caecorthus/sparkdlc/strength/SparkStrengthItems.java", "SparkStrength.id(\"capture_device\")")
        requireText("src/main/java/dev/caecorthus/sparkdlc/strength/SparkStrengthItems.java", "SparkStrength.id(\"power_restoration\")")
        requireText("src/main/java/dev/caecorthus/sparkdlc/strength/SparkStrengthEntities.java", "SparkStrength.id(\"capture_device\")")
        [
                "capture_device_placed",
                "capture_device_triggered",
                "capture_device_released",
                "capture_device_expired"
        ].each { replayId ->
            requireText(
                    "src/main/java/dev/caecorthus/sparkdlc/strength/replay/CaptureDeviceReplayEvents.java",
                    "SparkStrength.id(\"${replayId}\")"
            )
        }

        def properties = new Properties()
        file("gradle.properties").withInputStream { properties.load(it) }
        pinnedProperties.each { propertyName ->
            def configuredValue = properties.getProperty(propertyName)
            if (configuredValue == null || configuredValue.isEmpty() ||
                    project.property(propertyName).toString() != configuredValue) {
                throw new GradleException(
                        "${propertyName} must be exactly the gradle.properties pin; " +
                                "found file=${configuredValue}, project=${project.property(propertyName)}"
                )
            }
        }

        def providerJarNames = fileTree("libs") {
            include "wathe-*.jar"
            include "noellesroles-*.jar"
        }.files.collect { it.name }.sort()
        def expectedProviderJarNames = providerBaselines.values().collect { it.fileName }.sort()
        if (providerJarNames != expectedProviderJarNames) {
            throw new GradleException(
                    "Provider jar inputs must be exactly ${expectedProviderJarNames}; found ${providerJarNames}"
            )
        }
        supersededProviderJars.each { fileName ->
            if (file("libs/${fileName}").exists()) {
                throw new GradleException("Superseded provider jar must be absent: ${fileName}")
            }
        }

        providerBaselines.each { modId, baseline ->
            def jarFile = file("libs/${baseline.fileName}")
            requireFile("libs/${baseline.fileName}")
            if (!(baseline.sha256 ==~ /[0-9a-f]{64}/)) {
                throw new GradleException("${modId}_sha256 in gradle.properties must be a lowercase sha256 digest")
            }
            def actualChecksum = sha256(jarFile)
            if (actualChecksum != baseline.sha256) {
                throw new GradleException(
                        "${baseline.fileName} checksum mismatch: expected ${baseline.sha256}, found ${actualChecksum}"
                )
            }
            def jarMetadata = readJarMetadata(jarFile)
            if (jarMetadata.id?.toString() != modId || jarMetadata.version?.toString() != baseline.version) {
                throw new GradleException(
                        "${baseline.fileName} metadata mismatch: expected ${modId} ${baseline.version}, " +
                                "found ${jarMetadata.id} ${jarMetadata.version}"
                )
            }
        }

        def sourceMetadata = new groovy.json.JsonSlurper().parse(file("src/main/resources/fabric.mod.json"))
        [wathe: '${wathe_version}', noellesroles: '${noellesroles_version}'].each { modId, template ->
            if (sourceMetadata.depends?.get(modId)?.toString() != template) {
                throw new GradleException("Source metadata dependency ${modId} must remain parameterized as ${template}")
            }
        }

        def processedMetadataFile = new File(tasks.named("processResources").get().destinationDir, "fabric.mod.json")
        if (!processedMetadataFile.isFile()) {
            throw new GradleException("Missing processed fabric.mod.json: ${processedMetadataFile}")
        }
        def processedMetadata = new groovy.json.JsonSlurper().parse(processedMetadataFile)
        if (processedMetadata.version?.toString() != project.mod_version.toString()) {
            throw new GradleException("Processed metadata version must be ${project.mod_version}")
        }
        [
                wathe        : providerBaselines.wathe.version,
                noellesroles : providerBaselines.noellesroles.version
        ].each { modId, expectedVersion ->
            if (processedMetadata.depends?.get(modId)?.toString() != expectedVersion) {
                throw new GradleException(
                        "Processed metadata dependency ${modId} must be ${expectedVersion}; " +
                                "found ${processedMetadata.depends?.get(modId)}"
                )
            }
        }
    }
}

def remappedModJar = tasks.named("remapJar")
def readClassNode = { java.util.zip.ZipFile archive, String entryName ->
    def entry = archive.getEntry(entryName)
    if (entry == null) {
        throw new GradleException("Missing class ${entryName} in ${archive.name}")
    }
    def node = new org.objectweb.asm.tree.ClassNode()
    archive.getInputStream(entry).withCloseable { input ->
        new org.objectweb.asm.ClassReader(input).accept(
                node,
                org.objectweb.asm.ClassReader.SKIP_DEBUG | org.objectweb.asm.ClassReader.SKIP_FRAMES
        )
    }
    node
}
def annotationValue = { annotation, String key ->
    def values = annotation?.values ?: []
    for (int index = 0; index < values.size(); index += 2) {
        if (values[index] == key) {
            return values[index + 1]
        }
    }
    null
}
tasks.register("verifyStrengthCompatibilityArtifact") {
    group = "verification"
    description = "Checks SparkStrength's metadata, mixins, and provider isolation in the remapped SparkDLC jar."
    dependsOn remappedModJar
    inputs.file(remappedModJar.flatMap { it.archiveFile })
    inputs.files(
            "src/main/resources/sparkstrength.mixins.json",
            "src/client/resources/sparkstrength.client.mixins.json"
    )

    doLast {
        def jarFile = remappedModJar.get().archiveFile.get().asFile
        def expectedJarName = "${project.archives_base_name}-${project.mod_version}.jar"
        if (jarFile.name != expectedJarName) {
            throw new GradleException("Remapped jar must be named ${expectedJarName}; found ${jarFile.name}")
        }

        def zipFile = new java.util.zip.ZipFile(jarFile)
        try {
            def metadataEntry = zipFile.getEntry("fabric.mod.json")
            if (metadataEntry == null) {
                throw new GradleException("Missing fabric.mod.json in ${jarFile.name}")
            }
            def metadata = new groovy.json.JsonSlurper().parse(zipFile.getInputStream(metadataEntry))
            // SparkStrength is no longer a mod of its own: the jar identifies as sparkdlc and keeps the legacy id
            // under `provides`, which is what isModLoaded("sparkstrength") in other mods and packs still answers to.
            // SparkStrength 不再是独立 mod：jar 的 id 是 sparkdlc，旧 id 保留在 `provides` 中，其他 mod 和整合包的
            // isModLoaded("sparkstrength") 仍靠它成立。
            if (metadata.id?.toString() != "sparkdlc" || metadata.name?.toString() != "SparkDLC" ||
                    metadata.version?.toString() != project.mod_version.toString()) {
                throw new GradleException(
                        "Final metadata must identify sparkdlc (SparkDLC) ${project.mod_version}; " +
                                "found ${metadata.id} (${metadata.name}) ${metadata.version}"
                )
            }
            def providedIds = (metadata.provides ?: []).collect { it.toString() }
            if (!providedIds.contains("sparkstrength")) {
                throw new GradleException("Final metadata must provide the legacy id sparkstrength; found ${providedIds}")
            }
            [
                    wathe        : providerBaselines.wathe.version,
                    noellesroles : providerBaselines.noellesroles.version
            ].each { modId, expectedVersion ->
                if (metadata.depends?.get(modId)?.toString() != expectedVersion) {
                    throw new GradleException(
                            "Final metadata dependency ${modId} must be ${expectedVersion}; found ${metadata.depends?.get(modId)}"
                    )
                }
            }

            // The standalone fabric.mod.json listed SparkStrength and SparkStrengthClient as entrypoints. The fused
            // one lists a single pair, which must start this module; the voice chat plugin and the component
            // initializer are still listed by name.
            // 独立的 fabric.mod.json 把 SparkStrength 与 SparkStrengthClient 列为入口。融合后只列出一对入口，它们必须
            // 启动本模块；语音插件和组件初始化器仍按名称列出。
            def requireEntrypoint = { String key, String className ->
                def listed = (metadata.entrypoints?.get(key) ?: []).collect { it.toString() }
                if (!listed.contains(className)) {
                    throw new GradleException("Final metadata entrypoint ${key} must list ${className}; found ${listed}")
                }
                if (zipFile.getEntry(className.replace('.', '/') + ".class") == null) {
                    throw new GradleException("Entrypoint class ${className} is missing from ${jarFile.name}")
                }
            }
            requireEntrypoint("voicechat", "dev.caecorthus.sparkdlc.strength.voice.SparkStrengthVoiceChatPlugin")
            requireEntrypoint("cardinal-components", "dev.caecorthus.sparkdlc.strength.component.SparkStrengthComponents")
            [
                    main  : ["dev.caecorthus.sparkdlc.SparkDLC", "onInitialize",
                             "dev/caecorthus/sparkdlc/strength/SparkStrength"],
                    client: ["dev.caecorthus.sparkdlc.client.SparkDLCClient", "onInitializeClient",
                             "dev/caecorthus/sparkdlc/strength/client/SparkStrengthClient"]
            ].each { key, expectation ->
                def (String entrypointClass, String initializerMethod, String moduleInitializer) = expectation
                requireEntrypoint(key, entrypointClass)
                def entrypointNode = readClassNode(zipFile, entrypointClass.replace('.', '/') + ".class")
                def startsModule = entrypointNode.methods.any { method ->
                    method.name == initializerMethod && method.desc == "()V" &&
                            method.instructions.toArray().any { instruction ->
                                instruction instanceof org.objectweb.asm.tree.MethodInsnNode &&
                                        instruction.owner == moduleInitializer &&
                                        instruction.name == initializerMethod && instruction.desc == "()V"
                            }
                }
                if (!startsModule) {
                    throw new GradleException(
                            "${entrypointClass}#${initializerMethod} must call ${moduleInitializer}#${initializerMethod}"
                    )
                }
            }
            def declaredComponents = (metadata.custom?.get("cardinal-components") ?: []).collect { it.toString() }
            if (!declaredComponents.contains("sparkstrength:engineer_stunned")) {
                throw new GradleException("Final metadata must declare the component sparkstrength:engineer_stunned")
            }

            // Both configs must also be listed in the fused metadata, the client one only for the client environment.
            // 两个配置还必须列在融合后的元数据中，客户端配置仅限 client 环境。
            def listedMixinConfigs = (metadata.mixins ?: []).collectEntries { entry ->
                entry instanceof Map
                        ? [(entry.config.toString()): entry.environment?.toString()]
                        : [(entry.toString()): null]
            }
            def expectedMixinEnvironments = [
                    "sparkstrength.mixins.json"        : null,
                    "sparkstrength.client.mixins.json" : "client"
            ]
            expectedMixinEnvironments.each { configName, environment ->
                if (!listedMixinConfigs.containsKey(configName) || listedMixinConfigs[configName] != environment) {
                    throw new GradleException(
                            "Final metadata must list ${configName} with environment ${environment}; " +
                                    "found ${listedMixinConfigs.subMap(expectedMixinEnvironments.keySet())}"
                    )
                }
            }
            def expectedMixinConfigs = [
                    "sparkstrength.mixins.json"        : "corruptcop.CorruptCopAbilityPacketMixin",
                    "sparkstrength.client.mixins.json" : "hud.MainHudDispatchMixin"
            ]
            expectedMixinConfigs.each { configName, requiredMixin ->
                def mixinEntry = zipFile.getEntry(configName)
                if (mixinEntry == null) {
                    throw new GradleException("Missing ${configName} in ${jarFile.name}")
                }
                def packagedBytes = zipFile.getInputStream(mixinEntry).bytes
                def sourcePath = configName == "sparkstrength.mixins.json"
                        ? "src/main/resources/${configName}"
                        : "src/client/resources/${configName}"
                if (!java.util.Arrays.equals(packagedBytes, file(sourcePath).bytes)) {
                    throw new GradleException("Packaged ${configName} differs from ${sourcePath}")
                }
                def mixinMetadata = new groovy.json.JsonSlurper().parseText(new String(packagedBytes, "UTF-8"))
                def configuredMixins = (mixinMetadata.mixins ?: []) + (mixinMetadata.client ?: [])
                if (!configuredMixins.contains(requiredMixin)) {
                    throw new GradleException("Missing required mixin ${requiredMixin} in ${configName}")
                }
            }
            def corruptCopMixinEntry = "dev/caecorthus/sparkdlc/strength/mixin/corruptcop/CorruptCopAbilityPacketMixin.class"
            def corruptCopMixin = readClassNode(zipFile, corruptCopMixinEntry)
            def packetDescriptor = "(Lorg/agmas/noellesroles/packet/AbilityC2SPacket;" +
                    "Lnet/fabricmc/fabric/api/networking/v1/ServerPlayNetworking\$Context;)V"
            def binarySelectors = [
                    "sparkstrength\$toggleCorruptCopAbilityHistorical" : "lambda\$registerPackets\$36${packetDescriptor}",
                    "sparkstrength\$toggleCorruptCopAbilityShared"     : "lambda\$registerPackets\$5${packetDescriptor}"
            ]
            binarySelectors.each { handlerName, expectedSelector ->
                def handler = corruptCopMixin.methods.find { it.name == handlerName }
                if (handler == null) {
                    throw new GradleException("Missing remapped CorruptCop handler ${handlerName}")
                }
                def annotations = []
                annotations.addAll(handler.visibleAnnotations ?: [])
                annotations.addAll(handler.invisibleAnnotations ?: [])
                def injection = annotations.find {
                    it.desc == "Lorg/spongepowered/asm/mixin/injection/Inject;"
                }
                def group = annotations.find {
                    it.desc == "Lorg/spongepowered/asm/mixin/injection/Group;"
                }
                if (injection == null || group == null) {
                    throw new GradleException("Missing @Inject/@Group on CorruptCop handler ${handlerName}")
                }
                def selectorValue = annotationValue(injection, "method")
                def selectors = selectorValue instanceof Collection
                        ? selectorValue.collect { it.toString() }
                        : [selectorValue?.toString()].findAll { it != null }
                if (selectors != [expectedSelector]) {
                    throw new GradleException(
                            "Packaged CorruptCop selector drift for ${handlerName}: expected ${expectedSelector}, found ${selectors}"
                    )
                }
                if (annotationValue(injection, "require")?.toString() != "0") {
                    throw new GradleException("Binary-specific CorruptCop injection must use require=0 within its group")
                }
                if (annotationValue(group, "name")?.toString() != "sparkstrength\$corruptCopAbility" ||
                        annotationValue(group, "min")?.toString() != "1" ||
                        annotationValue(group, "max")?.toString() != "1") {
                    throw new GradleException(
                            "CorruptCop compatibility group must require exactly one injection: ${handlerName}"
                    )
                }
            }

            // Like the mixin's @Group(min = 1, max = 1): of both selectors, only the pinned jar's handler may resolve.
            // 与 mixin 的 @Group(min = 1, max = 1) 一致：两个入口中只能命中锁定 jar 的那一个。
            def verifyProviderSeam = { File providerJar, String handlerName ->
                def providerZip = new java.util.zip.ZipFile(providerJar)
                try {
                    def noellesRoles = readClassNode(providerZip, "org/agmas/noellesroles/Noellesroles.class")
                    def expectedSelector = "${handlerName}${packetDescriptor}".toString()
                    def resolvedSelectors = binarySelectors.values().collect { it.toString() }.findAll { selector ->
                        noellesRoles.methods.any { it.name + it.desc == selector }
                    }
                    if (resolvedSelectors != [expectedSelector]) {
                        throw new GradleException(
                                "${providerJar.name} must resolve exactly ${expectedSelector} among the CorruptCop " +
                                        "selectors; found ${resolvedSelectors}"
                        )
                    }
                } finally {
                    providerZip.close()
                }
            }
            verifyProviderSeam(
                    file("libs/${providerBaselines.noellesroles.fileName}"),
                    providerBaselines.noellesroles.abilityHandler
            )

            // The Undercover's Assassin and swap immunities each bind one exact lambda with require = 0: a renumbered
            // NoellesRoles build must fail here instead of silently losing the immunity.
            // 卧底的刺杀免疫与交换免疫各以 require = 0 绑定一个确切的 lambda：NoellesRoles 编号变化必须在这里失败，
            // 而不是悄悄失去免疫。
            def verifyUndercoverImmunity = { label, mixinName, handlerMethod, providerHandler, packet ->
                def expectedSelector = ("${providerHandler}(Lorg/agmas/noellesroles/packet/${packet};" +
                        "Lnet/fabricmc/fabric/api/networking/v1/ServerPlayNetworking\$Context;)V").toString()
                def mixinNode = readClassNode(zipFile, "dev/caecorthus/sparkdlc/strength/mixin/undercover/${mixinName}.class")
                def handlerNode = mixinNode.methods.find { it.name == handlerMethod }
                if (handlerNode == null) {
                    throw new GradleException("Missing remapped Undercover ${label} immunity handler")
                }
                def injection = ((handlerNode.visibleAnnotations ?: []) +
                        (handlerNode.invisibleAnnotations ?: [])).find {
                    it.desc == "Lorg/spongepowered/asm/mixin/injection/Inject;"
                }
                def selectors = annotationValue(injection, "method")
                selectors = selectors instanceof Collection
                        ? selectors.collect { it.toString() }
                        : [selectors?.toString()].findAll { it != null }
                if (selectors != [expectedSelector]) {
                    throw new GradleException(
                            "Undercover ${label} selector drift: expected ${expectedSelector}, found ${selectors}")
                }
                def provider = new java.util.zip.ZipFile(file("libs/${providerBaselines.noellesroles.fileName}"))
                try {
                    def noellesRoles = readClassNode(provider, "org/agmas/noellesroles/Noellesroles.class")
                    if (!noellesRoles.methods.any { it.name + it.desc == expectedSelector }) {
                        throw new GradleException(
                                "${provider.name} has no ${expectedSelector} for the Undercover ${label} immunity")
                    }
                } finally {
                    provider.close()
                }
            }
            verifyUndercoverImmunity("Assassin", "UndercoverAssassinImmunityMixin",
                    "sparkstrength\$stage2UndercoverCannotBeAssassinated",
                    providerBaselines.noellesroles.assassinHandler, "AssassinGuessRoleC2SPacket")
            verifyUndercoverImmunity("Swapper", "UndercoverSwapImmunityMixin",
                    "sparkstrength\$stage2UndercoverCannotBeSwapped",
                    providerBaselines.noellesroles.swapperHandler, "SwapperC2SPacket")

            // The Assassin buff (silent, forgiven first miss; 3 s cooldown after a correct guess) binds the same guess
            // lambda with require = 0, through @WrapOperation and @Inject: every selector must still name the pinned
            // handler.
            // 刺客加强（首次猜错无声免死、猜对后 3 秒冷却）同样以 require = 0 绑定这个猜测 lambda（@WrapOperation 与 @Inject）：
            // 每个选择器都必须仍指向锁定的处理函数。
            def assassinGuessSelector = ("${providerBaselines.noellesroles.assassinHandler}" +
                    "(Lorg/agmas/noellesroles/packet/AssassinGuessRoleC2SPacket;" +
                    "Lnet/fabricmc/fabric/api/networking/v1/ServerPlayNetworking\$Context;)V").toString()
            def assassinGuessMixin = readClassNode(
                    zipFile, "dev/caecorthus/sparkdlc/strength/mixin/noellesroles/AssassinGuessOutcomeMixin.class")
            [
                    "sparkstrength\$forgivenMissIsSilent"      :
                            "Lcom/llamalad7/mixinextras/injector/wrapoperation/WrapOperation;",
                    "sparkstrength\$firstMissIsForgiven"        :
                            "Lcom/llamalad7/mixinextras/injector/wrapoperation/WrapOperation;",
                    "sparkstrength\$correctGuessCoolsDownFast" : "Lorg/spongepowered/asm/mixin/injection/Inject;"
            ].each { handlerMethod, annotationDesc ->
                def handlerNode = assassinGuessMixin.methods.find { it.name == handlerMethod }
                if (handlerNode == null) {
                    throw new GradleException("Missing remapped Assassin guess handler ${handlerMethod}")
                }
                def injection = ((handlerNode.visibleAnnotations ?: []) +
                        (handlerNode.invisibleAnnotations ?: [])).find { it.desc == annotationDesc }
                def selectors = annotationValue(injection, "method")
                selectors = selectors instanceof Collection
                        ? selectors.collect { it.toString() }
                        : [selectors?.toString()].findAll { it != null }
                if (selectors != [assassinGuessSelector]) {
                    throw new GradleException("Assassin guess selector drift on ${handlerMethod}: expected " +
                            "${assassinGuessSelector}, found ${selectors}")
                }
            }

            def nestedProviderBinary = zipFile.entries().find { entry ->
                def entryName = entry.name.toLowerCase(Locale.ROOT)
                (entryName.endsWith(".jar") && (entryName.contains("wathe") || entryName.contains("noellesroles"))) ||
                        entryName.startsWith("dev/doctor4t/wathe/") ||
                        entryName.startsWith("org/agmas/noellesroles/")
            }
            if (nestedProviderBinary != null) {
                throw new GradleException(
                        "Provider binary must not be nested in ${jarFile.name}: ${nestedProviderBinary.name}"
                )
            }
        } finally {
            zipFile.close()
        }
    }
}

// Every string a class file carries: annotation values (a @Mixin(targets = …) name included), constant fields and
// the string constants its code loads.
// 类文件携带的全部字符串：注解值（包括 @Mixin(targets = …) 的名称）、常量字段以及代码加载的字符串常量。
def collectAnnotationStrings
collectAnnotationStrings = { value, Collection<String> sink ->
    if (value instanceof String) {
        sink.add(value)
    } else if (value instanceof org.objectweb.asm.tree.AnnotationNode) {
        def values = value.values ?: []
        for (int index = 1; index < values.size(); index += 2) {
            collectAnnotationStrings(values[index], sink)
        }
    } else if (value instanceof Collection) {
        value.each { collectAnnotationStrings(it, sink) }
    }
}
def classStringConstants = { classNode ->
    def strings = new LinkedHashSet<String>()
    def collectAnnotations = { annotated ->
        ((annotated.visibleAnnotations ?: []) + (annotated.invisibleAnnotations ?: [])).each {
            collectAnnotationStrings(it, strings)
        }
    }
    collectAnnotations(classNode)
    classNode.fields.each { field ->
        collectAnnotations(field)
        if (field.value instanceof String) {
            strings.add(field.value)
        }
    }
    classNode.methods.each { method ->
        collectAnnotations(method)
        method.instructions.toArray().each { instruction ->
            if (instruction instanceof org.objectweb.asm.tree.LdcInsnNode && instruction.cst instanceof String) {
                strings.add(instruction.cst)
            }
        }
    }
    strings
}
// Standalone SparkStrength reached SparkFactionAPI, SparkTraits and SparkWitch only by name (reflection in the
// `compat` packages, string @Mixin targets), each behind isModLoaded(<legacy id>), and no build could check those
// names because the providers were never on its classpath. They still are names, so the compiler still does not check
// them, but the providers now sit in the same jar: a renamed or moved class must fail here instead of silently
// switching the bridge off at runtime. Only class names and the hasActiveTrait descriptor are checked; the other
// reflected method names are not.
// 独立的 SparkStrength 只按名称访问 SparkFactionAPI、SparkTraits 与 SparkWitch（`compat` 包中的反射、字符串形式的 @Mixin
// 目标），且都以 isModLoaded(<旧 id>) 为前提；由于这些提供方从不在它的类路径上，没有任何构建能校验这些名称。它们现在
// 仍是名称，编译器依旧不会检查，但提供方已在同一个 jar 中：类被改名或移动时必须在这里失败，而不是在运行时悄悄关闭桥接。
// 这里只校验类名和 hasActiveTrait 的描述符，其余反射方法名不在校验范围内。
tasks.register("verifyStrengthSiblingSeams") {
    group = "verification"
    description = "Checks that the sibling-module classes SparkStrength reaches by name exist in the remapped SparkDLC jar."
    dependsOn remappedModJar
    inputs.file(remappedModJar.flatMap { it.archiveFile })

    doLast {
        def jarFile = remappedModJar.get().archiveFile.get().asFile
        // A whole constant that is a sibling class name, dotted (Class.forName) or with slashes (Loom writes a string
        // @Mixin target that way), and any sibling type descriptor inside a longer constant (an @At target).
        // 整个常量就是兄弟模块类名的情况：点分形式（Class.forName）或斜杠形式（Loom 会这样写出字符串 @Mixin 目标）；
        // 以及较长常量中出现的兄弟模块类型描述符（@At 目标）。
        def identifier = "[A-Za-z_\$][A-Za-z0-9_\$]*"
        def modules = "(?:${siblingModules.join('|')})"
        def dottedClassName = java.util.regex.Pattern.compile(
                "dev\\.caecorthus\\.sparkdlc\\.${modules}(?:\\.${identifier})+")
        def internalClassName = java.util.regex.Pattern.compile(
                "dev/caecorthus/sparkdlc/${modules}(?:/${identifier})+")
        def embeddedDescriptor = java.util.regex.Pattern.compile(
                "L(dev/caecorthus/sparkdlc/${modules}(?:/${identifier})+);")
        def namedSiblingClasses = { String constant ->
            if (dottedClassName.matcher(constant).matches()) {
                return [constant.replace('.', '/')]
            }
            if (internalClassName.matcher(constant).matches()) {
                return [constant]
            }
            def named = []
            def matcher = embeddedDescriptor.matcher(constant)
            while (matcher.find()) {
                named.add(matcher.group(1))
            }
            named
        }
        def zipFile = new java.util.zip.ZipFile(jarFile)
        try {
            def metadata = new groovy.json.JsonSlurper().parse(zipFile.getInputStream(zipFile.getEntry("fabric.mod.json")))
            // The bridges only resolve after isModLoaded("sparkfactionapi" / "sparktraits" / "sparkwitch"); in the fused
            // mod those ids exist only as `provides` aliases, so losing one would switch every bridge behind it off.
            // 桥接只在 isModLoaded("sparkfactionapi" / "sparktraits" / "sparkwitch") 成立后才解析；融合后这些 id 仅以
            // `provides` 别名存在，缺少任何一个都会关闭其后的全部桥接。
            def providedIds = (metadata.provides ?: []).collect { it.toString() }
            def missingGateIds = ["sparkfactionapi", "sparktraits", "sparkwitch"] - providedIds
            if (!missingGateIds.isEmpty()) {
                throw new GradleException(
                        "Final metadata must provide ${missingGateIds}: SparkStrength's bridges gate on isModLoaded for them"
                )
            }

            def seams = new TreeMap<String, Set<String>>()
            zipFile.entries().findAll { entry ->
                entry.name.startsWith("dev/caecorthus/sparkdlc/strength/") && entry.name.endsWith(".class")
            }.each { entry ->
                classStringConstants(readClassNode(zipFile, entry.name)).each { constant ->
                    namedSiblingClasses(constant).each { className ->
                        seams.computeIfAbsent(className) { new TreeSet<String>() }.add(entry.name)
                    }
                }
            }
            // The scan must keep finding the seam the source contract in verifyStrengthArchitecture requires.
            // 扫描必须始终能找到 verifyStrengthArchitecture 源码契约所要求的那个接缝。
            if (!seams.containsKey("dev/caecorthus/sparkdlc/traits/api/SparkTraitsApi")) {
                throw new GradleException(
                        "Sibling seam scan found no reference to SparkTraitsApi in ${jarFile.name}; found ${seams.keySet()}"
                )
            }
            def unresolved = seams.findAll { className, users ->
                zipFile.getEntry(className + ".class") == null
            }
            if (!unresolved.isEmpty()) {
                throw new GradleException(
                        "SparkStrength names sibling classes that are missing from ${jarFile.name}: " +
                                unresolved.collect { className, users -> "${className} (named by ${users.join(', ')})" }
                                        .join("; ")
                )
            }
            logger.lifecycle("verifyStrengthSiblingSeams: ${seams.size()} sibling classes named by SparkStrength resolve in ${jarFile.name}")

            // The one reflected method the source contract pins: public static boolean
            // SparkTraitsApi.hasActiveTrait(PlayerEntity, Identifier). The jar is remapped, so the parameter types
            // carry their intermediary names (class_1657 = PlayerEntity, class_2960 = Identifier).
            // 源码契约所钉的唯一反射方法：public static boolean SparkTraitsApi.hasActiveTrait(PlayerEntity, Identifier)。
            // jar 已重映射，参数类型使用 intermediary 名称（class_1657 = PlayerEntity，class_2960 = Identifier）。
            def traitsApi = readClassNode(zipFile, "dev/caecorthus/sparkdlc/traits/api/SparkTraitsApi.class")
            def publicStatic = org.objectweb.asm.Opcodes.ACC_PUBLIC | org.objectweb.asm.Opcodes.ACC_STATIC
            def hasActiveTrait = traitsApi.methods.find {
                it.name == "hasActiveTrait" && it.desc == "(Lnet/minecraft/class_1657;Lnet/minecraft/class_2960;)Z"
            }
            if ((traitsApi.access & org.objectweb.asm.Opcodes.ACC_PUBLIC) == 0 || hasActiveTrait == null ||
                    (hasActiveTrait.access & publicStatic) != publicStatic) {
                throw new GradleException(
                        "SparkTraitsApi must keep public static boolean hasActiveTrait(PlayerEntity, Identifier); " +
                                "found ${traitsApi.methods.findAll { it.name == 'hasActiveTrait' }.collect { it.name + it.desc }}"
                )
            }
        } finally {
            zipFile.close()
        }
    }
}

tasks.register("verifyStrength") {
    group = "verification"
    description = "Runs every SparkStrength verification task."
    dependsOn "verifyStrengthArchitecture", "verifyStrengthCompatibilityArtifact", "verifyStrengthSiblingSeams"
}
