// Shared closures of the verify scripts, defined once. The root build.gradle applies this file before every other
// script in gradle/verify; they reach the closures through `verifySupport` (usually bound to a local name at the top of
// the script, e.g. `def readClassNode = verifySupport.readClassNode`).
//
// The scripts are grouped by WHAT they check (the jar, the pinned upstream jars, the layering inside the mod, ...), not
// by which of the five former mods a check came from, and no check takes its subject from the move manifest
// tools/unify/file-moves.tsv: every rule is stated over the current layout (packages, the two source sets, the two
// mixin configs, the one jar), so a file added tomorrow is covered. A scan must never pass because it looked at
// nothing: the helpers below fail loudly on an empty subject set.
//
// 各校验脚本共用的闭包，只定义一次。根 build.gradle 在 gradle/verify 的其他脚本之前应用本文件；其他脚本通过 `verifySupport`
// 取用这些闭包（通常在脚本开头绑定为局部名，例如 `def readClassNode = verifySupport.readClassNode`）。
// 脚本按“校验什么”分组（jar、固定的上游 jar、模组内部分层……），而不是按校验来自五个旧 mod 中的哪一个；任何校验都不从搬迁清单
// tools/unify/file-moves.tsv 取得对象集合：每条规则都针对当前布局（包、两个源码集、两份 mixin 配置、唯一的 jar）表述，
// 因此以后新增的文件也在范围内。扫描绝不能因为什么都没看而通过：下方的辅助在对象集合为空时明确失败。

// A script applied with `apply from:` does not see the root build's plugin classpath (where Loom brings ASM), so each
// script that names an ASM type declares ASM for itself. Gradle gives scripts with the SAME buildscript classpath one
// shared class loader, and only then is a ClassNode read here an `instanceof` of the ASM types named in another script.
// Every such script therefore repeats exactly this block and calls `verifySupport.requireSharedAsm` right after it,
// which fails the build when the class loaders differ (for example after one block was edited and the others not).
// 通过 `apply from:` 应用的脚本看不到根构建的插件类路径（Loom 的 ASM 在那里），因此凡是点名 ASM 类型的脚本都要自行声明 ASM。
// Gradle 会让 buildscript 类路径完全相同的脚本共用一个类加载器；只有这样，这里读出的 ClassNode 才是其他脚本所点名 ASM 类型的
// `instanceof`。因此每个这样的脚本都原样重复这一段，并紧接着调用 `verifySupport.requireSharedAsm`：类加载器不一致时
// （例如只改了其中一段）构建会失败。
buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.ow2.asm:asm-tree:9.9"
        classpath "org.ow2.asm:asm-analysis:9.9"
    }
}

def rootPackage = "dev.caecorthus.sparkdlc"
def rootPath = "dev/caecorthus/sparkdlc/"

// The only tests tracked by git (two Ponder tests): a fresh clone has these and nothing else under src/test.
// git 跟踪的仅有的测试（两个 Ponder 测试）：全新克隆的 src/test 下只有它们。
def trackedTests = [
        "src/test/java/dev/caecorthus/sparkdlc/ponder/ActorMovementTest.java",
        "src/test/java/dev/caecorthus/sparkdlc/ponder/PonderCaptionBoundsTest.java"
]

def readClassNode = { java.util.zip.ZipFile archive, String entryName ->
    def entry = archive.getEntry(entryName)
    if (entry == null) {
        throw new GradleException("Missing class ${entryName} in ${archive.name}")
    }
    def node = new org.objectweb.asm.tree.ClassNode()
    archive.getInputStream(entry).withCloseable { input ->
        new org.objectweb.asm.ClassReader(input).accept(
                node,
                org.objectweb.asm.ClassReader.SKIP_DEBUG | org.objectweb.asm.ClassReader.SKIP_FRAMES
        )
    }
    node
}

def annotationValue = { annotation, String key ->
    def values = annotation?.values ?: []
    for (int index = 0; index < values.size(); index += 2) {
        if (values[index] == key) {
            return values[index + 1]
        }
    }
    null
}

// Every string a class file carries: annotation values (a @Mixin(targets = …) name included), constant fields and
// the string constants its code loads.
// 类文件携带的全部字符串：注解值（包括 @Mixin(targets = …) 的名称）、常量字段以及代码加载的字符串常量。
def collectAnnotationStrings
collectAnnotationStrings = { value, Collection<String> sink ->
    if (value instanceof String) {
        sink.add(value)
    } else if (value instanceof org.objectweb.asm.tree.AnnotationNode) {
        def values = value.values ?: []
        for (int index = 1; index < values.size(); index += 2) {
            collectAnnotationStrings(values[index], sink)
        }
    } else if (value instanceof Collection) {
        value.each { collectAnnotationStrings(it, sink) }
    }
}
def classStringConstants = { classNode ->
    def strings = new LinkedHashSet<String>()
    def collectAnnotations = { annotated ->
        ((annotated.visibleAnnotations ?: []) + (annotated.invisibleAnnotations ?: [])).each {
            collectAnnotationStrings(it, strings)
        }
    }
    collectAnnotations(classNode)
    classNode.fields.each { field ->
        collectAnnotations(field)
        if (field.value instanceof String) {
            strings.add(field.value)
        }
    }
    classNode.methods.each { method ->
        collectAnnotations(method)
        method.instructions.toArray().each { instruction ->
            if (instruction instanceof org.objectweb.asm.tree.LdcInsnNode && instruction.cst instanceof String) {
                strings.add(instruction.cst)
            }
        }
    }
    strings
}

def ownClassName = java.util.regex.Pattern.compile("dev/caecorthus/sparkdlc/[A-Za-z0-9_/\$]+")

project.ext.verifySupport = [
        rootPackage         : rootPackage,
        rootPath            : rootPath,
        trackedTests        : trackedTests,
        remappedModJar      : tasks.named("remapJar"),
        sourcesJar          : tasks.named("sourcesJar"),
        // The pinned upstream jars the mod is built and audited against (gradle.properties holds the versions and
        // checksums; verifyUpstreamJars checks them).
        // 本模组构建与审计所依据的固定上游 jar（版本与校验和在 gradle.properties 中；由 verifyUpstreamJars 校验）。
        watheJar            : file("libs/wathe-${project.wathe_version}.jar"),
        noellesRolesJar     : file("libs/noellesroles-${project.noellesroles_version}.jar"),
        readClassNode       : readClassNode,
        annotationValue     : annotationValue,
        classStringConstants: classStringConstants,
        // See the buildscript note above. / 见上方 buildscript 说明。
        requireSharedAsm    : { Class localClassNode ->
            if (!localClassNode.is(org.objectweb.asm.tree.ClassNode)) {
                throw new GradleException("A verify script loads its own copy of ASM: its buildscript block must be " +
                        "identical to the one in gradle/verify/support.gradle (same dependencies, same versions)")
            }
        },
        // Visible and invisible annotations of a class, field or method node. / 类、字段或方法节点的全部注解。
        annotationsOf       : { node -> (node?.visibleAnnotations ?: []) + (node?.invisibleAnnotations ?: []) },
        // The `method` selectors of an injector annotation, as a list of strings. / 注入注解的 `method` 选择器列表。
        selectorsOf         : { injection ->
            def value = annotationValue(injection, "method")
            value instanceof Collection ? value.collect { it.toString() } : [value?.toString()].findAll { it != null }
        },
        sha256              : { File target ->
            def digest = java.security.MessageDigest.getInstance("SHA-256")
            target.withInputStream { input ->
                byte[] buffer = new byte[8192]
                for (int count = input.read(buffer); count != -1; count = input.read(buffer)) {
                    digest.update(buffer, 0, count)
                }
            }
            digest.digest().collect { String.format("%02x", it & 0xff) }.join()
        },
        // A JSON entry of an archive, parsed; a missing entry is an error with the archive's name.
        // 归档中某个 JSON 条目的解析结果；条目缺失时报错并带上归档名。
        jsonEntry           : { java.util.zip.ZipFile archive, String entryName ->
            def entry = archive.getEntry(entryName)
            if (entry == null) {
                throw new GradleException("Missing ${entryName} in ${new File(archive.name).name}")
            }
            new groovy.json.JsonSlurper().parse(archive.getInputStream(entry))
        },
        // fabric.mod.json of a jar file. / 某个 jar 的 fabric.mod.json。
        modMetadataOf       : { File jarFile ->
            def archive = new java.util.zip.ZipFile(jarFile)
            try {
                def entry = archive.getEntry("fabric.mod.json")
                if (entry == null) {
                    throw new GradleException("Missing fabric.mod.json in ${jarFile.name}")
                }
                new groovy.json.JsonSlurper().parse(archive.getInputStream(entry))
            } finally {
                archive.close()
            }
        },
        // Internal names (dev/caecorthus/sparkdlc/...) of the mod's classes in a jar, nested classes included, as a
        // sorted set. A jar without any is an error: every scan built on this must look at something.
        // jar 中本模组各类的内部名（含嵌套类），已排序。一个都没有时报错：建立在其上的扫描必须确实看到了东西。
        modClasses          : { java.util.zip.ZipFile archive ->
            def names = new TreeSet<String>()
            archive.entries().each { entry ->
                if (entry.name.startsWith(rootPath) && entry.name.endsWith(".class")) {
                    names.add(entry.name.substring(0, entry.name.length() - ".class".length()))
                }
            }
            if (names.isEmpty()) {
                throw new GradleException("No ${rootPath} class in ${new File(archive.name).name}; the scan would check nothing")
            }
            names
        },
        // The mod classes a class file names as a TYPE: every dev/caecorthus/sparkdlc/... name in a constant-pool
        // Utf8 entry that is not the body of a string constant. That covers the classes it calls, instantiates,
        // extends, casts to or reads a field of (CONSTANT_Class), and the ones that appear only in a descriptor or a
        // generic signature (parameter, return, field and local-variable types) or in an annotation. Names inside
        // string constants are a different question (verifyNoLookupByName). The class's own name is left out.
        // 类文件以“类型”方式点名的本模组类：常量池中不属于字符串常量内容的 Utf8 条目里出现的每个
        // dev/caecorthus/sparkdlc/... 名称。涵盖它调用、实例化、继承、强转或读取字段的类（CONSTANT_Class），以及只出现在描述符、
        // 泛型签名（参数、返回值、字段与局部变量类型）或注解中的类。字符串常量中的名称是另一个问题（verifyNoLookupByName）。
        // 不包含该类自身的名字。
        namedModClasses     : { byte[] classFile ->
            def input = new DataInputStream(new ByteArrayInputStream(classFile))
            if (input.readInt() != (int) 0xCAFEBABE) {
                throw new GradleException("Not a class file")
            }
            input.readUnsignedShort()
            input.readUnsignedShort()
            int count = input.readUnsignedShort()
            def utf8 = [:]
            def stringBodies = [] as Set
            def classNames = [:]
            for (int index = 1; index < count; index++) {
                int tag = input.readUnsignedByte()
                switch (tag) {
                    case 1: utf8[index] = input.readUTF(); break
                    case 3: case 4: input.skipBytes(4); break
                    case 5: case 6: input.skipBytes(8); index++; break
                    case 7: classNames[index] = input.readUnsignedShort(); break
                    case 8: stringBodies.add(input.readUnsignedShort()); break
                    case 9: case 10: case 11: case 12: case 17: case 18: input.skipBytes(4); break
                    case 15: input.skipBytes(3); break
                    case 16: case 19: case 20: input.skipBytes(2); break
                    default: throw new GradleException("Unknown constant pool tag ${tag}")
                }
            }
            // this_class follows the access flags. / this_class 位于访问标志之后。
            input.readUnsignedShort()
            def self = utf8[classNames[input.readUnsignedShort()]]
            def named = new TreeSet<String>()
            utf8.each { index, text ->
                if (!stringBodies.contains(index)) {
                    def matcher = ownClassName.matcher(text)
                    while (matcher.find()) {
                        named.add(matcher.group())
                    }
                }
            }
            named.remove(self)
            named
        },
        // Whether this checkout has the local-only tests: src/test is gitignored, and a fresh clone holds only the
        // tracked tests above. Any other Java source under src/test means the local tree is here, and then every
        // contract test a verify task names is required.
        // 当前检出是否带有仅存于本地的测试：src/test 已被 gitignore，全新克隆只有上面已跟踪的测试。src/test 下出现其他任何
        // Java 源码即表示本地测试树存在，此时校验任务点名的每个契约测试都是必需的。
        localTestsPresent   : {
            fileTree("src/test") { include "**/*.java" }.files.any {
                !trackedTests.contains(project.relativePath(it).replace(File.separatorChar, '/' as char))
            }
        },
        // Production sources of both source sets, as [file, repository-relative path] pairs; never empty.
        // 两个源码集的生产源码，形如 [文件, 仓库相对路径]；绝不为空。
        productionSources   : {
            def sources = (fileTree("src/main/java") { include "**/*.java" }.files +
                    fileTree("src/client/java") { include "**/*.java" }.files).collect {
                [it, project.relativePath(it).replace(File.separatorChar, '/' as char)]
            }.sort { it[1] }
            if (sources.isEmpty()) {
                throw new GradleException("No production source under src/main/java or src/client/java; the scan would check nothing")
            }
            sources
        }
]
