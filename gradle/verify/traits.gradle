// Verification tasks of the traits module (formerly the SparkTraits build script), applied by the root build.gradle.
// Every task carries the `Traits` infix; `verifyTraits` at the bottom runs them all. The root build owns plugins,
// repositories, dependencies, resources and the jar; this script only verifies.
// traits 模块的校验任务（原 SparkTraits 构建脚本），由根 build.gradle 应用。所有任务名都带 `Traits` 中缀，文件末尾的
// `verifyTraits` 汇总运行全部任务。插件、仓库、依赖、资源与 jar 由根构建负责，本脚本只做校验。

// A script applied with `apply from:` does not see the root build's plugin classpath, so the ASM classes the bytecode
// checks use (Loom brought them along while this was the SparkTraits build script) are declared here.
// 通过 `apply from:` 应用的脚本看不到根构建的插件类路径，因此字节码校验用到的 ASM 类（本脚本还是 SparkTraits 构建脚本时
// 由 Loom 附带）在此显式声明。
buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.ow2.asm:asm-tree:9.9"
        classpath "org.ow2.asm:asm-analysis:9.9"
    }
}

// The Wathe / NoellesRoles jars moved from the SparkTraits repository root to libs/; their checksums are pinned once
// for the whole mod in gradle.properties (`wathe_sha256`, `noellesroles_sha256`). SparkFactionAPI is no longer a
// dependency jar: it is the factionapi module of this same source tree.
// Wathe / NoellesRoles jar 已从 SparkTraits 仓库根目录移到 libs/；校验和在 gradle.properties 中为整个 mod 统一固定
// （`wathe_sha256`、`noellesroles_sha256`）。SparkFactionAPI 不再是依赖 jar：它是同一源码树中的 factionapi 模块。
def watheJarName = "libs/wathe-${project.wathe_version}.jar"
def noellesRolesJarName = "libs/noellesroles-${project.noellesroles_version}.jar"

def remappedModJar = tasks.named("remapJar")

// Legacy mod ids the traits module needs the fused mod to answer for. As a separate mod SparkTraits was `sparktraits`
// and had `depends sparkfactionapi`, and its compat bridges gated on FabricLoader#isModLoaded for `sparkstrength` and
// `sparkwitch`. Those bridges now call the sibling modules directly, so the traits module itself no longer asks; the
// ids must still be provided, because the other modules' bridges and external mods and packs still ask
// isModLoaded for them.
// traits 模块需要融合后的 mod 代为应答的旧 mod id。独立 mod 时期 SparkTraits 的 id 是 `sparktraits`，并且
// `depends sparkfactionapi`，其兼容桥曾以 FabricLoader#isModLoaded 判断 `sparkstrength` 与 `sparkwitch`。这些兼容桥现已
// 直接调用兄弟模块，traits 模块自身不再做此判断；但这些 id 仍必须由 `provides` 提供，因为其他模块的兼容桥以及外部 mod、
// 整合包仍以 isModLoaded 判断它们。
def traitsProvidedModIds = ["sparktraits", "sparkfactionapi", "sparkstrength", "sparkwitch"]
// Replaces the SparkFactionAPI jar pin and the `depends sparkfactionapi` predicate: the sibling modules ship in this
// jar, so their ids must be provided and must not come back as dependency predicates on this mod itself.
// 取代 SparkFactionAPI jar 的校验和固定与 `depends sparkfactionapi` 谓词：兄弟模块随本 jar 发布，因此它们的 id 必须由
// provides 提供，且不得再作为针对本 mod 自身的依赖谓词出现。
def verifyTraitsProvidedModIds = { metadata, String label ->
    def provides = metadata.provides ?: []
    traitsProvidedModIds.each { modId ->
        if (!provides.contains(modId)) {
            throw new GradleException("Missing provided mod id ${modId} in ${label}")
        }
        ["depends", "recommends", "suggests", "conflicts", "breaks"].each { relation ->
            if (metadata.get(relation)?.containsKey(modId)) {
                throw new GradleException("Stale ${relation} entry for the fused module id ${modId} in ${label}")
            }
        }
    }
}

def readClassNode = { java.util.zip.ZipFile archive, String entryName ->
    def entry = archive.getEntry(entryName)
    if (entry == null) {
        throw new GradleException("Missing class ${entryName} in ${archive.name}")
    }
    def node = new org.objectweb.asm.tree.ClassNode()
    archive.getInputStream(entry).withCloseable { input ->
        new org.objectweb.asm.ClassReader(input).accept(
                node,
                org.objectweb.asm.ClassReader.SKIP_DEBUG | org.objectweb.asm.ClassReader.SKIP_FRAMES
        )
    }
    node
}

def annotationValue = { annotation, String key ->
    def values = annotation?.values ?: []
    for (int index = 0; index < values.size(); index += 2) {
        if (values[index] == key) {
            return values[index + 1]
        }
    }
    null
}

def verifyTraitsAssassinScreenSelector = tasks.register("verifyTraitsAssassinScreenSelector") {
    group = "verification"
    description = "Checks the packaged AssassinScreenMixin selector against the pinned NoellesRoles jar."
    dependsOn remappedModJar
    inputs.file(remappedModJar.flatMap { it.archiveFile })
    inputs.file(noellesRolesJarName)
    inputs.file("src/client/resources/sparkdlc.client.mixins.json")

    doLast {
        def jarFile = remappedModJar.get().archiveFile.get().asFile
        def noellesRolesFile = file(noellesRolesJarName)
        def modZip = new java.util.zip.ZipFile(jarFile)
        def noellesRolesZip = new java.util.zip.ZipFile(noellesRolesFile)
        try {
            def configEntry = modZip.getEntry("sparkdlc.client.mixins.json")
            if (configEntry == null) {
                throw new GradleException("Missing sparkdlc.client.mixins.json in ${jarFile.name}")
            }
            def config = new groovy.json.JsonSlurper().parse(modZip.getInputStream(configEntry))
            if (config.required != true || config.injectors?.defaultRequire?.toString() != "1") {
                throw new GradleException("SparkTraits client mixins must remain required with defaultRequire 1")
            }
            if (!(config.client ?: []).contains("trait.AssassinScreenMixin")) {
                throw new GradleException("Missing AssassinScreenMixin from sparkdlc.client.mixins.json")
            }

            def mixinNode = readClassNode(
                    modZip,
                    "dev/caecorthus/sparkdlc/client/mixin/trait/AssassinScreenMixin.class"
            )
            def handler = mixinNode.methods.find { it.name == "sparktraits\$paginateRoleGuessPanel" }
            if (handler == null) {
                throw new GradleException("Missing AssassinScreenMixin pagination handler")
            }
            def annotations = []
            annotations.addAll(handler.visibleAnnotations ?: [])
            annotations.addAll(handler.invisibleAnnotations ?: [])
            def injection = annotations.find {
                it.desc == "Lorg/spongepowered/asm/mixin/injection/Inject;"
            }
            if (injection == null) {
                throw new GradleException("Missing @Inject on AssassinScreenMixin pagination handler")
            }
            def selectorValue = annotationValue(injection, "method")
            def selectors = selectorValue instanceof Collection
                    ? selectorValue.collect { it.toString() }
                    : [selectorValue?.toString()].findAll { it != null }
            if (selectors != ["method_25426()V"]) {
                throw new GradleException(
                        "Packaged AssassinScreen selector drift: expected method_25426()V, found ${selectors}"
                )
            }
            if (annotationValue(injection, "require")?.toString() == "0") {
                throw new GradleException("AssassinScreen pagination injection cannot use require=0")
            }

            def providerNode = readClassNode(
                    noellesRolesZip,
                    "org/agmas/noellesroles/client/screen/AssassinScreen.class"
            )
            if (providerNode.methods.find { it.name == "method_25426" && it.desc == "()V" } == null) {
                throw new GradleException(
                        "NoellesRoles ${project.noellesroles_version} is missing AssassinScreen.method_25426()V"
                )
            }
        } finally {
            noellesRolesZip.close()
            modZip.close()
        }
    }
}

def verifyTraitsInventoryScreenSelector = tasks.register("verifyTraitsInventoryScreenSelector") {
    group = "verification"
    description = "Checks the packaged TraitInventoryScreenMixin selector against the pinned Wathe jar."
    dependsOn remappedModJar
    inputs.file(remappedModJar.flatMap { it.archiveFile })
    inputs.file(watheJarName)
    doLast {
        def modZip = new java.util.zip.ZipFile(remappedModJar.get().archiveFile.get().asFile)
        def providerZip = new java.util.zip.ZipFile(file(watheJarName))
        try {
            def config = new groovy.json.JsonSlurper().parse(modZip.getInputStream(modZip.getEntry("sparkdlc.client.mixins.json")))
            if (config.required != true || config.injectors?.defaultRequire?.toString() != "1" ||
                    !(config.client ?: []).contains("trait.TraitInventoryScreenMixin")) {
                throw new GradleException("Owner inventory mixin must remain required and configured")
            }
            def node = readClassNode(modZip, "dev/caecorthus/sparkdlc/client/mixin/trait/TraitInventoryScreenMixin.class")
            def handler = node.methods.find { it.name == 'sparktraits$renderOwnerTraits' }
            def annotations = (handler?.visibleAnnotations ?: []) + (handler?.invisibleAnnotations ?: [])
            def injection = annotations.find { it.desc == "Lorg/spongepowered/asm/mixin/injection/Inject;" }
            if (annotationValue(injection, "method") != ["method_25394(Lnet/minecraft/class_332;IIF)V"] ||
                    annotationValue(injection, "require")?.toString() == "0") {
                throw new GradleException("Packaged owner inventory selector must exactly match Wathe render")
            }
            def provider = readClassNode(providerZip, "dev/doctor4t/wathe/client/gui/screen/ingame/LimitedInventoryScreen.class")
            if (!provider.methods.any { it.name == "method_25394" && it.desc == "(Lnet/minecraft/class_332;IIF)V" }) {
                throw new GradleException("Wathe is missing the exact owner inventory render target")
            }
        } finally {
            providerZip.close()
            modZip.close()
        }
    }
}

// ADAPT (was verifyModJarVersion): SparkTraits is no longer its own jar. The fused jar is checked for what the traits
// module still needs from it: the jar/metadata version, the Wathe/NoellesRoles pins, the fused entrypoints starting
// SparkTraits / SparkTraitsClient, the voicechat entrypoint, both traits mixin configs being listed, the legacy mod
// ids being provided, and the required runtime classes.
// 调整（原 verifyModJarVersion）：SparkTraits 不再是独立 jar。此处校验融合 jar 中 traits 模块仍然依赖的内容：jar 与元数据
// 版本、Wathe/NoellesRoles 版本固定、融合后的入口会启动 SparkTraits / SparkTraitsClient、voicechat 入口、两份 traits mixin
// 配置均已列出、旧 mod id 由 provides 提供，以及必需的运行时类。
def verifyTraitsModJar = tasks.register("verifyTraitsModJar") {
    group = "verification"
    description = "Checks the traits module's entrypoints, mixin configs, dependency pins and required classes in the remapped SparkDLC jar."
    dependsOn remappedModJar
    inputs.file(remappedModJar.flatMap { it.archiveFile })

    doLast {
        def jarFile = remappedModJar.get().archiveFile.get().asFile
        def archiveName = remappedModJar.get().archiveBaseName.get()
        def suffix = ".jar"
        if (!jarFile.name.startsWith("${archiveName}-") || !jarFile.name.endsWith(suffix)) {
            throw new GradleException("Cannot read version from jar filename: ${jarFile.name}")
        }

        // Keep the loader-visible mod version tied to the shipped jar filename.
        // 将加载器可见版本绑定到发布 jar 文件名，避免软件里显示旧版本。
        def jarVersion = jarFile.name.substring(archiveName.length() + 1, jarFile.name.length() - suffix.length())
        def zipFile = new java.util.zip.ZipFile(jarFile)
        try {
            def entry = zipFile.getEntry("fabric.mod.json")
            if (entry == null) {
                throw new GradleException("Missing fabric.mod.json in ${jarFile.name}")
            }

            def metadata = new groovy.json.JsonSlurper().parse(zipFile.getInputStream(entry))
            def metadataVersion = metadata.version?.toString()
            if (metadataVersion != jarVersion) {
                throw new GradleException("Jar version mismatch: ${jarFile.name} says ${jarVersion}, but fabric.mod.json says ${metadataVersion}")
            }
            if (metadata.depends?.wathe?.toString() != project.wathe_version.toString()) {
                throw new GradleException(
                        "Remapped jar Wathe dependency mismatch: expected ${project.wathe_version}, found ${metadata.depends?.wathe}"
                )
            }
            if (metadata.depends?.noellesroles?.toString() != project.noellesroles_version.toString()) {
                throw new GradleException(
                        "Remapped jar NoellesRoles dependency mismatch: expected ${project.noellesroles_version}, " +
                                "found ${metadata.depends?.noellesroles}"
                )
            }

            // The fused client entrypoint replaces the listed SparkTraitsClient and must still start it. The common
            // SparkTraits initializer is started the same way by the fused main entrypoint.
            // 融合后的客户端入口取代了原先列出的 SparkTraitsClient，且必须仍然启动它；通用端的 SparkTraits 初始化同样由
            // 融合后的 main 入口启动。
            // Stage 3 ("one entry"): the per-module initializer classes are gone; SparkDLC / SparkDLCClient are the
            // whole start-up, split into private steps. "The fused entrypoint still starts this module" therefore
            // reads: some method of the entrypoint class still makes the module's characteristic start-up call.
            // 第三阶段（“单一入口”）：各模块的初始化类已不存在；SparkDLC / SparkDLCClient 就是完整的启动流程，拆成若干私有步骤。
            // 因此“融合后的入口仍然启动本模块”即：入口类的某个方法仍然发出本模块特有的启动调用。
            [
                    [key: "main", entrypoint: "dev.caecorthus.sparkdlc.SparkDLC",
                     startOwner: "dev/caecorthus/sparkdlc/trait/registry/SparkTraitsBuiltInTraits", startCall: "register"],
                    [key: "client", entrypoint: "dev.caecorthus.sparkdlc.client.SparkDLCClient",
                     startOwner: "dev/caecorthus/sparkdlc/client/trait/killer/NewKillerTraitsClient", startCall: "initialize"]
            ].each { fused ->
                if (!(metadata.entrypoints?.get(fused.key) ?: []).contains(fused.entrypoint)) {
                    throw new GradleException("Missing ${fused.key} entrypoint ${fused.entrypoint} in ${jarFile.name}")
                }
                def entrypointNode = readClassNode(zipFile, fused.entrypoint.replace('.', '/') + ".class")
                def startsModule = entrypointNode.methods.any { method ->
                    method.instructions.toArray().any {
                        it instanceof org.objectweb.asm.tree.MethodInsnNode && it.owner == fused.startOwner
                                && it.name == fused.startCall
                    }
                }
                if (!startsModule) {
                    throw new GradleException(
                            "${fused.entrypoint} no longer calls ${fused.startOwner}#${fused.startCall} in ${jarFile.name}"
                    )
                }
            }

            // Stage 3: one voice chat plugin for the whole mod; it carries the Depression mute.
            // 第三阶段：全模组只有一个语音插件，抑郁静音由它承载。
            def voicechatEntrypoint = "dev.caecorthus.sparkdlc.voice.SparkDlcVoiceChatPlugin"
            def voicechatEntrypoints = metadata.entrypoints?.voicechat ?: []
            if (!voicechatEntrypoints.contains(voicechatEntrypoint)) {
                throw new GradleException("Missing voicechat entrypoint ${voicechatEntrypoint} in ${jarFile.name}")
            }

            // fabric.mod.json is now shared by five modules: the two merged mixin configs, which carry the traits
            // mixins since the stage-1 package move, must stay listed, the client one for the client environment
            // only, or the mixin checks below and in the selector tasks guard nothing.
            // fabric.mod.json 现在由五个模块共用：两份合并后的 mixin 配置（第一阶段包搬迁之后由它们承载 traits 的 mixin）
            // 都必须保持列出，其中客户端配置仅限客户端环境，否则下方以及选择器任务中的 mixin 校验就失去意义。
            def listedMixins = metadata.mixins ?: []
            if (!listedMixins.contains("sparkdlc.mixins.json")) {
                throw new GradleException("sparkdlc.mixins.json is not listed in fabric.mod.json of ${jarFile.name}")
            }
            if (!listedMixins.any {
                it instanceof Map && it.config == "sparkdlc.client.mixins.json" && it.environment == "client"
            }) {
                throw new GradleException(
                        "sparkdlc.client.mixins.json is not listed for the client environment in fabric.mod.json of ${jarFile.name}"
                )
            }

            verifyTraitsProvidedModIds(metadata, jarFile.name)

            def clientMixinEntry = zipFile.getEntry("sparkdlc.client.mixins.json")
            if (clientMixinEntry == null) {
                throw new GradleException("Missing sparkdlc.client.mixins.json in ${jarFile.name}")
            }
            def clientMixinConfig = new groovy.json.JsonSlurper().parse(zipFile.getInputStream(clientMixinEntry))
            [
                    "trait.CautiousClientWorldSoundMixin",
                    "trait.CautiousPresenceFootstepsVolumeMixin"
            ].each { requiredMixin ->
                if (!(clientMixinConfig.client ?: []).contains(requiredMixin)) {
                    throw new GradleException("Missing client mixin ${requiredMixin} in ${jarFile.name}")
                }
            }

            [
                    "dev/caecorthus/sparkdlc/trait/api/SparkTraitsApi.class",
                    "dev/caecorthus/sparkdlc/bridge/traits/SparkWitchKillAttributionBridge.class",
                    "dev/caecorthus/sparkdlc/client/SparkDLCClient.class",
                    "dev/caecorthus/sparkdlc/client/trait/audio/CautiousSoundDebug.class",
                    "dev/caecorthus/sparkdlc/client/trait/audio/DepressionRageLoopController.class",
                    "dev/caecorthus/sparkdlc/client/trait/audio/DepressionRageLoopSoundInstance.class",
                    "dev/caecorthus/sparkdlc/client/mixin/trait/CautiousClientWorldSoundMixin.class",
                    "dev/caecorthus/sparkdlc/client/mixin/trait/CautiousPresenceFootstepsVolumeMixin.class",
                    "dev/caecorthus/sparkdlc/trait/global/CautiousSoundRules.class",
                    "dev/caecorthus/sparkdlc/net/version/SparkDlcServerConnection.class",
                    "dev/caecorthus/sparkdlc/net/version/SparkDlcVersionHandshake.class",
                    "dev/caecorthus/sparkdlc/net/version/SparkDlcServerConfirmS2CPacket.class",
                    "dev/caecorthus/sparkdlc/client/net/version/SparkDlcClientVersionHandshake.class",
                    "dev/caecorthus/sparkdlc/voice/SparkDlcVoiceChatPlugin.class"
            ].each { requiredEntry ->
                // Runtime compatibility depends on these packaged confirmation and optional voice bridge classes.
                // 运行时兼容依赖这些随 jar 发布的确认类和可选语音桥类。
                if (zipFile.getEntry(requiredEntry) == null) {
                    throw new GradleException("Missing required runtime class ${requiredEntry} in ${jarFile.name}")
                }
            }
        } finally {
            zipFile.close()
        }
    }
}

def publicFacade = "src/main/java/dev/caecorthus/sparkdlc/trait/api/SparkTraitsApi.java"
def publicFacadeContractTest = "src/test/java/dev/caecorthus/sparkdlc/trait/api/SparkTraitsApiContractTest.java"
def syncVisibilityContractTest = "src/test/java/dev/caecorthus/sparkdlc/trait/component/TraitSyncVisibilityTest.java"
// src/test/ is gitignored and local-only, so the two contract tests are required only in a checkout that has the
// local test tree; a fresh clone (CI) skips them. In SparkDLC src/test/ itself exists on a fresh clone (a few assist
// tests are tracked), so the condition is the traits module's own local tests. Before the stage-1 package move that
// was "its test package exists"; the tests left that package with the move, so `legacyModules.localTestsPresent` now
// answers from the local test manifest (src/test/.unify-file-moves.tsv) instead.
// src/test/ 已被 gitignore 且仅存于本地，因此只在拥有本地测试树的检出中要求这两个契约测试；全新克隆（CI）会跳过。
// 在 SparkDLC 中，全新克隆也存在 src/test/（assist 有少量已跟踪的测试），因此改以 traits 模块自己的本地测试是否存在为条件。
// 第一阶段包搬迁之前这等同于“它的测试包存在”；测试随搬迁离开了该包，因此现在由 `legacyModules.localTestsPresent`
// 根据本地测试清单（src/test/.unify-file-moves.tsv）回答。
apply from: rootProject.file("gradle/verify/legacy-modules.gradle")
def localContractTests = [publicFacadeContractTest, syncVisibilityContractTest]

// ADAPT: the Wathe / NoellesRoles jar checks stay (now in libs/, pinned in the root gradle.properties). The
// SparkFactionAPI jar pin, its embedded Wathe predicate and the `depends sparkfactionapi` predicate are gone with the
// sibling jar; the processed metadata must instead identify `sparkdlc` and provide the legacy ids
// (see verifyTraitsProvidedModIds).
// 调整：Wathe / NoellesRoles jar 校验保留（现位于 libs/，校验和固定在根 gradle.properties）。SparkFactionAPI jar 的校验和
// 固定、其内嵌的 Wathe 谓词以及 `depends sparkfactionapi` 谓词随兄弟 jar 一并移除；处理后的元数据改为必须标识 `sparkdlc`
// 并通过 provides 提供旧 mod id（见 verifyTraitsProvidedModIds）。
def verifyTraitsArchitecture = tasks.register("verifyTraitsArchitecture") {
    group = "verification"
    description = "Verifies the traits module's architecture governance, public facade, and local dependency metadata."
    inputs.file(publicFacade)
    inputs.files(localContractTests)
    inputs.file(watheJarName)
    inputs.file(noellesRolesJarName)
    inputs.file("src/main/resources/fabric.mod.json")
    dependsOn tasks.named("processResources")
    inputs.file(layout.buildDirectory.file("resources/main/fabric.mod.json"))
    inputs.file("gradle.properties")

    doLast {
        def requiredPaths = [publicFacade]
        if (legacyModules.localTestsPresent("traits")) {
            requiredPaths += localContractTests
        } else {
            logger.lifecycle("No local traits tests under src/test: skipped ${localContractTests.size()} local-only architecture contract tests.")
        }
        def missingPaths = requiredPaths.findAll { !file(it).isFile() }
        if (!missingPaths.isEmpty()) {
            throw new GradleException("Missing architecture contract files: ${missingPaths.join(', ')}")
        }

        def verifyDependencyJar = { String jarName, String expectedId, String expectedVersion, String expectedSha256 ->
            def dependencyJarFile = file(jarName)
            if (!dependencyJarFile.isFile()) {
                throw new GradleException("Missing aligned dependency jar: ${dependencyJarFile.name}")
            }

            def actualSha256 = java.security.MessageDigest.getInstance("SHA-256")
                    .digest(dependencyJarFile.bytes)
                    .encodeHex()
                    .toString()
            if (actualSha256 != expectedSha256) {
                throw new GradleException(
                        "Dependency checksum mismatch for ${jarName}: expected ${expectedSha256}, found ${actualSha256}"
                )
            }

            def dependencyJar = new java.util.zip.ZipFile(dependencyJarFile)
            try {
                def metadataEntry = dependencyJar.getEntry("fabric.mod.json")
                if (metadataEntry == null) {
                    throw new GradleException("Missing fabric.mod.json in ${jarName}")
                }
                def jarMetadata = new groovy.json.JsonSlurper().parse(dependencyJar.getInputStream(metadataEntry))
                if (jarMetadata.id?.toString() != expectedId || jarMetadata.version?.toString() != expectedVersion) {
                    throw new GradleException(
                            "Dependency metadata mismatch for ${jarName}: expected ${expectedId} ${expectedVersion}, " +
                                    "found ${jarMetadata.id} ${jarMetadata.version}"
                    )
                }
                return jarMetadata
            } finally {
                dependencyJar.close()
            }
        }

        verifyDependencyJar(
                watheJarName,
                "wathe",
                project.wathe_version.toString(),
                project.wathe_sha256.toString()
        )
        def noellesRolesMetadata = verifyDependencyJar(
                noellesRolesJarName,
                "noellesroles",
                project.noellesroles_version.toString(),
                project.noellesroles_sha256.toString()
        )
        if (noellesRolesMetadata.depends?.wathe?.toString() != project.wathe_version.toString()) {
            throw new GradleException(
                    "NoellesRoles embedded Wathe dependency mismatch: expected ${project.wathe_version}, " +
                            "found ${noellesRolesMetadata.depends?.wathe}"
            )
        }

        def metadata = new groovy.json.JsonSlurper().parse(file("src/main/resources/fabric.mod.json"))
        def expectedWatheVersionTemplate = '${wathe_version}'
        if (metadata.depends?.wathe != expectedWatheVersionTemplate) {
            throw new GradleException(
                    "Wathe metadata mismatch: expected ${expectedWatheVersionTemplate}, found ${metadata.depends?.wathe}"
            )
        }
        def expectedNoellesRolesVersionTemplate = '${noellesroles_version}'
        if (metadata.depends?.noellesroles != expectedNoellesRolesVersionTemplate) {
            throw new GradleException(
                    "NoellesRoles metadata mismatch: expected ${expectedNoellesRolesVersionTemplate}, " +
                            "found ${metadata.depends?.noellesroles}"
            )
        }

        def processedMetadataFile = layout.buildDirectory.file("resources/main/fabric.mod.json").get().asFile
        if (!processedMetadataFile.isFile()) {
            throw new GradleException("Missing processed metadata: ${processedMetadataFile}")
        }
        def processedMetadata = new groovy.json.JsonSlurper().parse(processedMetadataFile)
        // The mod id is now `sparkdlc`; the legacy `sparktraits` id lives on under `provides` (checked below).
        // mod id 现在是 `sparkdlc`；旧的 `sparktraits` id 保留在 `provides` 中（见下方校验）。
        if (processedMetadata.id?.toString() != "sparkdlc" ||
                processedMetadata.version?.toString() != project.mod_version.toString()) {
            throw new GradleException(
                    "Processed metadata must identify sparkdlc ${project.mod_version}; " +
                            "found ${processedMetadata.id} ${processedMetadata.version}"
            )
        }
        [
                wathe           : project.wathe_version.toString(),
                noellesroles    : project.noellesroles_version.toString()
        ].each { modId, expectedVersion ->
            if (processedMetadata.depends?.get(modId)?.toString() != expectedVersion) {
                throw new GradleException(
                        "Processed metadata dependency ${modId} must be ${expectedVersion}; " +
                                "found ${processedMetadata.depends?.get(modId)}"
                )
            }
        }
        verifyTraitsProvidedModIds(processedMetadata, "processed fabric.mod.json")
    }
}

// Aggregate for the traits module; the root build's verifyAll depends on it.
// traits 模块的汇总任务；根构建的 verifyAll 依赖它。
tasks.register("verifyTraits") {
    group = "verification"
    description = "Runs every traits-module verify task."
    dependsOn verifyTraitsAssassinScreenSelector
    dependsOn verifyTraitsInventoryScreenSelector
    dependsOn verifyTraitsModJar
    dependsOn verifyTraitsArchitecture
}
