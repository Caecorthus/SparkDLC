// Selectors and descriptors the mod's mixins name in the classes of the pinned upstream jars (Wathe, NoellesRoles;
// see gradle/verify/upstream.gradle for the jars themselves). The source selectors are Yarn names; what ships is the
// remapped jar, so these tasks compare what remapJar actually produced with the intermediary upstream jars. A renamed
// or renumbered upstream member must fail here instead of silently skipping an injection at runtime.
//
// Two tasks:
// - verifyUpstreamMixinSelectors: the table of required injections (one row per handler: config entry, annotation,
//   selector, optional @At target and @Mixin priority, the upstream member it must resolve to);
// - verifyNoellesRolesLambdaSelectors: the injections bound to a javac-numbered lambda of NoellesRoles, which use
//   `require = 0` on purpose and therefore need the pinned jar to prove they still hit.
// Vanilla targets stay pinned by the local tests.
//
// 本模组的 mixin 在固定上游 jar（Wathe、NoellesRoles；jar 本身见 gradle/verify/upstream.gradle）的类中点名的选择器与描述符。
// 源码选择器为 Yarn 名称；实际发布的是重映射后的 jar，因此这些任务把 remapJar 的真实产物与 intermediary 的上游 jar 相比较。
// 上游成员被改名或重新编号时必须在这里失败，而不是在运行时悄悄跳过注入。
// 两个任务：
// - verifyUpstreamMixinSelectors：必需注入的表（每个处理方法一行：配置条目、注解、选择器、可选的 @At 目标与 @Mixin 优先级，
//   以及它必须解析到的上游成员）；
// - verifyNoellesRolesLambdaSelectors：绑定到 NoellesRoles 由 javac 编号的 lambda 的注入，它们有意使用 `require = 0`，
//   因此需要固定的 jar 来证明仍然命中。
// 原版目标仍由本地测试固定。

// See gradle/verify/support.gradle: this block must stay identical to the one there.
// 见 gradle/verify/support.gradle：这一段必须与那里的保持完全一致。
buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.ow2.asm:asm-tree:9.9"
        classpath "org.ow2.asm:asm-analysis:9.9"
    }
}
verifySupport.requireSharedAsm(org.objectweb.asm.tree.ClassNode)

def remappedModJar = verifySupport.remappedModJar
def readClassNode = verifySupport.readClassNode
def annotationValue = verifySupport.annotationValue

