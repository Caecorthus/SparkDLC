tasks.register("verifyUpstreamMixinSelectors") {
    group = "verification"
    description = "Checks the client and common mixin selectors shipped in the remapped jar against the pinned Wathe/NoellesRoles jars."
    dependsOn remappedModJar
    inputs.file(remappedModJar.flatMap { it.archiveFile })
    inputs.file("libs/wathe-${project.wathe_version}.jar")
    inputs.file("libs/noellesroles-${project.noellesroles_version}.jar")
    inputs.file("src/client/resources/sparkdlc.client.mixins.json")
    inputs.file("src/main/resources/sparkdlc.mixins.json")

    doLast {
        def jarFile = remappedModJar.get().archiveFile.get().asFile
        def watheJar = file("libs/wathe-${project.wathe_version}.jar")
        def noellesRolesJar = file("libs/noellesroles-${project.noellesroles_version}.jar")
        def modZip = new java.util.zip.ZipFile(jarFile)
        def watheZip = new java.util.zip.ZipFile(watheJar)
        def noellesRolesZip = new java.util.zip.ZipFile(noellesRolesJar)
        // Source selectors are Yarn; this checks what remapJar actually ships against the intermediary provider jars.
        // 源码选择器为 Yarn；此处校验 remapJar 实际产出的选择器与 intermediary 提供方 jar 一致。
        def providerZips = [
                wathe: [zip: watheZip, label: "Wathe ${project.wathe_version}"],
                noellesroles: [zip: noellesRolesZip, label: "NoellesRoles ${project.noellesroles_version}"]
        ]
        try {
            def configEntry = modZip.getEntry("sparkdlc.client.mixins.json")
            if (configEntry == null) {
                throw new GradleException("Missing sparkdlc.client.mixins.json in ${jarFile.name}")
            }
            def config = new groovy.json.JsonSlurper().parse(modZip.getInputStream(configEntry))
            if (config.required != true) {
                throw new GradleException("Client mixin config must remain required in ${jarFile.name}")
            }
            if (config.injectors?.defaultRequire?.toString() != "1") {
                throw new GradleException(
                        "Client mixin defaultRequire drift: expected 1, found ${config.injectors?.defaultRequire}"
                )
            }
            def configuredMixins = config.client ?: []
            def commonConfigEntry = modZip.getEntry("sparkdlc.mixins.json")
            if (commonConfigEntry == null) {
                throw new GradleException("Missing sparkdlc.mixins.json in ${jarFile.name}")
            }
            def commonConfig = new groovy.json.JsonSlurper().parse(modZip.getInputStream(commonConfigEntry))
            if (commonConfig.injectors?.defaultRequire?.toString() != "1") {
                throw new GradleException(
                        "Common mixin defaultRequire drift: expected 1, found ${commonConfig.injectors?.defaultRequire}"
                )
            }
            def commonMixins = commonConfig.mixins ?: []
            def providerNodes = [:]

            def allContracts = watheClientMixinContracts.collect { it + [common: false] } +
                    watheCommonMixinContracts.collect { it + [common: true] }
            allContracts.each { contract ->
                def configLabel = contract.common ? "sparkdlc.mixins.json" : "sparkdlc.client.mixins.json"
                if (!(contract.common ? commonMixins : configuredMixins).contains(contract.configName)) {
                    throw new GradleException(
                            "Missing ${contract.common ? 'common' : 'client'} mixin ${contract.configName} from ${configLabel}"
                    )
                }

                def mixinNode = readClassNode(modZip, contract.mixinEntry)
                if (contract.priority != null) {
                    def classAnnotations = []
                    classAnnotations.addAll(mixinNode.visibleAnnotations ?: [])
                    classAnnotations.addAll(mixinNode.invisibleAnnotations ?: [])
                    def mixinAnnotation = classAnnotations.find { it.desc == "Lorg/spongepowered/asm/mixin/Mixin;" }
                    def priority = annotationValue(mixinAnnotation, "priority")
                    if (priority?.toString() != contract.priority.toString()) {
                        throw new GradleException(
                                "Mixin priority drift for ${contract.mixinEntry}: expected ${contract.priority}, found ${priority}"
                        )
                    }
                }
                def handler = mixinNode.methods.find { it.name == contract.handler }
                if (handler == null) {
                    throw new GradleException("Missing handler ${contract.handler} in ${contract.mixinEntry}")
                }
                def annotations = []
                annotations.addAll(handler.visibleAnnotations ?: [])
                annotations.addAll(handler.invisibleAnnotations ?: [])
                def injection = annotations.find { it.desc == contract.annotationDesc }
                if (injection == null) {
                    throw new GradleException(
                            "Missing ${contract.annotationDesc} on ${contract.mixinEntry}#${contract.handler}"
                    )
                }
                def selectorValue = annotationValue(injection, "method")
                def selectors = selectorValue instanceof Collection
                        ? selectorValue.collect { it.toString() }
                        : [selectorValue?.toString()].findAll { it != null }
                if (selectors != [contract.selector]) {
                    throw new GradleException(
                            "Packaged selector drift for ${contract.mixinEntry}#${contract.handler}: "
                                    + "expected ${contract.selector}, found ${selectors}"
                    )
                }
                if (annotationValue(injection, "require")?.toString() == "0") {
                    throw new GradleException(
                            "Required client injection was weakened with require=0: "
                                    + "${contract.mixinEntry}#${contract.handler}"
                    )
                }

                if (contract.atTarget != null) {
                    def atValue = annotationValue(injection, "at")
                    def atAnnotations = atValue instanceof Collection ? atValue : [atValue]
                    def atTargets = atAnnotations.collect { annotationValue(it, "target") }
                            .findAll { it != null }
                            .collect { it.toString() }
                    if (atTargets != [contract.atTarget]) {
                        throw new GradleException(
                                "Packaged @At target drift for ${contract.mixinEntry}#${contract.handler}: "
                                        + "expected ${contract.atTarget}, found ${atTargets}"
                        )
                    }
                }

                def provider = providerZips[contract.provider ?: "wathe"]
                def providerNode = providerNodes.computeIfAbsent(contract.providerEntry) {
                    readClassNode(provider.zip, contract.providerEntry)
                }
                def providerMethod = providerNode.methods.find {
                    it.name == contract.providerMethod && it.desc == contract.providerDescriptor
                }
                if (providerMethod == null) {
                    throw new GradleException(
                            "${provider.label} is missing ${contract.providerEntry}#"
                                    + "${contract.providerMethod}${contract.providerDescriptor}"
                    )
                }
            }
        } finally {
            noellesRolesZip.close()
            watheZip.close()
            modZip.close()
        }
    }
}

// The javac lambda numbers of NoellesRoles' packet handlers in the pinned jar (`noellesroles_sha256`). Its
// AbilityC2SPacket handler is $5; the historical Windows build of the same sources numbers it $36. Moving the pin
// means reading these numbers again from the new jar.
// 固定 jar（`noellesroles_sha256`）中 NoellesRoles 数据包处理函数的 javac lambda 编号。其 AbilityC2SPacket 处理函数为 $5；
// 同一源码的旧 Windows 构建编号为 $36。改动该钉值时必须从新 jar 重新确认这些编号。
def noellesRolesLambdas = [
        abilityHandler : "lambda\$registerPackets\$5",
        // The Assassin guess and Swapper swap handlers, where the stage-2 Undercover's immunities cancel them.
        // 刺客猜测与交换者交换的处理函数，二阶段卧底的免疫在此取消它们。
        assassinHandler: "lambda\$registerPackets\$6",
        swapperHandler : "lambda\$registerPackets\$4"
]

tasks.register("verifyNoellesRolesLambdaSelectors") {
    group = "verification"
    description = "Checks the mixins bound to a numbered NoellesRoles packet lambda (Corrupt Cop ability, Undercover immunities, Assassin guess) against the pinned NoellesRoles jar."
    dependsOn remappedModJar
    inputs.file(remappedModJar.flatMap { it.archiveFile })
    inputs.file(verifySupport.noellesRolesJar)

    doLast {
        def jarFile = remappedModJar.get().archiveFile.get().asFile
        def zipFile = new java.util.zip.ZipFile(jarFile)
        try {
            def corruptCopMixinEntry = "dev/caecorthus/sparkdlc/mixin/role/jiahao/corruptcop/CorruptCopAbilityPacketMixin.class"
            def corruptCopMixin = readClassNode(zipFile, corruptCopMixinEntry)
            def packetDescriptor = "(Lorg/agmas/noellesroles/packet/AbilityC2SPacket;" +
                    "Lnet/fabricmc/fabric/api/networking/v1/ServerPlayNetworking\$Context;)V"
            def binarySelectors = [
                    "sparkdlc\$toggleCorruptCopAbilityHistorical" : "lambda\$registerPackets\$36${packetDescriptor}",
                    "sparkdlc\$toggleCorruptCopAbilityShared"     : "lambda\$registerPackets\$5${packetDescriptor}"
            ]
            binarySelectors.each { handlerName, expectedSelector ->
                def handler = corruptCopMixin.methods.find { it.name == handlerName }
                if (handler == null) {
                    throw new GradleException("Missing remapped CorruptCop handler ${handlerName}")
                }
                def annotations = []
                annotations.addAll(handler.visibleAnnotations ?: [])
                annotations.addAll(handler.invisibleAnnotations ?: [])
                def injection = annotations.find {
                    it.desc == "Lorg/spongepowered/asm/mixin/injection/Inject;"
                }
                def group = annotations.find {
                    it.desc == "Lorg/spongepowered/asm/mixin/injection/Group;"
                }
                if (injection == null || group == null) {
                    throw new GradleException("Missing @Inject/@Group on CorruptCop handler ${handlerName}")
                }
                def selectorValue = annotationValue(injection, "method")
                def selectors = selectorValue instanceof Collection
                        ? selectorValue.collect { it.toString() }
                        : [selectorValue?.toString()].findAll { it != null }
                if (selectors != [expectedSelector]) {
                    throw new GradleException(
                            "Packaged CorruptCop selector drift for ${handlerName}: expected ${expectedSelector}, found ${selectors}"
                    )
                }
                if (annotationValue(injection, "require")?.toString() != "0") {
                    throw new GradleException("Binary-specific CorruptCop injection must use require=0 within its group")
                }
                if (annotationValue(group, "name")?.toString() != "sparkdlc\$corruptCopAbility" ||
                        annotationValue(group, "min")?.toString() != "1" ||
                        annotationValue(group, "max")?.toString() != "1") {
                    throw new GradleException(
                            "CorruptCop compatibility group must require exactly one injection: ${handlerName}"
                    )
                }
            }

            // Like the mixin's @Group(min = 1, max = 1): of both selectors, only the pinned jar's handler may resolve.
            // 与 mixin 的 @Group(min = 1, max = 1) 一致：两个入口中只能命中锁定 jar 的那一个。
            def verifyProviderSeam = { File providerJar, String handlerName ->
                def providerZip = new java.util.zip.ZipFile(providerJar)
                try {
                    def noellesRoles = readClassNode(providerZip, "org/agmas/noellesroles/Noellesroles.class")
                    def expectedSelector = "${handlerName}${packetDescriptor}".toString()
                    def resolvedSelectors = binarySelectors.values().collect { it.toString() }.findAll { selector ->
                        noellesRoles.methods.any { it.name + it.desc == selector }
                    }
                    if (resolvedSelectors != [expectedSelector]) {
                        throw new GradleException(
                                "${providerJar.name} must resolve exactly ${expectedSelector} among the CorruptCop " +
                                        "selectors; found ${resolvedSelectors}"
                        )
                    }
                } finally {
                    providerZip.close()
                }
            }
            verifyProviderSeam(
                    verifySupport.noellesRolesJar,
                    noellesRolesLambdas.abilityHandler
            )

            // The Undercover's Assassin and swap immunities each bind one exact lambda with require = 0: a renumbered
            // NoellesRoles build must fail here instead of silently losing the immunity.
            // 卧底的刺杀免疫与交换免疫各以 require = 0 绑定一个确切的 lambda：NoellesRoles 编号变化必须在这里失败，
            // 而不是悄悄失去免疫。
            def verifyUndercoverImmunity = { label, mixinName, handlerMethod, providerHandler, packet ->
                def expectedSelector = ("${providerHandler}(Lorg/agmas/noellesroles/packet/${packet};" +
                        "Lnet/fabricmc/fabric/api/networking/v1/ServerPlayNetworking\$Context;)V").toString()
                def mixinNode = readClassNode(zipFile, "dev/caecorthus/sparkdlc/mixin/role/civilian/undercover/${mixinName}.class")
                def handlerNode = mixinNode.methods.find { it.name == handlerMethod }
                if (handlerNode == null) {
                    throw new GradleException("Missing remapped Undercover ${label} immunity handler")
                }
                def injection = ((handlerNode.visibleAnnotations ?: []) +
                        (handlerNode.invisibleAnnotations ?: [])).find {
                    it.desc == "Lorg/spongepowered/asm/mixin/injection/Inject;"
                }
                def selectors = annotationValue(injection, "method")
                selectors = selectors instanceof Collection
                        ? selectors.collect { it.toString() }
                        : [selectors?.toString()].findAll { it != null }
                if (selectors != [expectedSelector]) {
                    throw new GradleException(
                            "Undercover ${label} selector drift: expected ${expectedSelector}, found ${selectors}")
                }
                def provider = new java.util.zip.ZipFile(verifySupport.noellesRolesJar)
                try {
                    def noellesRoles = readClassNode(provider, "org/agmas/noellesroles/Noellesroles.class")
                    if (!noellesRoles.methods.any { it.name + it.desc == expectedSelector }) {
                        throw new GradleException(
                                "${provider.name} has no ${expectedSelector} for the Undercover ${label} immunity")
                    }
                } finally {
                    provider.close()
                }
            }
            verifyUndercoverImmunity("Assassin", "UndercoverAssassinImmunityMixin",
                    "sparkdlc\$stage2UndercoverCannotBeAssassinated",
                    noellesRolesLambdas.assassinHandler, "AssassinGuessRoleC2SPacket")
            verifyUndercoverImmunity("Swapper", "UndercoverSwapImmunityMixin",
                    "sparkdlc\$stage2UndercoverCannotBeSwapped",
                    noellesRolesLambdas.swapperHandler, "SwapperC2SPacket")

            // The Assassin buff (silent, forgiven first miss; 3 s cooldown after a correct guess) binds the same guess
            // lambda with require = 0, through @WrapOperation and @Inject: every selector must still name the pinned
            // handler.
            // 刺客加强（首次猜错无声免死、猜对后 3 秒冷却）同样以 require = 0 绑定这个猜测 lambda（@WrapOperation 与 @Inject）：
            // 每个选择器都必须仍指向锁定的处理函数。
            def assassinGuessSelector = ("${noellesRolesLambdas.assassinHandler}" +
                    "(Lorg/agmas/noellesroles/packet/AssassinGuessRoleC2SPacket;" +
                    "Lnet/fabricmc/fabric/api/networking/v1/ServerPlayNetworking\$Context;)V").toString()
            def assassinGuessMixin = readClassNode(
                    zipFile, "dev/caecorthus/sparkdlc/mixin/compat/noellesroles/AssassinGuessOutcomeMixin.class")
            [
                    "sparkdlc\$forgivenMissIsSilent"      :
                            "Lcom/llamalad7/mixinextras/injector/wrapoperation/WrapOperation;",
                    "sparkdlc\$firstMissIsForgiven"        :
                            "Lcom/llamalad7/mixinextras/injector/wrapoperation/WrapOperation;",
                    "sparkdlc\$correctGuessCoolsDownFast" : "Lorg/spongepowered/asm/mixin/injection/Inject;"
            ].each { handlerMethod, annotationDesc ->
                def handlerNode = assassinGuessMixin.methods.find { it.name == handlerMethod }
                if (handlerNode == null) {
                    throw new GradleException("Missing remapped Assassin guess handler ${handlerMethod}")
                }
                def injection = ((handlerNode.visibleAnnotations ?: []) +
                        (handlerNode.invisibleAnnotations ?: [])).find { it.desc == annotationDesc }
                def selectors = annotationValue(injection, "method")
                selectors = selectors instanceof Collection
                        ? selectors.collect { it.toString() }
                        : [selectors?.toString()].findAll { it != null }
                if (selectors != [assassinGuessSelector]) {
                    throw new GradleException("Assassin guess selector drift on ${handlerMethod}: expected " +
                            "${assassinGuessSelector}, found ${selectors}")
                }
            }
        } finally {
            zipFile.close()
        }
    }
}
