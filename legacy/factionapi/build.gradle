                    "cooldown.ItemCooldownManagerAccessor",
                    "EntityAffectMixin",
                    "EntityCollisionMixin",
                    "GameFunctionsPlayerAffectMixin",
                    "GameSettingsCommandMixin",
                    "GunShootPayloadReceiverMixin",
                    "KnifeStabPayloadReceiverMixin",
                    "LivingEntityCollisionMixin",
                    "MurderGameModeMixin",
                    "MurderGameModePassiveMoneyMixin",
                    "PlayerEntityAffectMixin",
                    "ServerPlayerEntityAffectMixin",
                    "WorldProjectileAffectMixin",
                    "GameRoundEndComponentMixin",
                    "GameWorldComponentReplayMixin",
                    "ReplayGeneratorMixin",
                    "record.GameFunctionsKillSnapshotMixin",
                    "record.GameRecordManagerDeathMixin",
                    "record.GameRecordManagerIncomeMixin",
                    "record.ItemStackConsumeMixin",
                    "record.PlayerShopComponentIncomeMixin",
                    "record.PoisonUtilsConsumeMixin",
                    "mapreset.AutoStartComponentMapResetMixin",
                    "mapreset.CommandManagerMapResetMixin",
                    "mapreset.GameFunctionsMapResetMixin",
                    "mapreset.MapVotingComponentMapResetMixin",
                    "inventory.PlayerInventoryRowOrderMixin",
                    "inventory.ScreenHandlerPsychoSecondRowMixin",
                    "inventory.ShopEntrySecondRowMixin",
                    "AntiFastRoundPayloadGuardMixin",
                    "team.GameFunctionsLetterNameMixin",
                    "team.PlayerEntityTeamTagMixin"
            ],
                    "sparkfactionapi.client.mixins.json": [
                            "RoundTextRendererMixin",
                            "inventory.LimitedHandledScreenSecondRowMixin",
                            "inventory.LimitedInventoryScreenSecondRowMixin",
                            "team.NoellesPuppetNameTeamTagMixin",
                            "team.PlayerListHudTeamTagMixin",
                            "team.RoleNameRendererTeamTagMixin"
                    ]
            ].each { mixinConfigEntry, requiredMixins ->
                def mixinEntry = zipFile.getEntry(mixinConfigEntry)
                if (mixinEntry == null) {
                    throw new GradleException("Missing mixin config ${mixinConfigEntry} in ${jarFile.name}")
                }
                def mixinConfig = new groovy.json.JsonSlurper().parse(zipFile.getInputStream(mixinEntry))
                def configuredMixins = (mixinConfig.mixins ?: []) + (mixinConfig.client ?: []) + (mixinConfig.server ?: [])
                requiredMixins.each { requiredMixin ->
                    if (!configuredMixins.contains(requiredMixin)) {
                        throw new GradleException("Missing mixin ${requiredMixin} in ${mixinConfigEntry} inside ${jarFile.name}")
                    }
                }
            }
        } finally {
            zipFile.close()
        }
    }
}

