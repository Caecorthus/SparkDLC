                    "dev/caecorthus/sparkdlc/factionapi/mixin/compat/sparkstrength/CriminologistAffectMixin.class",
                    "dev/caecorthus/sparkdlc/factionapi/client/net/SparkFactionClientVersionHandshake.class",
                    "dev/caecorthus/sparkdlc/factionapi/net/SparkFactionVersionHandshake.class",
                    "dev/caecorthus/sparkdlc/factionapi/net/SparkFactionVersionCheck.class",
