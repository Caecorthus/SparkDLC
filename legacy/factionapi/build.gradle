tasks.register("verifyArchitecture") {
    group = "verification"
    description = "Verifies public compatibility and representative contract tests."
    inputs.files(contractFiles.collect { file(it) })
    inputs.files(architectureContractFiles.collect { file(it) })

    doLast {
        (contractFiles + architectureContractFiles).each { requiredPath ->
            if (!file(requiredPath).isFile()) {
                throw new GradleException("Missing architecture contract file: ${requiredPath}")
            }
        }
    }
}

tasks.named("check") {
    setDependsOn([])
}


java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

tasks.withType(JavaExec).configureEach {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        javaLauncher.set(javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(targetJavaVersion)
        })
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
    from("LICENSE-TEXTURES.md") {
        rename { "LICENSE-TEXTURES_${project.base.archivesName.get()}.md" }
    }
}
